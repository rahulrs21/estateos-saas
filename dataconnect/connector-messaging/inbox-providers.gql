# Phase 7A.4: channel connections, verified webhooks, durable inbox events, delivery
# receipts and attachment records (docs/CHANNEL_ADAPTERS.md, docs/INBOX_SECURITY.md).
# Credentials never pass through these operations: credentialReference and
# accessTokenReference are only names of server secrets (INBOX_...). Only the
# server-only operations below, after a live check with the provider (Phase 7B),
# can mark a connection VERIFIED or enable sending; editing it undoes both.
# Operations marked NO_ACCESS are server-only.

# --- Connections (OWNER or ADMIN) -------------------------------------------------------------

query ListChannelConnections($organizationId: UUID!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
  admin: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}) @check(expr: "this != null", message: "INBOX_ADMIN_REQUIRED") {id}
  # Company channels only: personal mailboxes (Phase 7C) are listed by MailboxesOverview.
  connections: channelConnections(where: {organizationId: {eq: $organizationId}, ownerMembershipId: {isNull: true}}, orderBy: [{createdAt: ASC}, {id: ASC}], limit: 20) {
    id provider displayName externalAccountReference businessAccountReference connectionStatus credentialReference accessTokenReference accessTokenStoredAt verifiedAt verifiedName verifiedDisplayNumber sendingEnabled
    liveSending liveSendingAt liveSendingBy {displayName} lastEventAt revision createdAt updatedAt createdBy {displayName}
  }
}

# Real providers only (the simulator connection is created by developer tools). Sending stays off.
mutation CreateChannelConnection($organizationId: UUID!, $id: UUID!, $provider: ChannelProvider!, $displayName: String!, $externalAccountReference: String, $credentialReference: String, $accessTokenReference: String,
  $businessAccountReference: String)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.provider in ['WHATSAPP_CLOUD'] && (!has(vars.businessAccountReference) || vars.businessAccountReference == null || vars.businessAccountReference.matches('^[0-9]{5,30}$')) && vars.displayName.size() >= 2 && vars.displayName.size() <= 80 && (!has(vars.credentialReference) || vars.credentialReference == null || vars.credentialReference.matches('^INBOX_[A-Z0-9_]{3,56}$')) && (!has(vars.accessTokenReference) || vars.accessTokenReference == null || vars.accessTokenReference.matches('^INBOX_[A-Z0-9_]{3,56}$')) && (!has(vars.externalAccountReference) || vars.externalAccountReference == null || vars.externalAccountReference.matches('^[A-Za-z0-9_.@+-]{2,200}$'))") @transaction {
  admin: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INBOX_ADMIN_REQUIRED")
  limit: query @redact @check(expr: "this.existing.size() < 10", message: "CHANNEL_CONNECTION_LIMIT") {
    existing: channelConnections(where: {organizationId: {eq: $organizationId}, ownerMembershipId: {isNull: true}}, limit: 10) {id}
  }
  connection: channelConnection_insert(data: {organizationId: $organizationId, id: $id, provider: $provider, displayName: $displayName, externalAccountReference: $externalAccountReference,
    credentialReference: $credentialReference, accessTokenReference: $accessTokenReference, businessAccountReference: $businessAccountReference, sendingEnabled: false, liveSending: false, createdByUid_expr: "auth.uid",
    connectionStatus_expr: "has(vars.credentialReference) && vars.credentialReference != null && has(vars.externalAccountReference) && vars.externalAccountReference != null ? 'CONFIGURED' : 'NOT_CONFIGURED'"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: CHANNEL_CONNECTION_CHANGED, targetType: CHANNEL_CONNECTION, targetId: $id, metadata_expr: "{'event': 'CREATED', 'provider': vars.provider}"})
}

# New details always return the connection to configured (or not configured). A disabled connection stays disabled.
mutation UpdateChannelConnection($organizationId: UUID!, $id: UUID!, $expectedRevision: Int!, $displayName: String!, $externalAccountReference: String, $credentialReference: String, $accessTokenReference: String,
  $businessAccountReference: String)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && (!has(vars.businessAccountReference) || vars.businessAccountReference == null || vars.businessAccountReference.matches('^[0-9]{5,30}$')) && vars.displayName.size() >= 2 && vars.displayName.size() <= 80 && (!has(vars.credentialReference) || vars.credentialReference == null || vars.credentialReference.matches('^INBOX_[A-Z0-9_]{3,56}$')) && (!has(vars.accessTokenReference) || vars.accessTokenReference == null || vars.accessTokenReference.matches('^INBOX_[A-Z0-9_]{3,56}$')) && (!has(vars.externalAccountReference) || vars.externalAccountReference == null || vars.externalAccountReference.matches('^[A-Za-z0-9_.@+-]{2,200}$'))") @transaction {
  admin: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INBOX_ADMIN_REQUIRED")
  before: query @redact {
    connection: channelConnection(key: {organizationId: $organizationId, id: $id}) @check(expr: "this != null && this.revision == vars.expectedRevision && this.provider != 'DEVELOPMENT_SIMULATOR' && this.provider != 'GMAIL' && this.provider != 'MICROSOFT_365' && this.ownerMembershipId == null", message: "CHANNEL_CONNECTION_CHANGED") {revision connectionStatus provider ownerMembershipId}
  }
  connection: channelConnection_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, revision: {eq: $expectedRevision}}}, data: {displayName: $displayName,
    externalAccountReference: $externalAccountReference, credentialReference: $credentialReference, accessTokenReference: $accessTokenReference, businessAccountReference: $businessAccountReference,
    sendingEnabled: false, liveSending: false, liveSendingAt: null, verifiedAt: null,
    connectionStatus_expr: "response.before.connection.connectionStatus == 'DISABLED' ? 'DISABLED' : (has(vars.credentialReference) && vars.credentialReference != null && has(vars.externalAccountReference) && vars.externalAccountReference != null ? 'CONFIGURED' : 'NOT_CONFIGURED')",
    revision_update: {inc: 1}, updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "CHANNEL_CONNECTION_CHANGED")
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: CHANNEL_CONNECTION_CHANGED, targetType: CHANNEL_CONNECTION, targetId: $id, metadata_expr: "{'event': 'UPDATED'}"})
}

# An owner or administrator saves the channel's access token, encrypted by the server first (the ciphertext is bound
# to the company and the connection, so it is useless anywhere else; nobody can read it back through a query). Like
# any change of details, it returns the connection to configured: it must be checked with Meta again before sending.
mutation SaveChannelAccessToken($organizationId: UUID!, $id: UUID!, $expectedRevision: Int!, $tokenCiphertext: String!, $tokenKeyId: String!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.tokenCiphertext.size() >= 40 && vars.tokenCiphertext.size() <= 4000 && vars.tokenKeyId.matches('^k[0-9]{1,3}$')") @transaction {
  admin: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INBOX_ADMIN_REQUIRED")
  before: query @redact {
    connection: channelConnection(key: {organizationId: $organizationId, id: $id}) @check(expr: "this != null && this.revision == vars.expectedRevision && this.provider == 'WHATSAPP_CLOUD' && this.ownerMembershipId == null", message: "CHANNEL_CONNECTION_CHANGED") {revision connectionStatus provider ownerMembershipId credentialReference externalAccountReference}
  }
  credential: channelCredential_upsert(data: {organizationId: $organizationId, channelConnectionId: $id, tokenCiphertext: $tokenCiphertext, tokenKeyId: $tokenKeyId, savedByUid_expr: "auth.uid", savedAt_expr: "request.time"})
  connection: channelConnection_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, revision: {eq: $expectedRevision}}}, data: {accessTokenStoredAt_expr: "request.time", accessTokenReference: null,
    sendingEnabled: false, liveSending: false, liveSendingAt: null, verifiedAt: null,
    connectionStatus_expr: "response.before.connection.connectionStatus == 'DISABLED' ? 'DISABLED' : (response.before.connection.credentialReference != null && response.before.connection.externalAccountReference != null ? 'CONFIGURED' : 'NOT_CONFIGURED')",
    revision_update: {inc: 1}, updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "CHANNEL_CONNECTION_CHANGED")
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: CHANNEL_CONNECTION_CHANGED, targetType: CHANNEL_CONNECTION, targetId: $id, metadata_expr: "{'event': 'ACCESS_TOKEN_SAVED'}"})
}

# The encrypted token of a channel, for the server only (it decrypts it with the key in its own environment).
query ChannelAccessToken($organizationId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  credential: channelCredential(key: {organizationId: $organizationId, channelConnectionId: $id}) {tokenCiphertext tokenKeyId}
}

mutation SetChannelConnectionEnabled($organizationId: UUID!, $id: UUID!, $expectedRevision: Int!, $enabled: Boolean!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") @transaction {
  admin: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INBOX_ADMIN_REQUIRED")
  before: query @redact {
    connection: channelConnection(key: {organizationId: $organizationId, id: $id}) @check(expr: "this != null && this.revision == vars.expectedRevision && this.provider != 'DEVELOPMENT_SIMULATOR' && this.provider != 'GMAIL' && this.provider != 'MICROSOFT_365' && this.ownerMembershipId == null", message: "CHANNEL_CONNECTION_CHANGED") {revision provider credentialReference externalAccountReference ownerMembershipId}
  }
  connection: channelConnection_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, revision: {eq: $expectedRevision}}}, data: {sendingEnabled: false, liveSending: false, liveSendingAt: null, verifiedAt: null,
    connectionStatus_expr: "!vars.enabled ? 'DISABLED' : (response.before.connection.credentialReference != null && response.before.connection.externalAccountReference != null ? 'CONFIGURED' : 'NOT_CONFIGURED')",
    revision_update: {inc: 1}, updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "CHANNEL_CONNECTION_CHANGED")
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: CHANNEL_CONNECTION_CHANGED, targetType: CHANNEL_CONNECTION, targetId: $id, metadata_expr: "{'event': vars.enabled ? 'ENABLED' : 'DISABLED'}"})
}

# --- Live connection check and sending (server only, Phase 7B) --------------------------------

# The connection with its secret names, for a check or a send by an OWNER or ADMIN (the server reads the secrets).
query ChannelConnectionForCheck($organizationId: UUID!, $id: UUID!, $actorUid: String!) @auth(level: NO_ACCESS) {
  admin: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq: $actorUid}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}) @check(expr: "this != null", message: "INBOX_ADMIN_REQUIRED") {id}
  connection: channelConnection(key: {organizationId: $organizationId, id: $id}) {
    id provider connectionStatus externalAccountReference businessAccountReference credentialReference accessTokenReference accessTokenStoredAt sendingEnabled liveSending verifiedAt revision
  }
}

# The provider confirmed the account with the token: VERIFIED (compare-and-set on the revision the check started from).
mutation MarkChannelConnectionChecked($organizationId: UUID!, $id: UUID!, $expectedRevision: Int!, $actorUid: String!, $verified: Boolean!, $verifiedName: String, $verifiedDisplayNumber: String, $errorCode: String)
  @auth(level: NO_ACCESS) @transaction {
  before: query @redact {
    admin: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq: $actorUid}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}) @check(expr: "this != null", message: "INBOX_ADMIN_REQUIRED") {id}
    connection: channelConnection(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, revision: {eq: $expectedRevision}, provider: {eq: WHATSAPP_CLOUD}, connectionStatus: {in: [CONFIGURED, VERIFIED, ERROR]}}})
      @check(expr: "this != null", message: "CHANNEL_CONNECTION_CHANGED") {id}
  }
  verified: channelConnection_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, revision: {eq: $expectedRevision}}},
    data: {connectionStatus: VERIFIED, verifiedAt_expr: "request.time", verifiedName: $verifiedName, verifiedDisplayNumber: $verifiedDisplayNumber, revision_update: {inc: 1}, updatedAt_expr: "request.time"})
    @include(if: $verified) @check(expr: "this != null", message: "CHANNEL_CONNECTION_CHANGED")
  failed: channelConnection_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, revision: {eq: $expectedRevision}}},
    data: {connectionStatus: ERROR, sendingEnabled: false, liveSending: false, liveSendingAt: null, verifiedAt: null, revision_update: {inc: 1}, updatedAt_expr: "request.time"})
    @skip(if: $verified) @check(expr: "this != null", message: "CHANNEL_CONNECTION_CHANGED")
  auditLog_insert(data: {organizationId: $organizationId, actorUid: $actorUid, action: CHANNEL_CONNECTION_CHANGED, targetType: CHANNEL_CONNECTION, targetId: $id,
    metadata_expr: "{'event': vars.verified ? 'VERIFIED' : 'CHECK_FAILED', 'errorCode': vars.errorCode}"})
}

# Sending on or off for a VERIFIED WhatsApp connection. The server allows it only with test recipients configured (7B.1).
mutation SetChannelConnectionSending($organizationId: UUID!, $id: UUID!, $expectedRevision: Int!, $actorUid: String!, $enabled: Boolean!) @auth(level: NO_ACCESS) @transaction {
  before: query @redact {
    admin: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq: $actorUid}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}) @check(expr: "this != null", message: "INBOX_ADMIN_REQUIRED") {id}
    connection: channelConnection(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, revision: {eq: $expectedRevision}, provider: {eq: WHATSAPP_CLOUD}, connectionStatus: {eq: VERIFIED}}})
      @check(expr: "this != null", message: "CHANNEL_CONNECTION_CHANGED") {id liveSending}
  }
  channelConnection_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, revision: {eq: $expectedRevision}}}, data: {sendingEnabled: $enabled,
    liveSending_expr: "vars.enabled && response.before.connection.liveSending", revision_update: {inc: 1}, updatedAt_expr: "request.time"})
    @check(expr: "this != null", message: "CHANNEL_CONNECTION_CHANGED")
  auditLog_insert(data: {organizationId: $organizationId, actorUid: $actorUid, action: CHANNEL_CONNECTION_CHANGED, targetType: CHANNEL_CONNECTION, targetId: $id,
    metadata_expr: "{'event': vars.enabled ? 'SENDING_ENABLED' : 'SENDING_DISABLED'}"})
}

# Phase 7B.2: real customers (any number, not only the server's test numbers). On: an OWNER only, on a VERIFIED
# channel with sending on (the server also requires its own switch). Off: an OWNER or ADMIN. Conditions are inside
# each @check (a skipped field's check would still run).
mutation SetChannelConnectionLiveSending($organizationId: UUID!, $id: UUID!, $expectedRevision: Int!, $actorUid: String!, $enabled: Boolean!) @auth(level: NO_ACCESS) @transaction {
  before: query @redact {
    actor: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq: $actorUid}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}})
      @check(expr: "this != null && (!vars.enabled || this.role == 'OWNER')", message: "INBOX_OWNER_REQUIRED") {role}
    connection: channelConnection(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, revision: {eq: $expectedRevision}, provider: {eq: WHATSAPP_CLOUD}}})
      @check(expr: "this != null && (!vars.enabled || (this.connectionStatus == 'VERIFIED' && this.sendingEnabled))", message: "CHANNEL_CONNECTION_CHANGED") {connectionStatus sendingEnabled}
  }
  channelConnection_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, revision: {eq: $expectedRevision}}}, data: {liveSending: $enabled,
    liveSendingAt_expr: "request.time", liveSendingByUid: $actorUid, revision_update: {inc: 1}, updatedAt_expr: "request.time"})
    @check(expr: "this != null", message: "CHANNEL_CONNECTION_CHANGED")
  auditLog_insert(data: {organizationId: $organizationId, actorUid: $actorUid, action: CHANNEL_CONNECTION_CHANGED, targetType: CHANNEL_CONNECTION, targetId: $id,
    metadata_expr: "{'event': vars.enabled ? 'LIVE_SENDING_ON' : 'LIVE_SENDING_OFF'}"})
}

# A WhatsApp conversation started by the business (7B.1): the thread a reply from the customer will join.
# The first message must be an approved template (the reply pipeline checks and approves it as usual).
mutation StartWhatsAppConversation($organizationId: UUID!, $id: UUID!, $channelConnectionId: UUID!, $actorUid: String!, $customerIdentity: String!, $externalThreadId: String!,
  $contactId: UUID, $leadId: UUID) @auth(level: NO_ACCESS) @transaction {
  before: query @redact {
    actor: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq: $actorUid}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}) @check(expr: "this != null", message: "INBOX_ADMIN_REQUIRED") {id}
    connection: channelConnection(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $channelConnectionId}, provider: {eq: WHATSAPP_CLOUD}, connectionStatus: {eq: VERIFIED}, sendingEnabled: {eq: true}}})
      @check(expr: "this != null", message: "INBOX_SENDING_DISABLED") {id}
  }
  conversation: inboxConversation_insert(data: {organizationId: $organizationId, id: $id, channelConnectionId: $channelConnectionId, channel: WHATSAPP, externalThreadId: $externalThreadId,
    customerIdentity: $customerIdentity, contactId: $contactId, leadId: $leadId, assignedMembershipId_expr: "response.before.actor.id", lastMessageAt_expr: "request.time", unreadCount: 0})
  auditLog_insert(data: {organizationId: $organizationId, actorUid: $actorUid, action: INBOX_CONVERSATION_CHANGED, targetType: CONVERSATION, targetId: $id, metadata_expr: "{'event': 'STARTED_BY_BUSINESS'}"})
}

# --- Webhooks and durable events (server only) ------------------------------------------------

# The connection named in a webhook URL. The company comes from this row only.
query InboxWebhookConnection($id: UUID!) @auth(level: NO_ACCESS) {
  connections: channelConnections(where: {id: {eq: $id}}, limit: 1) {organizationId id provider connectionStatus credentialReference externalAccountReference}
}

# A verified event, recorded once: the unique dedupKey makes a provider retry or a replay a no-op.
mutation RecordInboxEvent($organizationId: UUID!, $id: UUID!, $hasConnection: Boolean!, $channelConnectionId: UUID, $kind: String!, $dedupKey: String!, $payloadDigest: String,
  $normalizedJson: String!, $simulated: Boolean!) @auth(level: NO_ACCESS) @transaction {
  inboxEvent_insert(data: {organizationId: $organizationId, id: $id, channelConnectionId: $channelConnectionId, kind: $kind, dedupKey: $dedupKey, payloadDigest: $payloadDigest,
    normalizedJson: $normalizedJson, simulated: $simulated})
  channelConnection_update(key: {organizationId: $organizationId, id: $channelConnectionId}, data: {lastEventAt_expr: "request.time"}) @include(if: $hasConnection)
}

# Applied, duplicate or dead: the normalized copy is removed (it holds personal data).
mutation CompleteInboxEvent($organizationId: UUID!, $id: UUID!, $status: InboxEventStatus!, $errorCode: String, $conversationId: UUID, $messageId: UUID) @auth(level: NO_ACCESS) {
  inboxEvent_update(key: {organizationId: $organizationId, id: $id}, data: {status: $status, errorCode: $errorCode, conversationId: $conversationId, messageId: $messageId,
    normalizedJson: null, nextAttemptAt: null, attempts_update: {inc: 1}, processedAt_expr: "request.time"})
}

# A failed attempt, retried by the worker at nextAttemptAt (compare-and-set on the attempt count).
mutation FailInboxEvent($organizationId: UUID!, $id: UUID!, $expectedAttempts: Int!, $errorCode: String!, $nextAttemptAt: Timestamp!) @auth(level: NO_ACCESS) {
  inboxEvent_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, attempts: {eq: $expectedAttempts}, status: {in: [RECEIVED, FAILED]}}},
    data: {status: FAILED, errorCode: $errorCode, nextAttemptAt: $nextAttemptAt, attempts_update: {inc: 1}})
}

# Events due a retry, and events left RECEIVED by an interrupted request.
query PendingInboxEvents($now: Timestamp!, $staleBefore: Timestamp!, $limit: Int!) @auth(level: NO_ACCESS) {
  events: inboxEvents(where: {_or: [{status: {eq: FAILED}, nextAttemptAt: {le: $now}}, {status: {eq: RECEIVED}, receivedAt: {lt: $staleBefore}}]}, orderBy: [{receivedAt: ASC}], limit: $limit) {
    organizationId id channelConnectionId kind normalizedJson attempts simulated
  }
}

# --- Delivery receipts (server only) ----------------------------------------------------------

query InboxMessageByExternalId($organizationId: UUID!, $channelConnectionId: UUID!, $externalMessageId: String!) @auth(level: NO_ACCESS) {
  messages: inboxMessages(where: {organizationId: {eq: $organizationId}, channelConnectionId: {eq: $channelConnectionId}, externalMessageId: {eq: $externalMessageId}}, limit: 1) {
    id conversationId direction deliveryStatus simulated
  }
}

# Forward only: the server decides the change from the current status, and the update applies
# only while the message still has it. A failure is a workflow event in the same transaction.
mutation ApplyInboxDeliveryStatus($organizationId: UUID!, $id: UUID!, $conversationId: UUID!, $expectedStatus: InboxDeliveryStatus!, $deliveryStatus: InboxDeliveryStatus!,
  $raw: String, $providerTimestamp: Timestamp, $emitFailed: Boolean!, $simulated: Boolean!) @auth(level: NO_ACCESS) @transaction {
  message: inboxMessage_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, conversationId: {eq: $conversationId}, direction: {eq: OUTBOUND}, deliveryStatus: {eq: $expectedStatus}}},
    data: {deliveryStatus: $deliveryStatus, providerStatusRaw: $raw, providerTimestamp: $providerTimestamp, updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "INBOX_DELIVERY_CHANGED")
  failed: automationEvent_insert(data: {organizationId: $organizationId, deduplicationKey_expr: "'inbox.failed:' + vars.id", triggerType: "inbox.message.failed", targetType: "CONVERSATION",
    targetId: $conversationId, origin_expr: "vars.simulated ? 'SIMULATOR' : 'PROVIDER'", payload_expr: "{'messageId': vars.id}"}) @include(if: $emitFailed)
}

# --- Attachments (server only) ----------------------------------------------------------------

# An attachment row for a stored message. storagePath is null while a provider file has not been fetched.
mutation CreateInboxAttachment($organizationId: UUID!, $id: UUID!, $messageId: UUID!, $conversationId: UUID!, $fileName: String!, $mimeType: String!, $sizeBytes: Int!, $storagePath: String,
  $providerMediaId: String, $scanStatus: InboxAttachmentScan!) @auth(level: NO_ACCESS) @transaction {
  before: query @redact {
    message: inboxMessage(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $messageId}, conversationId: {eq: $conversationId}}}) @check(expr: "this != null", message: "INBOX_MESSAGE_NOT_FOUND") {id}
  }
  inboxAttachment_insert(data: {organizationId: $organizationId, id: $id, messageId: $messageId, conversationId: $conversationId, fileName: $fileName, mimeType: $mimeType, sizeBytes: $sizeBytes,
    storagePath: $storagePath, providerMediaId: $providerMediaId, scanStatus: $scanStatus})
}

# Server only: whether a provider account is already connected (to any company). The unique index
# stays the guard against two saves at once; this lets the server explain the refusal.
query ChannelAccountInUse($provider: ChannelProvider!, $externalAccountReference: String!) @auth(level: NO_ACCESS) {
  connections: channelConnections(where: {provider: {eq: $provider}, externalAccountReference: {eq: $externalAccountReference}}, limit: 2) {organizationId id}
}

# Phase 7B.2: a WhatsApp channel's account and token secret name, for the server listing or sending templates. The
# server first reads the conversation as the signed-in member (so it is one they may see); the token is read on the server only.
query WhatsAppTemplateConnection($organizationId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  connection: channelConnection(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, provider: {eq: WHATSAPP_CLOUD}}}) {
    id connectionStatus externalAccountReference businessAccountReference accessTokenReference accessTokenStoredAt sendingEnabled liveSending
  }
}

# --- Phase 7B.2: downloading WhatsApp media (server only) -------------------------------------

# Files customers sent on WhatsApp that are not stored yet and are due a try: the newest first is not
# needed, so oldest first; at most five tries, and only for media Meta still keeps (received since $since).
query PendingInboxMedia($now: Timestamp!, $since: Timestamp!, $limit: Int!) @auth(level: NO_ACCESS) {
  attachments: inboxAttachments(where: {_and: [
    {storagePath: {isNull: true}, providerMediaId: {isNull: false}, deletedAt: {isNull: true}, mediaFetchAttempts: {lt: 5}, createdAt: {ge: $since}},
    {_or: [{mediaNextAttemptAt: {isNull: true}}, {mediaNextAttemptAt: {le: $now}}]},
    {message: {simulated: {eq: false}, direction: {eq: INBOUND}, conversation: {channelConnection: {provider: {eq: WHATSAPP_CLOUD}}}}}
  ]}, orderBy: [{createdAt: ASC}], limit: $limit) {
    organizationId id messageId conversationId fileName mimeType providerMediaId mediaFetchAttempts createdAt
    message {conversation {channelConnection {id connectionStatus accessTokenReference accessTokenStoredAt}}}
  }
}

# Takes one file for a try (compare-and-set on the attempt count), so two workers never fetch it at once;
# nextAttemptAt is both the lease and the back-off before the next try.
mutation ClaimInboxMediaFetch($organizationId: UUID!, $id: UUID!, $expectedAttempts: Int!, $nextAttemptAt: Timestamp!) @auth(level: NO_ACCESS) @transaction {
  inboxAttachment_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, mediaFetchAttempts: {eq: $expectedAttempts}, storagePath: {isNull: true}}},
    data: {mediaFetchAttempts_update: {inc: 1}, mediaNextAttemptAt: $nextAttemptAt}) @check(expr: "this != null", message: "INBOX_MEDIA_BUSY")
}

# Stored privately after the content check (the type and size are the file's own, not the sender's claim).
mutation StoreInboxMedia($organizationId: UUID!, $id: UUID!, $storagePath: String!, $mimeType: String!, $sizeBytes: Int!, $fileName: String!) @auth(level: NO_ACCESS) {
  inboxAttachment_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, storagePath: {isNull: true}, deletedAt: {isNull: true}}},
    data: {storagePath: $storagePath, mimeType: $mimeType, sizeBytes: $sizeBytes, fileName: $fileName, mediaFetchedAt_expr: "request.time", mediaError: null, mediaNextAttemptAt: null})
}

# Why a file was not stored. A final reason (expired at Meta, type not allowed, too large) also ends the tries.
mutation FailInboxMedia($organizationId: UUID!, $id: UUID!, $error: String!, $final: Boolean!) @auth(level: NO_ACCESS) {
  retry: inboxAttachment_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, storagePath: {isNull: true}}}, data: {mediaError: $error}) @skip(if: $final)
  final: inboxAttachment_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, storagePath: {isNull: true}}}, data: {mediaError: $error, mediaFetchAttempts: 99, mediaNextAttemptAt: null}) @include(if: $final)
}
