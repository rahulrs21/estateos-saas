# LOCAL ONLY: guarded demo-estateos seeder resets these six tables.
# Synthetic fixtures. Outside connectorDirs; never deployed or generated.
mutation ResetEstateOS @transaction {
  activity_deleteMany(all: true)
  lead_deleteMany(all: true)
  branch_deleteMany(all: true)
  membership_deleteMany(all: true)
  organization_deleteMany(all: true)
  userProfile_deleteMany(all: true)
}

