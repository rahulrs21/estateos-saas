  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null && this.role in ['OWNER', 'ADMIN']", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, propertyId: {eq: $propertyId}, listingStatus: {eq: $listingStatus}, listingPurpose: {eq: $purpose}, marketType: {eq: $marketType}, askingPriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, property: {emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, propertyType: {eq: $propertyType}}, title: {pattern: {like: $search, ignoreCase: true}}}, limit: $limit, offset: $offset, orderBy: [{updatedAt: DESC}, {id: ASC}]) @include(if: $sortUpdated) {id propertyId property {id propertyReference propertyType bedrooms bathrooms builtUpArea areaUnit emirate city community assignedMembershipId project {id projectName} building {id name} inventoryMedias_on_property(where: {status: {eq: ACTIVE}, archivedAt: {isNull: true}, contentType: {in: ["image/jpeg", "image/png", "image/webp"]}, mediaKind: {eq: PROPERTY_PHOTO}}, orderBy: [{isCover: DESC}, {sortOrder: ASC}, {createdAt: ASC}], limit: 1) {id}} listingReference listingPurpose marketType title description askingPriceMinor currency rentalPeriod assignedMembershipId assignedMembership {email userProfile {displayName}} listingStatus publicationStatus advertisingPermitNumber permitExpiryDate permitVerificationUrl createdAt updatedAt}
  byPriceAsc: propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, propertyId: {eq: $propertyId}, listingStatus: {eq: $listingStatus}, listingPurpose: {eq: $purpose}, marketType: {eq: $marketType}, askingPriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, property: {emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, propertyType: {eq: $propertyType}}, title: {pattern: {like: $search, ignoreCase: true}}}, limit: $limit, offset: $offset, orderBy: [{askingPriceMinor: ASC}, {id: ASC}]) @include(if: $sortPriceAsc) {id propertyId property {id propertyReference propertyType bedrooms bathrooms builtUpArea areaUnit emirate city community assignedMembershipId project {id projectName} building {id name} inventoryMedias_on_property(where: {status: {eq: ACTIVE}, archivedAt: {isNull: true}, contentType: {in: ["image/jpeg", "image/png", "image/webp"]}, mediaKind: {eq: PROPERTY_PHOTO}}, orderBy: [{isCover: DESC}, {sortOrder: ASC}, {createdAt: ASC}], limit: 1) {id}} listingReference listingPurpose marketType title description askingPriceMinor currency rentalPeriod assignedMembershipId assignedMembership {email userProfile {displayName}} listingStatus publicationStatus advertisingPermitNumber permitExpiryDate permitVerificationUrl createdAt updatedAt}
  byPriceDesc: propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, propertyId: {eq: $propertyId}, listingStatus: {eq: $listingStatus}, listingPurpose: {eq: $purpose}, marketType: {eq: $marketType}, askingPriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, property: {emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, propertyType: {eq: $propertyType}}, title: {pattern: {like: $search, ignoreCase: true}}}, limit: $limit, offset: $offset, orderBy: [{askingPriceMinor: DESC}, {id: ASC}]) @include(if: $sortPriceDesc) {id propertyId property {id propertyReference propertyType bedrooms bathrooms builtUpArea areaUnit emirate city community assignedMembershipId project {id projectName} building {id name} inventoryMedias_on_property(where: {status: {eq: ACTIVE}, archivedAt: {isNull: true}, contentType: {in: ["image/jpeg", "image/png", "image/webp"]}, mediaKind: {eq: PROPERTY_PHOTO}}, orderBy: [{isCover: DESC}, {sortOrder: ASC}, {createdAt: ASC}], limit: 1) {id}} listingReference listingPurpose marketType title description askingPriceMinor currency rentalPeriod assignedMembershipId assignedMembership {email userProfile {displayName}} listingStatus publicationStatus advertisingPermitNumber permitExpiryDate permitVerificationUrl createdAt updatedAt}
  byCreated: propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, propertyId: {eq: $propertyId}, listingStatus: {eq: $listingStatus}, listingPurpose: {eq: $purpose}, marketType: {eq: $marketType}, askingPriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, property: {emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, propertyType: {eq: $propertyType}}, title: {pattern: {like: $search, ignoreCase: true}}}, limit: $limit, offset: $offset, orderBy: [{createdAt: DESC}, {id: ASC}]) @include(if: $sortCreated) {id propertyId property {id propertyReference propertyType bedrooms bathrooms builtUpArea areaUnit emirate city community assignedMembershipId project {id projectName} building {id name} inventoryMedias_on_property(where: {status: {eq: ACTIVE}, archivedAt: {isNull: true}, contentType: {in: ["image/jpeg", "image/png", "image/webp"]}, mediaKind: {eq: PROPERTY_PHOTO}}, orderBy: [{isCover: DESC}, {sortOrder: ASC}, {createdAt: ASC}], limit: 1) {id}} listingReference listingPurpose marketType title description askingPriceMinor currency rentalPeriod assignedMembershipId assignedMembership {email userProfile {displayName}} listingStatus publicationStatus advertisingPermitNumber permitExpiryDate permitVerificationUrl createdAt updatedAt}
  total: propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, propertyId: {eq: $propertyId}, listingStatus: {eq: $listingStatus}, listingPurpose: {eq: $purpose}, marketType: {eq: $marketType}, askingPriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, property: {emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, propertyType: {eq: $propertyType}}, title: {pattern: {like: $search, ignoreCase: true}}}) {_count}
}

