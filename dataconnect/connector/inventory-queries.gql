# Inventory reads are tenant-scoped by active database membership. Company
# inventory is shared with active members; writes are more narrowly role-scoped.
query ListDevelopers($organizationId: UUID!, $limit: Int! = 50, $offset: Int! = 0, $search: String)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.limit >= 1 && vars.limit <= 100 && vars.offset >= 0 && vars.offset <= 10000 && (!has(vars.search) || vars.search == null || vars.search.size() <= 120)") {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null && this.role in ['OWNER', 'ADMIN', 'AGENT']", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  developers(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, name: {pattern: {like: $search, ignoreCase: true}}}, limit: $limit, offset: $offset, orderBy: [{name: ASC}, {id: ASC}]) {id organizationId name slug logoReference description website email phone country headOfficeAddress headOfficeLatitude headOfficeLongitude headOfficeGooglePlaceId status createdAt updatedAt projects_on_developer(where: {archivedAt: {isNull: true}}) {_count}}
  total: developers(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, name: {pattern: {like: $search, ignoreCase: true}}}) {_count}
}

