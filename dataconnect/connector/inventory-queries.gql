# Listing counts per status for the list's summary bar (same scope as the list operations).
query ListingStatusCounts($organizationId: UUID!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null && this.role in ['OWNER', 'ADMIN']", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  statuses: propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}}) {listingStatus _count}
}

query AssignedListingStatusCounts($organizationId: UUID!, $assignedMembershipId: UUID!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $assignedMembershipId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {eq: AGENT}}}) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id}
  statuses: propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, assignedMembershipId: {eq: $assignedMembershipId}}) {listingStatus _count}
}

# Status history: listing activity events, newest first.
query ListListingActivity($organizationId: UUID!, $id: UUID!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null && this.role in ['OWNER', 'ADMIN', 'AGENT']", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  listing: propertyListing(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, archivedAt: {isNull: true}}}) @redact @check(expr: "this != null", message: "INVENTORY_RECORD_NOT_FOUND") {id}
  activities(where: {organizationId: {eq: $organizationId}, targetId: {eq: $id}, kind: {in: [PROPERTY_LISTING_CREATED, PROPERTY_LISTING_UPDATED, PROPERTY_LISTING_ARCHIVED]}}, orderBy: [{createdAt: DESC}], limit: 50) {id kind metadata createdAt actor {displayName}}
}

query GetPropertyListing($organizationId: UUID!, $id: UUID!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'")
  {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  propertyListing: propertyListing(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, archivedAt: {isNull: true}}}) {id organizationId propertyId property {id propertyReference propertyType bedrooms bathrooms builtUpArea plotArea areaUnit emirate city community area latitude longitude googlePlaceId mapDisplayMode inventoryStatus assignedMembershipId project {id projectName} building {id name} inventoryMedias_on_property(where: {status: {eq: ACTIVE}, archivedAt: {isNull: true}}, orderBy: [{sortOrder: ASC}, {createdAt: ASC}]) {id fileName contentType mediaKind sortOrder isCover}} listingReference listingPurpose marketType title description askingPriceMinor currency rentalPeriod assignedMembershipId assignedMembership {email userProfile {displayName}} listingStatus publicationStatus advertisingPermitNumber permitExpiryDate permitVerificationUrl createdAt updatedAt}
}

query GetAssignedPropertyListing($organizationId: UUID!, $id: UUID!, $assignedMembershipId: UUID!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
