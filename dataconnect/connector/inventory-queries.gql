  propertyListing: propertyListing(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, assignedMembershipId: {eq: $assignedMembershipId}, archivedAt: {isNull: true}}}) {id organizationId propertyId property {id propertyReference propertyType bedrooms bathrooms builtUpArea plotArea areaUnit emirate city community area latitude longitude googlePlaceId mapDisplayMode inventoryStatus assignedMembershipId project {id projectName} building {id name} inventoryMedias_on_property(where: {status: {eq: ACTIVE}, archivedAt: {isNull: true}}, orderBy: [{sortOrder: ASC}, {createdAt: ASC}]) {id fileName contentType mediaKind sortOrder isCover}} listingReference listingPurpose marketType title description askingPriceMinor currency rentalPeriod assignedMembershipId assignedMembership {email userProfile {displayName}} listingStatus publicationStatus advertisingPermitNumber permitExpiryDate permitVerificationUrl createdAt updatedAt}
}

query GetFloorPlan($organizationId: UUID!, $id: UUID!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null && this.role in ['OWNER', 'ADMIN', 'AGENT']", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  floorPlan: floorPlan(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, archivedAt: {isNull: true}}}) {id organizationId projectId project {projectName} propertyId property {id propertyReference} buildingId building {name} name propertyType bedrooms builtUpArea plotArea areaUnit mediaReference createdAt updatedAt inventoryMedias_on_floorPlan(where: {status: {eq: ACTIVE}, archivedAt: {isNull: true}}, orderBy: [{sortOrder: ASC}, {createdAt: ASC}]) {id fileName contentType byteSize mediaKind sortOrder isCover}}
}

query GetPaymentPlan($organizationId: UUID!, $id: UUID!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null && this.role in ['OWNER', 'ADMIN', 'AGENT']", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  paymentPlan: paymentPlan(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, archivedAt: {isNull: true}}}) {id organizationId projectId project {projectName} propertyId property {id propertyReference propertyType} name bookingPercentageBps handoverPercentageBps installmentTotalBps isActive paymentPlanInstallments_on_paymentPlan(orderBy: [{position: ASC}]) {id position percentageBps dueTrigger constructionMilestonePercent postHandoverMonths description} createdAt updatedAt}
}

query ListFloorPlans($organizationId: UUID!, $projectId: UUID!, $buildingId: UUID, $limit: Int! = 50, $offset: Int! = 0, $search: String)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.limit >= 1 && vars.limit <= 100 && vars.offset >= 0 && vars.offset <= 10000 && (!has(vars.search) || vars.search == null || vars.search.size() <= 120)") {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null && this.role in ['OWNER', 'ADMIN', 'AGENT']", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  floorPlans(where: {organizationId: {eq: $organizationId}, projectId: {eq: $projectId}, buildingId: {eq: $buildingId}, archivedAt: {isNull: true}, name: {pattern: {like: $search, ignoreCase: true}}}, limit: $limit, offset: $offset, orderBy: [{name: ASC}, {id: ASC}]) {id projectId propertyId property {id propertyReference} buildingId name propertyType bedrooms builtUpArea plotArea areaUnit mediaReference createdAt updatedAt inventoryMedias_on_floorPlan(where: {status: {eq: ACTIVE}, archivedAt: {isNull: true}}, orderBy: [{sortOrder: ASC}, {createdAt: ASC}]) {id fileName contentType mediaKind sortOrder isCover}}
  total: floorPlans(where: {organizationId: {eq: $organizationId}, projectId: {eq: $projectId}, buildingId: {eq: $buildingId}, archivedAt: {isNull: true}, name: {pattern: {like: $search, ignoreCase: true}}}) {_count}
}


query ListPaymentPlans($organizationId: UUID!, $projectId: UUID!, $limit: Int! = 50, $offset: Int! = 0)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.limit >= 1 && vars.limit <= 100 && vars.offset >= 0 && vars.offset <= 10000") {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null && this.role in ['OWNER', 'ADMIN', 'AGENT']", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  paymentPlans(where: {organizationId: {eq: $organizationId}, projectId: {eq: $projectId}, archivedAt: {isNull: true}}, limit: $limit, offset: $offset, orderBy: [{updatedAt: DESC}, {id: ASC}]) {id projectId propertyId property {id propertyReference propertyType} name bookingPercentageBps handoverPercentageBps installmentTotalBps isActive createdAt updatedAt paymentPlanInstallments_on_paymentPlan(orderBy: [{position: ASC}]) {id position percentageBps dueTrigger constructionMilestonePercent postHandoverMonths description}}
  total: paymentPlans(where: {organizationId: {eq: $organizationId}, projectId: {eq: $projectId}, archivedAt: {isNull: true}}) {_count}
}

