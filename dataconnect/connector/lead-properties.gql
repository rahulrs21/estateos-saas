# Lead-to-property integration never grants access through a relationship.
# A current lead permission and a current inventory permission are both required.
# Mutations lock membership and use a lead compare-and-swap so audit, shortlist,
# viewing and primary-reference writes roll back together on a competing change.
query GetLeadPropertyContext($organizationId: UUID!, $leadId: UUID!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
  actor: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN, AGENT]}}}) @redact @check(expr: "this != null", message: "INVENTORY_ACCESS_REQUIRED") {id role}
  lead: lead(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}) @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN") {id projectId propertyId assignedMembershipId updatedAt}
  primaryProject: project(first: {where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, leads_on_project: {exist: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}}}) {id projectName}
  primaryProperty: property(first: {where: {_and: [{organizationId: {eq: $organizationId}, leads_on_property: {exist: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}) {id propertyReference projectId project {id projectName} propertyType bedrooms emirate community area inventoryStatus archivedAt}
  shortlist: leadPropertyInterests(where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, lead: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, property: {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}}, limit: 100, orderBy: [{updatedAt: DESC}, {id: ASC}]) {
    id propertyId status notes createdAt updatedAt property {id propertyReference projectId project {id projectName} propertyType bedrooms emirate community area inventoryStatus archivedAt assignedMembershipId}
  }
  shortlistTotal: leadPropertyInterests(where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, lead: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, property: {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}}) {_count}
  viewings: leadPropertyViewings(where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, lead: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, property: {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}}, limit: 100, orderBy: [{scheduledAt: DESC}, {id: ASC}]) {
    id propertyId scheduledAt status viewingNotes customerConfirmation outcome createdAt updatedAt property {id propertyReference projectId project {id projectName} propertyType bedrooms emirate community area inventoryStatus archivedAt}
    assignedMembershipId assignedMembership {id email userProfile {displayName}}
    followUp {id title dueAt status}
  }
  viewingTotal: leadPropertyViewings(where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, lead: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, property: {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}}) {_count}
  # Viewing assignee choices: administrators see company OWNER/ADMIN members and
  # the lead's assigned agent; an agent sees only their own membership. The
  # schedule/update mutations enforce the same rule plus property assignment.
  viewingAssignees: memberships(where: {_and: [
    {organizationId: {eq: $organizationId}, status: {eq: ACTIVE}, userProfileUid: {isNull: false}},
    {_or: [{role: {in: [OWNER, ADMIN]}}, {role: {eq: AGENT}, leads_on_assignedMembership: {exist: {organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}}}]},
    {_or: [{userProfileUid: {eq_expr: "auth.uid"}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}
  ]}, limit: 100, orderBy: [{email: ASC}, {id: ASC}]) {id role email userProfile {displayName}}
}

query ListLeadPropertyCandidates($organizationId: UUID!, $leadId: UUID!, $limit: Int! = 50, $offset: Int! = 0)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.limit >= 1 && vars.limit <= 100 && vars.offset >= 0 && vars.offset <= 10000") {
  actor: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN, AGENT]}}}) @redact @check(expr: "this != null", message: "INVENTORY_ACCESS_REQUIRED") {id role}
  lead: lead(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}) @redact @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN") {id projectId propertyId updatedAt}
  properties(where: {_and: [{organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, inventoryStatus: {eq: AVAILABLE}, propertyListings_on_property: {exist: {_and: [{archivedAt: {isNull: true}, listingStatus: {eq: ACTIVE}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, limit: $limit, offset: $offset, orderBy: [{propertyReference: ASC}, {id: ASC}]) {
    id propertyReference projectId project {id projectName} propertyType bedrooms bathrooms builtUpArea areaUnit emirate community area inventoryStatus archivedAt
    propertyListings_on_property(where: {_and: [{archivedAt: {isNull: true}, listingStatus: {eq: ACTIVE}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, orderBy: [{id: ASC}], limit: 100) {
      id listingPurpose title askingPriceMinor currency rentalPeriod listingStatus
    }
  }
  total: properties(where: {_and: [{organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, inventoryStatus: {eq: AVAILABLE}, propertyListings_on_property: {exist: {_and: [{archivedAt: {isNull: true}, listingStatus: {eq: ACTIVE}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}) {_count}
}

mutation SaveLeadPropertyInterest($organizationId: UUID!, $leadId: UUID!, $propertyId: UUID!, $status: LeadPropertyInterestStatus!, $notes: String, $expectedUpdatedAt: Timestamp)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && (!has(vars.notes) || vars.notes == null || vars.notes.size() <= 4000)") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN, AGENT]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ACCESS_REQUIRED")
  # Lock the authorized property without changing its data. Availability and
  # assignment cannot change between the checks and the relationship write.
  propertyGuard: property_update(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $propertyId}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}, data: {organizationId: $organizationId}) @redact @check(expr: "this != null", message: "PROPERTY_UNAVAILABLE_OR_FORBIDDEN")
  before: query @redact {
    lead: lead(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}) @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN") {id projectId propertyId updatedAt}
    existing: leadPropertyInterest(first: {where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, propertyId: {eq: $propertyId}}})
      @check(expr: "this == null ? ((!has(vars.expectedUpdatedAt) || vars.expectedUpdatedAt == null) && vars.status != 'REMOVED') : (has(vars.expectedUpdatedAt) && vars.expectedUpdatedAt != null && timestamp(this.updatedAt) == timestamp(vars.expectedUpdatedAt))", message: "SHORTLIST_CHANGED_RELOAD") {id createdByUid createdAt updatedAt}
    property: property(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $propertyId}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}})
      @check(expr: "this != null && (vars.status == 'REMOVED' || (this.archivedAt == null && (vars.status == 'NOT_INTERESTED' || this.inventoryStatus == 'AVAILABLE')))", message: "PROPERTY_UNAVAILABLE_OR_FORBIDDEN") {id archivedAt inventoryStatus}
  }
  lead: lead_update(first: {where: {_and: [{_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, {updatedAt: {eq_expr: "response.before.lead.updatedAt"}}]}}, data: {updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "LEAD_CHANGED_RELOAD")
  interest: leadPropertyInterest_upsert(data: {organizationId: $organizationId, id_expr: "response.before.existing != null ? response.before.existing.id : uuidV4()", leadId: $leadId, propertyId: $propertyId, status: $status, notes: $notes, createdByUid_expr: "response.before.existing != null ? response.before.existing.createdByUid : auth.uid", createdAt_expr: "response.before.existing != null ? response.before.existing.createdAt : request.time", updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"})
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: LEAD_PROPERTY_INTEREST_CHANGED, leadId: $leadId, targetId: $leadId, metadata_expr: "{'propertyId': vars.propertyId, 'status': vars.status}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: LEAD_PROPERTY_INTEREST_CHANGED, targetType: LEAD, targetId: $leadId, metadata_expr: "{'propertyId': vars.propertyId, 'status': vars.status}"})
}

mutation SetLeadPrimaryInterest($organizationId: UUID!, $leadId: UUID!, $projectId: UUID, $propertyId: UUID)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN, AGENT]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ACCESS_REQUIRED")
  # Lock the authorized property without changing its data. Availability and
  # assignment cannot change between the checks and the relationship write.
  propertyGuard: property_update(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq_expr: "has(vars.propertyId) ? vars.propertyId : null"}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}, data: {organizationId: $organizationId}) @redact @check(expr: "!has(vars.propertyId) || vars.propertyId == null || this != null", message: "PROPERTY_UNAVAILABLE_OR_FORBIDDEN")
  before: query @redact {
    lead: lead(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}) @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN") {id projectId propertyId updatedAt}
    project: project(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $projectId}, archivedAt: {isNull: true}}})
      @check(expr: "!has(vars.projectId) || vars.projectId == null || this != null", message: "PROJECT_NOT_FOUND") {id}
    property: property(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $propertyId}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}})
      @check(expr: "!has(vars.propertyId) || vars.propertyId == null || (this != null && this.archivedAt == null && (!has(vars.projectId) || vars.projectId == null || this.projectId == vars.projectId))", message: "PROPERTY_PROJECT_NOT_FOUND_OR_FORBIDDEN") {id projectId archivedAt}
  }
  lead: lead_update(first: {where: {_and: [{_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, {updatedAt: {eq_expr: "response.before.lead.updatedAt"}}]}}, data: {
    projectId_expr: "has(vars.propertyId) && vars.propertyId != null ? response.before.property.projectId : (has(vars.projectId) ? vars.projectId : null)",
    propertyId: $propertyId, updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"
  }) @check(expr: "this != null", message: "LEAD_CHANGED_RELOAD")
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: LEAD_PRIMARY_INTEREST_CHANGED, leadId: $leadId, targetId: $leadId, metadata_expr: "{'projectId': has(vars.propertyId) && vars.propertyId != null ? response.before.property.projectId : (has(vars.projectId) ? vars.projectId : null), 'propertyId': has(vars.propertyId) ? vars.propertyId : null}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: LEAD_PRIMARY_INTEREST_CHANGED, targetType: LEAD, targetId: $leadId, metadata_expr: "{'projectId': has(vars.propertyId) && vars.propertyId != null ? response.before.property.projectId : (has(vars.projectId) ? vars.projectId : null), 'propertyId': has(vars.propertyId) ? vars.propertyId : null}"})
}

# Viewing assignee rule (schedule and update): the assignee is an ACTIVE company
# OWNER/ADMIN, or an AGENT assigned to both this lead and this property so the
# appointment stays visible to them. AGENT actors may only assign themselves.
mutation ScheduleLeadPropertyViewing($organizationId: UUID!, $leadId: UUID!, $propertyId: UUID!, $scheduledAt: Timestamp!, $notes: String, $assignedMembershipId: UUID!, $customerConfirmation: LeadPropertyViewingConfirmation! = PENDING)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && timestamp(vars.scheduledAt) > request.time && timestamp(vars.scheduledAt) <= request.time + duration('31536000s') && (!has(vars.notes) || vars.notes == null || vars.notes.size() <= 4000)") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN, AGENT]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ACCESS_REQUIRED")
  # Lock the authorized property without changing its data. Availability and
  # assignment cannot change between the checks and the relationship write.
  propertyGuard: property_update(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $propertyId}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}, data: {organizationId: $organizationId}) @redact @check(expr: "this != null", message: "PROPERTY_UNAVAILABLE_OR_FORBIDDEN")
  before: query @redact {
    lead: lead(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}) @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN") {id projectId propertyId updatedAt}
    property: property(first: {where: {_and: [{_and: [{organizationId: {eq: $organizationId}, id: {eq: $propertyId}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, {archivedAt: {isNull: true}, inventoryStatus: {eq: AVAILABLE}}]}})
      @check(expr: "this != null", message: "PROPERTY_UNAVAILABLE_OR_FORBIDDEN") {id}
    interest: leadPropertyInterest(first: {where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, propertyId: {eq: $propertyId}, status: {in: [SAVED, INTERESTED]}}})
      @check(expr: "this != null", message: "SHORTLIST_REQUIRED") {id}
    assignee: membership(first: {where: {_and: [
      {organizationId: {eq: $organizationId}, id: {eq: $assignedMembershipId}, status: {eq: ACTIVE}, userProfileUid: {isNull: false}},
      {_or: [{role: {in: [OWNER, ADMIN]}}, {role: {eq: AGENT}, leads_on_assignedMembership: {exist: {organizationId: {eq: $organizationId}, id: {eq: $leadId}}}, properties_on_assignedMembership: {exist: {organizationId: {eq: $organizationId}, id: {eq: $propertyId}}}}]},
      {_or: [{userProfileUid: {eq_expr: "auth.uid"}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}
    ]}}) @check(expr: "this != null", message: "VIEWING_ASSIGNEE_FORBIDDEN") {id}
  }
  lead: lead_update(first: {where: {_and: [{_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, {updatedAt: {eq_expr: "response.before.lead.updatedAt"}}]}}, data: {updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "LEAD_CHANGED_RELOAD")
  viewing: leadPropertyViewing_insert(data: {organizationId: $organizationId, leadId: $leadId, propertyId: $propertyId, scheduledAt: $scheduledAt, viewingNotes: $notes, assignedMembershipId: $assignedMembershipId, customerConfirmation: $customerConfirmation, createdByUid_expr: "auth.uid", updatedByUid_expr: "auth.uid"})
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: LEAD_PROPERTY_VIEWING_SCHEDULED, leadId: $leadId, targetId: $leadId, metadata_expr: "{'propertyId': vars.propertyId, 'viewingId': response.viewing.id, 'scheduledAt': string(vars.scheduledAt), 'assignedMembershipId': vars.assignedMembershipId, 'customerConfirmation': vars.customerConfirmation}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: LEAD_PROPERTY_VIEWING_SCHEDULED, targetType: LEAD, targetId: $leadId, metadata_expr: "{'propertyId': vars.propertyId, 'viewingId': response.viewing.id, 'scheduledAt': string(vars.scheduledAt), 'assignedMembershipId': vars.assignedMembershipId, 'customerConfirmation': vars.customerConfirmation}"})
}

# SCHEDULED appointments can change assignee, customer confirmation and notes, or
# move to COMPLETED/CANCELLED. Outcome is recorded only on completion. A terminal
# transition may create one follow-up task for the viewing assignee in the same
# transaction; the lead's denormalized next follow-up keeps the earliest due date.
mutation UpdateLeadPropertyViewing($organizationId: UUID!, $leadId: UUID!, $viewingId: UUID!, $status: LeadPropertyViewingStatus!, $notes: String, $expectedUpdatedAt: Timestamp!, $assignedMembershipId: UUID!, $customerConfirmation: LeadPropertyViewingConfirmation!, $outcome: LeadPropertyViewingOutcome, $followUpAt: Timestamp, $followUpTitle: String, $hasFollowUp: Boolean! = false)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && (!has(vars.notes) || vars.notes == null || vars.notes.size() <= 4000) && (!has(vars.outcome) || vars.outcome == null || vars.status == 'COMPLETED') && (vars.hasFollowUp == (has(vars.followUpAt) && vars.followUpAt != null)) && (!vars.hasFollowUp || (vars.status != 'SCHEDULED' && timestamp(vars.followUpAt) > request.time && timestamp(vars.followUpAt) <= request.time + duration('31536000s') && has(vars.followUpTitle) && vars.followUpTitle != null && vars.followUpTitle.size() >= 1 && vars.followUpTitle.size() <= 500))") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN, AGENT]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ACCESS_REQUIRED")
  # Lock the authorized property without changing its data. Availability and
  # assignment cannot change between the checks and the relationship write.
  propertyGuard: property_update(first: {where: {_and: [{organizationId: {eq: $organizationId}, leadPropertyViewings_on_property: {exist: {id: {eq: $viewingId}, leadId: {eq: $leadId}}}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}, data: {organizationId: $organizationId}) @redact @check(expr: "this != null", message: "PROPERTY_UNAVAILABLE_OR_FORBIDDEN")
  before: query @redact {
    lead: lead(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}}) @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN") {id projectId propertyId updatedAt followUpAt followUpNote}
    viewing: leadPropertyViewing(first: {where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, id: {eq: $viewingId}, property: {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}}})
      @check(expr: "this != null && this.status == 'SCHEDULED' && timestamp(this.updatedAt) == timestamp(vars.expectedUpdatedAt)", message: "VIEWING_CHANGED_OR_FORBIDDEN") {id propertyId status assignedMembershipId followUpId updatedAt}
    next: leadFollowUp(first: {where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, status: {eq: PENDING}}, orderBy: [{dueAt: ASC}, {id: ASC}]}) {dueAt title}
  }
  # An unchanged assignee on an existing appointment is kept without re-checking
  # eligibility, so outcomes can still be recorded after a reassignment. A new
  # assignee, or one receiving a follow-up task, must be currently eligible.
  assignment: query @redact {
    assignee: membership(first: {where: {_and: [
      {organizationId: {eq: $organizationId}, id: {eq: $assignedMembershipId}, status: {eq: ACTIVE}, userProfileUid: {isNull: false}},
      {_or: [{role: {in: [OWNER, ADMIN]}}, {role: {eq: AGENT}, leads_on_assignedMembership: {exist: {organizationId: {eq: $organizationId}, id: {eq: $leadId}}}, properties_on_assignedMembership: {exist: {organizationId: {eq: $organizationId}, id: {eq_expr: "response.before.viewing.propertyId"}}}}]},
      {_or: [{userProfileUid: {eq_expr: "auth.uid"}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}
    ]}}) @check(expr: "this != null || (!vars.hasFollowUp && response.before.viewing.assignedMembershipId != null && vars.assignedMembershipId == response.before.viewing.assignedMembershipId)", message: "VIEWING_ASSIGNEE_FORBIDDEN") {id}
  }
  # Expressions on @include fields are evaluated even when the field is skipped,
  # so follow-up expressions guard absent variables (as CreateLead does). The
  # lead's next follow-up is only rewritten when a follow-up is created.
  lead: lead_update(first: {where: {_and: [{_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, {updatedAt: {eq_expr: "response.before.lead.updatedAt"}}]}}, data: {updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"}) @skip(if: $hasFollowUp) @check(expr: "this != null", message: "LEAD_CHANGED_RELOAD")
  leadWithFollowUp: lead_update(first: {where: {_and: [{_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}, archivedAt: {isNull: true}}, {_or: [{assignedMembership: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}, {organization: {memberships_on_organization: {exist: {userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}}}]}]}, {updatedAt: {eq_expr: "response.before.lead.updatedAt"}}]}}, data: {
    followUpAt_expr: "response.before.next != null && timestamp(response.before.next.dueAt) < timestamp((has(vars.followUpAt) && vars.followUpAt != null ? vars.followUpAt : request.time)) ? response.before.next.dueAt : (has(vars.followUpAt) && vars.followUpAt != null ? vars.followUpAt : request.time)",
    followUpNote_expr: "response.before.next != null && timestamp(response.before.next.dueAt) < timestamp((has(vars.followUpAt) && vars.followUpAt != null ? vars.followUpAt : request.time)) ? response.before.next.title : (has(vars.followUpTitle) && vars.followUpTitle != null ? vars.followUpTitle : 'Follow up')",
    updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"
  }) @include(if: $hasFollowUp) @check(expr: "this != null", message: "LEAD_CHANGED_RELOAD")
  followUp: leadFollowUp_insert(data: {organizationId: $organizationId, leadId: $leadId, assignedUserId: $assignedMembershipId, title_expr: "(has(vars.followUpTitle) && vars.followUpTitle != null ? vars.followUpTitle : 'Follow up')", dueAt_expr: "(has(vars.followUpAt) && vars.followUpAt != null ? vars.followUpAt : request.time)", createdByUid_expr: "auth.uid"}) @include(if: $hasFollowUp)
  viewing: leadPropertyViewing_update(first: {where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, id: {eq: $viewingId}, status: {eq: SCHEDULED}, updatedAt: {eq: $expectedUpdatedAt}}}, data: {
    status: $status, viewingNotes: $notes, assignedMembershipId: $assignedMembershipId, customerConfirmation: $customerConfirmation, outcome: $outcome,
    updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"
  }) @check(expr: "this != null", message: "VIEWING_CHANGED_RELOAD")
  viewingFollowUp: leadPropertyViewing_update(first: {where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, id: {eq: $viewingId}}}, data: {followUpId_expr: "vars.hasFollowUp ? response.followUp.id : vars.viewingId"}) @include(if: $hasFollowUp) @check(expr: "this != null", message: "VIEWING_CHANGED_RELOAD")
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: LEAD_PROPERTY_VIEWING_UPDATED, leadId: $leadId, targetId: $leadId, metadata_expr: "{'propertyId': response.before.viewing.propertyId, 'viewingId': vars.viewingId, 'status': vars.status, 'assignedMembershipId': vars.assignedMembershipId, 'customerConfirmation': vars.customerConfirmation, 'outcome': has(vars.outcome) ? vars.outcome : null}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: LEAD_PROPERTY_VIEWING_UPDATED, targetType: LEAD, targetId: $leadId, metadata_expr: "{'propertyId': response.before.viewing.propertyId, 'viewingId': vars.viewingId, 'status': vars.status, 'assignedMembershipId': vars.assignedMembershipId, 'customerConfirmation': vars.customerConfirmation, 'outcome': has(vars.outcome) ? vars.outcome : null}"})
  followUpActivity: activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: FOLLOW_UP_SCHEDULED, leadId: $leadId, targetId: $leadId, note_expr: "(has(vars.followUpTitle) && vars.followUpTitle != null ? vars.followUpTitle : 'Follow up')", metadata_expr: "{'followUpAt': string((has(vars.followUpAt) && vars.followUpAt != null ? vars.followUpAt : request.time)), 'viewingId': vars.viewingId}"}) @include(if: $hasFollowUp)
  followUpAudit: auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: FOLLOW_UP_SCHEDULED, targetType: LEAD, targetId: $leadId, metadata_expr: "{'followUpAt': string((has(vars.followUpAt) && vars.followUpAt != null ? vars.followUpAt : request.time)), 'viewingId': vars.viewingId}"}) @include(if: $hasFollowUp)
}
