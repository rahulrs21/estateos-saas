 }
 websiteMedia_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, status: {eq: ACTIVE}}}, data: {status: ARCHIVED, updatedAt_expr: "request.time"})
 auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: WEBSITE_MEDIA_ARCHIVED, targetType: WEBSITE_MEDIA, targetId: $id})
}

# --- Saved sections (company library) ------------------------------------------
# Saving needs the same right as creating a page; deleting is for the author or
# an owner or administrator. The section is validated page data (server-checked).

mutation CreateWebsiteSectionTemplate($organizationId: UUID!, $id: UUID!, $name: String!, $category: String!, $sectionType: String!, $sectionData: String!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.name.size() >= 1 && vars.name.size() <= 120 && vars.category.size() <= 40 && vars.sectionType.size() <= 40 && vars.sectionData.size() <= 60000") @transaction {
 before: query @redact @check(expr: "this.member != null && this.website != null && (this.member.role in ['OWNER', 'ADMIN', 'MANAGER'] || (this.member.role == 'AGENT' && this.website.allowAgentDrafts))", message: "WEBSITE_SECTION_TEMPLATE_FORBIDDEN") {
  member: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) {id role}
  website: website(first: {where: {organizationId: {eq: $organizationId}, status: {eq: ACTIVE}}}) {id allowAgentDrafts}
 }
 template: websiteSectionTemplate_insert(data: {organizationId: $organizationId, id: $id, name: $name, category: $category, sectionType: $sectionType, sectionData: $sectionData,
  status: ACTIVE, createdByUid_expr: "auth.uid", updatedByUid_expr: "auth.uid"})
 auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: WEBSITE_SECTION_TEMPLATE_SAVED, targetType: WEBSITE_SECTION_TEMPLATE, targetId: $id})
}

query ListWebsiteSectionTemplates($organizationId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
 ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id}
 templates: websiteSectionTemplates(where: {organizationId: {eq: $organizationId}, status: {eq: ACTIVE}}, orderBy: [{updatedAt: DESC}], limit: 100) {
  id name category sectionType sectionData createdByUid updatedAt createdBy {displayName}
 }
}

mutation DeleteWebsiteSectionTemplate($organizationId: UUID!, $id: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") @transaction {
 before: query @redact @check(expr: "this.member != null && this.template != null && (this.member.role in ['OWNER', 'ADMIN'] || this.template.createdByUid == auth.uid)", message: "WEBSITE_SECTION_TEMPLATE_FORBIDDEN") {
  member: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) {id role}
  template: websiteSectionTemplate(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, status: {eq: ACTIVE}}}) {id createdByUid}
 }
 websiteSectionTemplate_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, status: {eq: ACTIVE}}}, data: {status: DELETED, updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"})
 auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: WEBSITE_SECTION_TEMPLATE_DELETED, targetType: WEBSITE_SECTION_TEMPLATE, targetId: $id})
}
