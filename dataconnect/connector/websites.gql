mutation RecordPendingWebsiteEnquiry($organizationId: UUID!, $pageId: UUID, $publicationId: UUID, $formId: UUID!, $idempotencyKeyHash: String!, $payload: String!, $errorCode: String!)
 @auth(level: NO_ACCESS) {
