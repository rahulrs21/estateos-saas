# --- Contact sections: company members shown as the page's agent ---------------

# Owners and administrators choose the agent shown on a page.
query ListWebsiteAgents($organizationId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
 ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}) @redact @check(expr: "this != null", message: "ADMINISTRATOR_REQUIRED") {id}
 agents: memberships(where: {organizationId: {eq: $organizationId}, status: {eq: ACTIVE}, userProfileUid: {isNull: false}}, orderBy: [{createdAt: ASC}], limit: 200) {
  id role email websiteTitle websitePhone websiteWhatsapp userProfile {displayName}
 }
}

# Any active member reading a page resolves its agent; inactive members are never shown.
query GetWebsiteAgent($organizationId: UUID!, $membershipId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
 ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id}
 agent: membership(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $membershipId}, status: {eq: ACTIVE}, userProfileUid: {isNull: false}}}) {
  id role email websiteTitle websitePhone websiteWhatsapp userProfile {displayName}
 }
}

mutation UpdateWebsiteAgentCard($organizationId: UUID!, $membershipId: UUID!, $websiteTitle: String, $websitePhone: String, $websiteWhatsapp: String)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") @transaction {
 before: query @redact {
  admin: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}) @check(expr: "this != null", message: "ADMINISTRATOR_REQUIRED") {id}
  agent: membership(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $membershipId}, status: {eq: ACTIVE}}}) @check(expr: "this != null", message: "WEBSITE_AGENT_NOT_FOUND") {id}
 }
 membership_update(key: {organizationId: $organizationId, id: $membershipId}, data: {websiteTitle: $websiteTitle, websitePhone: $websitePhone, websiteWhatsapp: $websiteWhatsapp, updatedAt_expr: "request.time"})
 auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: WEBSITE_AGENT_CARD_UPDATED, targetType: MEMBERSHIP, targetId: $membershipId})
}

# --- Website media library (uploads) ------------------------------------------
# Records are created and activated only by the server (NO_ACCESS), so storage
# paths are always server-built. Uploading needs the same right as creating a
# page: owners, administrators and managers, or agents when agent drafts are on.

query GetWebsiteMediaAccess($organizationId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
 member: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
 website: website(first: {where: {organizationId: {eq: $organizationId}, status: {eq: ACTIVE}}}) {id allowAgentDrafts}
}

mutation CreateWebsiteMedia($organizationId: UUID!, $id: UUID!, $websiteId: UUID!, $fileName: String!, $contentType: String!, $byteSize: Int!, $width: Int, $height: Int, $alt: String!, $storagePath: String!, $actorUid: String!)
 @auth(level: NO_ACCESS) @transaction {
 media: websiteMedia_insert(data: {organizationId: $organizationId, id: $id, websiteId: $websiteId, fileName: $fileName, contentType: $contentType, byteSize: $byteSize, width: $width, height: $height,
  alt: $alt, storagePath: $storagePath, status: PENDING, createdByUid: $actorUid})
}

mutation SetWebsiteMediaUploadStatus($organizationId: UUID!, $id: UUID!, $status: WebsiteMediaStatus!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
 media: websiteMedia_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, status: {eq: PENDING}}}, data: {status: $status, updatedAt_expr: "request.time"})
  @check(expr: "this != null", message: "WEBSITE_MEDIA_NOT_FOUND")
 auditLog_insert(data: {organizationId: $organizationId, actorUid: $actorUid, action: WEBSITE_MEDIA_UPLOADED, targetType: WEBSITE_MEDIA, targetId: $id})
}

query ListWebsiteMedia($organizationId: UUID!, $limit: Int! = 60, $offset: Int! = 0)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.limit >= 1 && vars.limit <= 100 && vars.offset >= 0 && vars.offset <= 5000") {
 ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id}
 media: websiteMedias(where: {organizationId: {eq: $organizationId}, status: {eq: ACTIVE}}, orderBy: [{createdAt: DESC}], limit: $limit, offset: $offset) {
  id fileName contentType byteSize width height alt createdAt createdByUid createdBy {displayName}
 }
 total: websiteMedias(where: {organizationId: {eq: $organizationId}, status: {eq: ACTIVE}}) {id}
}

# Used to validate page saves, resolve editor previews and build publication assets.
query GetWebsiteMediaByIds($organizationId: UUID!, $ids: [UUID!]!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.ids.size() <= 60") {
 ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id}
 media: websiteMedias(where: {organizationId: {eq: $organizationId}, id: {in: $ids}, status: {in: [ACTIVE, ARCHIVED]}}, limit: 60) {
  id status contentType storagePath alt width height
 }
}

