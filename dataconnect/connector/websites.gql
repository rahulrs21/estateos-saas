 before: query @redact @check(expr: "this.member != null && this.media != null && (this.member.role in ['OWNER', 'ADMIN'] || this.media.createdByUid == auth.uid)", message: "WEBSITE_MEDIA_FORBIDDEN") {
  member: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) {id role}
