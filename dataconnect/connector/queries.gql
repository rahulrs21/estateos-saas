}

# These lookup operations are server-only. The public HTTP endpoint calls them
# with the Admin SDK; no unauthenticated client may invoke them directly.
query ResolveWebsiteLeadCaptureForm($publicId: String!) @auth(level: NO_ACCESS) {
 form: leadCaptureForm(first: {where: {publicId: {eq: $publicId}}})
  @check(expr: "this != null && this.status == 'ACTIVE'", message: "FORM_UNAVAILABLE") {
   id organizationId publicId name status sourceId source {name sourceType} branchId projectId fields consentText privacyPolicyUrl successMessage createdByUid
   organization {id}
  }
}

query FindWebsiteLeadCaptureContact($organizationId: UUID!, $normalizedEmail: String, $normalizedPhone: String)
 @auth(level: NO_ACCESS) {
 contacts(where: {_and: [{organizationId: {eq: $organizationId}}, {_or: [
  {normalizedEmail: {eq_expr: "has(vars.normalizedEmail) && vars.normalizedEmail != null ? vars.normalizedEmail : '__no_email_match__'"}},
  {normalizedPhone: {eq_expr: "has(vars.normalizedPhone) && vars.normalizedPhone != null ? vars.normalizedPhone : '__no_phone_match__'"}}
 ]}]}, limit: 2, orderBy: [{createdAt: ASC}, {id: ASC}]) {id normalizedEmail normalizedPhone}
}

query GetWebsiteLeadCaptureRateWindow($organizationId: UUID!, $formId: UUID!, $windowStart: Timestamp!) @auth(level: NO_ACCESS) {
 window: leadCaptureRateWindow(first: {where: {organizationId: {eq: $organizationId}, formId: {eq: $formId}, windowStart: {eq: $windowStart}}}) {id requestCount}
}

query FindWebsiteLeadCaptureSubmission($organizationId: UUID!, $formId: UUID!, $idempotencyKeyHash: String!) @auth(level: NO_ACCESS) {
 submission: leadCaptureSubmission(first: {where: {organizationId: {eq: $organizationId}, formId: {eq: $formId}, idempotencyKeyHash: {eq: $idempotencyKeyHash}}}) {id leadId sourceId landingPageUrl utmSource utmMedium utmCampaign utmContent utmTerm consentGiven consentTextSnapshot privacyPolicyUrlSnapshot consentAt submittedAt}
}

query GetWebsiteLeadDistributionPlan($organizationId: UUID!) @auth(level: NO_ACCESS) {
 rule: leadDistributionRule(first: {where: {organizationId: {eq: $organizationId}, ruleKey: {eq: "DEFAULT"}, enabled: {eq: true}, mode: {eq: ROUND_ROBIN}}}) {
  id organizationId enabled mode branchId projectId skipUnavailable businessHoursEnabled timeZone businessDaysMask businessStart businessEnd
  cursor: distributionCursor_on_rule {version lastMembershipId lastAssignedAt}
 }
 eligibleAgents: memberships(where: {organizationId: {eq: $organizationId}, role: {eq: AGENT}, status: {eq: ACTIVE}, userProfileUid: {isNull: false}, distributionEligible: {eq: true}}, limit: 200, orderBy: [{id: ASC}]) {
  id role status userProfileUid agentAvailability_on_membership {status unavailableUntil}
 }
}

query GetLeadAnalytics($organizationId: UUID!, $from: Timestamp!, $to: Timestamp!, $timeZone: String!, $bucket: String!, $sourceId: UUID, $pipelineStageId: UUID, $assignedMembershipId: UUID)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.from < vars.to && vars.bucket in ['day', 'week', 'month'] && vars.timeZone.size() <= 64") {
 ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
 summary: _selectFirst(sql: """
  SELECT
   COUNT(*) FILTER (WHERE l.created_at >= $3 AND l.created_at < $4) AS total_leads,
   COUNT(*) FILTER (WHERE l.created_at >= $3 AND l.created_at < $4 AND l.assigned_membership_id IS NULL) AS unassigned_leads,
   COUNT(*) FILTER (WHERE l.created_at >= $3 AND l.created_at < $4 AND l.status IN ('WON', 'CONVERTED')) AS won_leads,
   CASE WHEN COUNT(*) FILTER (WHERE l.created_at >= $3 AND l.created_at < $4) = 0 THEN 0
    ELSE ROUND(100.0 * COUNT(*) FILTER (WHERE l.created_at >= $3 AND l.created_at < $4 AND l.status IN ('WON', 'CONVERTED')) / COUNT(*) FILTER (WHERE l.created_at >= $3 AND l.created_at < $4), 2) END AS lead_to_won_percent,
   (SELECT COUNT(*) FROM lead_follow_up f JOIN lead fl ON fl.organization_id = f.organization_id AND fl.id = f.lead_id
    WHERE f.organization_id = $1 AND f.status = 'PENDING' AND f.due_at < now() AND fl.archived_at IS NULL
     AND ($5::uuid IS NULL OR fl.source_id = $5) AND ($6::uuid IS NULL OR fl.pipeline_stage_id = $6) AND ($7::uuid IS NULL OR fl.assigned_membership_id = $7)
     AND ((SELECT m.role FROM membership m WHERE m.organization_id = $1 AND m.user_profile_uid = $2 AND m.status = 'ACTIVE' LIMIT 1) IN ('OWNER', 'ADMIN')
      OR fl.assigned_membership_id = (SELECT m.id FROM membership m WHERE m.organization_id = $1 AND m.user_profile_uid = $2 AND m.status = 'ACTIVE' LIMIT 1))) AS overdue_follow_ups
  FROM lead l
  WHERE l.organization_id = $1 AND l.archived_at IS NULL
   AND ($5::uuid IS NULL OR l.source_id = $5) AND ($6::uuid IS NULL OR l.pipeline_stage_id = $6) AND ($7::uuid IS NULL OR l.assigned_membership_id = $7)
   AND ((SELECT m.role FROM membership m WHERE m.organization_id = $1 AND m.user_profile_uid = $2 AND m.status = 'ACTIVE' LIMIT 1) IN ('OWNER', 'ADMIN')
    OR l.assigned_membership_id = (SELECT m.id FROM membership m WHERE m.organization_id = $1 AND m.user_profile_uid = $2 AND m.status = 'ACTIVE' LIMIT 1))
 """, params: [$organizationId, {_expr: "auth.uid"}, $from, $to, $sourceId, $pipelineStageId, $assignedMembershipId])
 sources: _select(sql: """
  SELECT COALESCE(NULLIF(s.name, ''), NULLIF(l.source, ''), 'Unspecified') AS label, COUNT(*) AS count
  FROM lead l LEFT JOIN lead_source s ON s.organization_id = l.organization_id AND s.id = l.source_id
  WHERE l.organization_id = $1 AND l.archived_at IS NULL AND l.created_at >= $3 AND l.created_at < $4
   AND ($5::uuid IS NULL OR l.source_id = $5) AND ($6::uuid IS NULL OR l.pipeline_stage_id = $6) AND ($7::uuid IS NULL OR l.assigned_membership_id = $7)
   AND ((SELECT m.role FROM membership m WHERE m.organization_id = $1 AND m.user_profile_uid = $2 AND m.status = 'ACTIVE' LIMIT 1) IN ('OWNER', 'ADMIN')
    OR l.assigned_membership_id = (SELECT m.id FROM membership m WHERE m.organization_id = $1 AND m.user_profile_uid = $2 AND m.status = 'ACTIVE' LIMIT 1))
  GROUP BY 1 ORDER BY count DESC, label ASC LIMIT 50
 """, params: [$organizationId, {_expr: "auth.uid"}, $from, $to, $sourceId, $pipelineStageId, $assignedMembershipId])
 stages: _select(sql: """
  SELECT COALESCE(ps.name, l.status::text) AS label, COUNT(*) AS count
  FROM lead l LEFT JOIN pipeline_stage ps ON ps.organization_id = l.organization_id AND ps.pipeline_id = l.pipeline_id AND ps.id = l.pipeline_stage_id
  WHERE l.organization_id = $1 AND l.archived_at IS NULL AND l.created_at >= $3 AND l.created_at < $4
   AND ($5::uuid IS NULL OR l.source_id = $5) AND ($6::uuid IS NULL OR l.pipeline_stage_id = $6) AND ($7::uuid IS NULL OR l.assigned_membership_id = $7)
   AND ((SELECT m.role FROM membership m WHERE m.organization_id = $1 AND m.user_profile_uid = $2 AND m.status = 'ACTIVE' LIMIT 1) IN ('OWNER', 'ADMIN')
    OR l.assigned_membership_id = (SELECT m.id FROM membership m WHERE m.organization_id = $1 AND m.user_profile_uid = $2 AND m.status = 'ACTIVE' LIMIT 1))
  GROUP BY 1 ORDER BY count DESC, label ASC
 """, params: [$organizationId, {_expr: "auth.uid"}, $from, $to, $sourceId, $pipelineStageId, $assignedMembershipId])
 agents: _select(sql: """
  SELECT CASE WHEN l.assigned_membership_id IS NULL THEN 'Unassigned' ELSE COALESCE(NULLIF(u.display_name, ''), m.email, 'Agent') END AS label, COUNT(*) AS count
  FROM lead l LEFT JOIN membership m ON m.organization_id = l.organization_id AND m.id = l.assigned_membership_id
   LEFT JOIN user_profile u ON u.uid = m.user_profile_uid
  WHERE l.organization_id = $1 AND l.archived_at IS NULL AND l.created_at >= $3 AND l.created_at < $4
   AND ($5::uuid IS NULL OR l.source_id = $5) AND ($6::uuid IS NULL OR l.pipeline_stage_id = $6) AND ($7::uuid IS NULL OR l.assigned_membership_id = $7)
   AND ((SELECT actor.role FROM membership actor WHERE actor.organization_id = $1 AND actor.user_profile_uid = $2 AND actor.status = 'ACTIVE' LIMIT 1) IN ('OWNER', 'ADMIN')
    OR l.assigned_membership_id = (SELECT actor.id FROM membership actor WHERE actor.organization_id = $1 AND actor.user_profile_uid = $2 AND actor.status = 'ACTIVE' LIMIT 1))
  GROUP BY 1 ORDER BY count DESC, label ASC LIMIT 100
 """, params: [$organizationId, {_expr: "auth.uid"}, $from, $to, $sourceId, $pipelineStageId, $assignedMembershipId])
 volume: _select(sql: """
  SELECT date_trunc($5, l.created_at AT TIME ZONE $6)::date::text AS bucket, COUNT(*) AS count
  FROM lead l
  WHERE l.organization_id = $1 AND l.archived_at IS NULL AND l.created_at >= $3 AND l.created_at < $4
   AND ($7::uuid IS NULL OR l.source_id = $7) AND ($8::uuid IS NULL OR l.pipeline_stage_id = $8) AND ($9::uuid IS NULL OR l.assigned_membership_id = $9)
   AND ((SELECT actor.role FROM membership actor WHERE actor.organization_id = $1 AND actor.user_profile_uid = $2 AND actor.status = 'ACTIVE' LIMIT 1) IN ('OWNER', 'ADMIN')
    OR l.assigned_membership_id = (SELECT actor.id FROM membership actor WHERE actor.organization_id = $1 AND actor.user_profile_uid = $2 AND actor.status = 'ACTIVE' LIMIT 1))
  GROUP BY 1 ORDER BY 1
 """, params: [$organizationId, {_expr: "auth.uid"}, $from, $to, $bucket, $timeZone, $sourceId, $pipelineStageId, $assignedMembershipId])
}
