 {normalizedPhone: {eq_expr: "has(vars.phone) && vars.phone != null ? vars.phone : ''"}}, {normalizedPhone: {eq_expr: "has(vars.alternatePhone) && vars.alternatePhone != null ? vars.alternatePhone : ''"}},
 {normalizedAlternatePhone: {eq_expr: "has(vars.phone) && vars.phone != null ? vars.phone : ''"}}, {normalizedAlternatePhone: {eq_expr: "has(vars.alternatePhone) && vars.alternatePhone != null ? vars.alternatePhone : ''"}}
 ]}]}, limit: 25, orderBy: [{createdAt: DESC}, {id: DESC}]) {id fullName email phone alternatePhone}
}
query GetLeadCrmHistory($organizationId: UUID!, $leadId: UUID!, $limit: Int! = 25, $offset: Int! = 0) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.limit >= 1 && vars.limit <= 100 && vars.offset >= 0 && vars.offset <= 10000") {
 ownMembership: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") { id role }
 lead(first: {where: {_and: [{organizationId: {eq: $organizationId}, id: {eq: $leadId}}, { _or: [ { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }, { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } } ] }]}}) @redact @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN") {id}
 activities(where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, lead: { _or: [ { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }, { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } } ] }}, limit: $limit, offset: $offset, orderBy: [{createdAt: DESC}, {id: DESC}]) {id actorUid kind note metadata createdAt pipelineId previousStageId newStageId}
 activityTotal: activities(where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, lead: { _or: [ { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }, { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } } ] }}) {count: _count}
 assignments: leadAssignmentHistories(where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, lead: { _or: [ { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }, { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } } ] }}, limit: $limit, offset: $offset, orderBy: [{assignedAt: DESC}, {id: DESC}]) {id previousAgentId newAgentId assignedByUid assignmentType reason assignedAt}
 stages: activities(where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, newStageId: {isNull: false}, lead: { _or: [ { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }, { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } } ] }}, limit: $limit, offset: $offset, orderBy: [{createdAt: DESC}, {id: DESC}]) {id actorUid kind pipelineId previousStageId newStageId createdAt}
 followUps: leadFollowUps(where: {organizationId: {eq: $organizationId}, leadId: {eq: $leadId}, lead: { _or: [ { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }, { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } } ] }}, limit: $limit, offset: $offset, orderBy: [{dueAt: ASC}, {id: ASC}]) {id assignedUserId title dueAt status completedAt createdAt}
}

# KPI counts include active accessible leads across the company, independent of list filters.
query GetLeadMetrics($organizationId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
 ownMembership: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") { id }
 total: leads(where: {_and: [{organizationId: {eq: $organizationId}, archivedAt: {isNull: true}}, { _or: [
 { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } },
 { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } }
] }]}) { count: _count }
 newLeads: leads(where: {_and: [{organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, status: {eq: NEW}}, { _or: [
 { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } },
 { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } }
] }]}) { count: _count }
 qualified: leads(where: {_and: [{organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, status: {eq: QUALIFIED}}, { _or: [
 { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } },
 { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } }
] }]}) { count: _count }
 won: leads(where: {_and: [{organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, status: {in: [WON, CONVERTED]}}, { _or: [
 { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } },
 { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } }
] }]}) { count: _count }
}

