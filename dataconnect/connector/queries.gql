# All tenant lookups require current database membership; preference cookies and
# Firebase role claims never grant access. Invitations/hashes are never listed.
query GetMyProfile @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
 userProfile(key: { uid_expr: "auth.uid" }) { uid email displayName activeOrganizationId createdAt updatedAt }
}

query ListMyOrganizations($limit: Int! = 100, $offset: Int! = 0) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.limit >= 1 && vars.limit <= 100 && vars.offset >= 0 && vars.offset <= 10000") {
 memberships(where: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } }, limit: $limit, offset: $offset, orderBy: [{ createdAt: ASC }, { id: ASC }]) {
  id organizationId userProfileUid email role status organization { id name slug createdAt }
 }
}

# Recipient discovery does not grant membership or reveal a token/digest. A new
# Firebase identity can find its invitations without having a SQL profile yet.
# Expired pending links remain visible so the recipient can request a reissue.
query GetMyPendingInvitations @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
 invitations(where: {
  email: { eq_expr: "auth.token.email.lowerAscii()" }, status: { eq: PENDING }, role: { in: [ADMIN, MANAGER, AGENT] },
  membership: { status: { eq: INVITED }, userProfileUid: { isNull: true }, email: { eq_expr: "auth.token.email.lowerAscii()" } }
 }, limit: 25, orderBy: [{ createdAt: DESC }, { id: DESC }]) {
  id role expiresAt organization { name }
 }
}

query GetOrganizationContext($organizationId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
 ownMembership: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")  { id organizationId userProfileUid email role status }
 organization(id: $organizationId) @check(expr: "this != null", message: "ORGANIZATION_NOT_FOUND") { id name slug emirate contactPhone companyEmail companySize createdByUid createdAt updatedAt }
}

query ListBranches($organizationId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
 ownMembership: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") @redact { id organizationId userProfileUid email role status }
 branches(where: { organizationId: { eq: $organizationId } }, limit: 100, orderBy: [{ name: ASC }, { id: ASC }]) { id organizationId name createdByUid createdAt updatedAt }
}

query ListMemberships($organizationId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") {
 ownMembership: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }) @redact @check(expr: "this != null", message: "ADMINISTRATOR_REQUIRED") { id role }
 memberships(where: { organizationId: { eq: $organizationId } }, limit: 100, orderBy: [{ createdAt: DESC }, { id: DESC }]) { id organizationId userProfileUid email role status invitedByUid acceptedAt approvedAt approvedByUid invitationExpiresAt createdAt updatedAt }
}

# search is a bounded LIKE pattern; server UI escapes %, _ and backslash in the
# literal search term. Pagination counts use the identical tenant/access filter.
query ListLeads($organizationId: UUID!, $pipelineId: UUID, $pipelineStageId: UUID, $sourceId: UUID, $contactId: UUID, $priority: LeadPriority, $transactionType: TransactionType, $activeOnly: Boolean = true, $limit: Int! = 50, $offset: Int! = 0, $search: String, $status: LeadStatus, $assignedMembershipId: UUID, $branchId: UUID, $followUpBefore: Timestamp, $followUpAfter: Timestamp, $createdFrom: Timestamp, $createdBefore: Timestamp)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.limit >= 1 && vars.limit <= 100 && vars.offset >= 0 && vars.offset <= 10000 && (!has(vars.search) || vars.search == null || vars.search.size() <= 242)") {
 ownMembership: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") @redact { id organizationId userProfileUid email role status }
 leads(where: { _and: [
  { organizationId: { eq: $organizationId }, archivedAt: { isNull: $activeOnly }, pipelineId: { eq: $pipelineId }, pipelineStageId: { eq: $pipelineStageId }, sourceId: { eq: $sourceId }, contactId: { eq: $contactId }, priority: { eq: $priority }, transactionType: { eq: $transactionType }, status: { eq: $status }, assignedMembershipId: { eq: $assignedMembershipId }, branchId: { eq: $branchId }, followUpAt: { lt: $followUpBefore, ge: $followUpAfter }, createdAt: {ge: $createdFrom, lt: $createdBefore} },
  { _or: [{ fullName: { pattern: { like: $search, ignoreCase: true } } }, { email: { pattern: { like: $search, ignoreCase: true } } }, { phone: { pattern: { like: $search, ignoreCase: true } } }, { source: { pattern: { like: $search, ignoreCase: true } } }, { contact: { _or: [{ fullName: { pattern: { like: $search, ignoreCase: true } } }, { email: { pattern: { like: $search, ignoreCase: true } } }, { phone: { pattern: { like: $search, ignoreCase: true } } }] } }] },
  { _or: [
  { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } },
  { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } }
] }] }, limit: $limit, offset: $offset, orderBy: [{createdAt: DESC}, {id: ASC}]) {
  id organizationId fullName email phone source status branchId assignedMembershipId projectId followUpAt followUpNote createdByUid updatedByUid createdAt updatedAt
 contactId leadNumber sourceId pipelineId pipelineStageId propertyInterest preferredLocation propertyType transactionType budgetMin budgetMax currency bedroomPreference priority archivedAt
 contact { id organizationId fullName email normalizedEmail phone normalizedPhone alternatePhone normalizedAlternatePhone nationality preferredLanguage notes createdByUid createdAt updatedAt }
 pipelineStage { id name position stageType status }
 leadSource { id name sourceType }

  branch { id name }
  assignedMembership { id email role userProfile { uid displayName } }
 }
 total: leads(where: { _and: [
  { organizationId: { eq: $organizationId }, archivedAt: { isNull: $activeOnly }, pipelineId: { eq: $pipelineId }, pipelineStageId: { eq: $pipelineStageId }, sourceId: { eq: $sourceId }, contactId: { eq: $contactId }, priority: { eq: $priority }, transactionType: { eq: $transactionType }, status: { eq: $status }, assignedMembershipId: { eq: $assignedMembershipId }, branchId: { eq: $branchId }, followUpAt: { lt: $followUpBefore, ge: $followUpAfter }, createdAt: {ge: $createdFrom, lt: $createdBefore} },
  { _or: [{ fullName: { pattern: { like: $search, ignoreCase: true } } }, { email: { pattern: { like: $search, ignoreCase: true } } }, { phone: { pattern: { like: $search, ignoreCase: true } } }, { source: { pattern: { like: $search, ignoreCase: true } } }, { contact: { _or: [{ fullName: { pattern: { like: $search, ignoreCase: true } } }, { email: { pattern: { like: $search, ignoreCase: true } } }, { phone: { pattern: { like: $search, ignoreCase: true } } }] } }] },
  { _or: [
   { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } },
   { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } } } }
  ] }
 ] }) { count: _count }
}

