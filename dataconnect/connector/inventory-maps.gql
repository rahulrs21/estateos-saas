  total: propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, assignedMembershipId: {eq: $assignedMembershipId}, listingStatus: {eq: $listingStatus}, listingPurpose: {eq: $purpose}, marketType: {eq: $marketType}, askingPriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, property: {emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, propertyType: {eq: $propertyType}}, title: {pattern: {like: $search, ignoreCase: true}}}) {_count}
