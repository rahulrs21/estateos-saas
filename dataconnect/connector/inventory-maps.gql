# Phase 5F map pins. These reads mirror the list operations' tenant and role
# checks, but only return rows that may appear on a map: coordinates present and
# mapDisplayMode EXACT or APPROXIMATE. HIDDEN coordinates never leave the
# database through these operations. The server further coarsens APPROXIMATE
# points before any pin reaches a browser (src/modules/maps/geo.ts).
#
# Optional $south/$north/$west/$east restrict rows and the "mapped" count to the
# visible map area; "mappedAll" ignores the area so the UI can report records
# outside it. The server snaps requested bounds outward to the approximate grid
# so a bounds query cannot locate an APPROXIMATE point more precisely than its
# published grid cell. $offset pages through results; nothing is silently cut.
query ListPropertyMapPins($organizationId: UUID!, $projectId: UUID, $developerId: UUID, $buildingId: UUID, $inventoryStatus: InventoryStatus, $propertyType: PropertyType, $marketType: MarketType, $emirate: Emirate, $community: String, $bedrooms: Int, $minimumPriceMinor: Int64, $maximumPriceMinor: Int64, $assignedMembershipId: UUID, $limit: Int! = 250, $offset: Int! = 0, $south: Float, $north: Float, $west: Float, $east: Float, $search: String)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.limit >= 1 && vars.limit <= 1000 && vars.offset >= 0 && vars.offset <= 20000 && (!has(vars.search) || vars.search == null || vars.search.size() <= 120)") {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null && this.role in ['OWNER', 'ADMIN', 'AGENT'] && (this.role != 'AGENT' || this.id == vars.assignedMembershipId)", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  properties(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, projectId: {eq: $projectId}, project: {developerId: {eq: $developerId}}, buildingId: {eq: $buildingId}, inventoryStatus: {eq: $inventoryStatus}, propertyType: {eq: $propertyType}, marketType: {eq: $marketType}, emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, bedrooms: {eq: $bedrooms}, referencePriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, assignedMembershipId: {eq: $assignedMembershipId}, propertyReference: {pattern: {like: $search, ignoreCase: true}}, latitude: {isNull: false, ge: $south, le: $north}, longitude: {isNull: false, ge: $west, le: $east}, mapDisplayMode: {in: [EXACT, APPROXIMATE]}}, limit: $limit, offset: $offset, orderBy: [{updatedAt: DESC}, {id: ASC}]) {id propertyReference project {projectName} building {name} unitNumber propertyType marketType bedrooms bathrooms builtUpArea areaUnit emirate city community area latitude longitude mapDisplayMode referencePriceMinor inventoryStatus inventoryMedias_on_property(where: {status: {eq: ACTIVE}, archivedAt: {isNull: true}, contentType: {in: ["image/jpeg", "image/png", "image/webp"]}, mediaKind: {eq: PROPERTY_PHOTO}}, orderBy: [{isCover: DESC}, {sortOrder: ASC}, {createdAt: ASC}], limit: 1) {id}}
  mapped: properties(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, projectId: {eq: $projectId}, project: {developerId: {eq: $developerId}}, buildingId: {eq: $buildingId}, inventoryStatus: {eq: $inventoryStatus}, propertyType: {eq: $propertyType}, marketType: {eq: $marketType}, emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, bedrooms: {eq: $bedrooms}, referencePriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, assignedMembershipId: {eq: $assignedMembershipId}, propertyReference: {pattern: {like: $search, ignoreCase: true}}, latitude: {isNull: false, ge: $south, le: $north}, longitude: {isNull: false, ge: $west, le: $east}, mapDisplayMode: {in: [EXACT, APPROXIMATE]}}) {_count}
  mappedAll: properties(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, projectId: {eq: $projectId}, project: {developerId: {eq: $developerId}}, buildingId: {eq: $buildingId}, inventoryStatus: {eq: $inventoryStatus}, propertyType: {eq: $propertyType}, marketType: {eq: $marketType}, emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, bedrooms: {eq: $bedrooms}, referencePriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, assignedMembershipId: {eq: $assignedMembershipId}, propertyReference: {pattern: {like: $search, ignoreCase: true}}, latitude: {isNull: false}, longitude: {isNull: false}, mapDisplayMode: {in: [EXACT, APPROXIMATE]}}) {_count}
  total: properties(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, projectId: {eq: $projectId}, project: {developerId: {eq: $developerId}}, buildingId: {eq: $buildingId}, inventoryStatus: {eq: $inventoryStatus}, propertyType: {eq: $propertyType}, marketType: {eq: $marketType}, emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, bedrooms: {eq: $bedrooms}, referencePriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, assignedMembershipId: {eq: $assignedMembershipId}, propertyReference: {pattern: {like: $search, ignoreCase: true}}}) {_count}
}

query ListPropertyListingMapPins($organizationId: UUID!, $listingStatus: ListingStatus, $purpose: ListingPurpose, $marketType: MarketType, $emirate: Emirate, $community: String, $propertyType: PropertyType, $minimumPriceMinor: Int64, $maximumPriceMinor: Int64, $limit: Int! = 250, $offset: Int! = 0, $south: Float, $north: Float, $west: Float, $east: Float, $search: String)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.limit >= 1 && vars.limit <= 1000 && vars.offset >= 0 && vars.offset <= 20000 && (!has(vars.search) || vars.search == null || vars.search.size() <= 120)") {
  ownMembership: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}}}) @redact @check(expr: "this != null && this.role in ['OWNER', 'ADMIN']", message: "ACTIVE_MEMBERSHIP_REQUIRED") {id role}
  propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, listingStatus: {eq: $listingStatus}, listingPurpose: {eq: $purpose}, marketType: {eq: $marketType}, askingPriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, property: {emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, propertyType: {eq: $propertyType}, archivedAt: {isNull: true}, latitude: {isNull: false, ge: $south, le: $north}, longitude: {isNull: false, ge: $west, le: $east}, mapDisplayMode: {in: [EXACT, APPROXIMATE]}}, title: {pattern: {like: $search, ignoreCase: true}}}, limit: $limit, offset: $offset, orderBy: [{updatedAt: DESC}, {id: ASC}]) {id listingReference listingPurpose marketType title askingPriceMinor currency rentalPeriod listingStatus property {id propertyReference propertyType bedrooms emirate city community latitude longitude mapDisplayMode project {projectName}}}
  mapped: propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, listingStatus: {eq: $listingStatus}, listingPurpose: {eq: $purpose}, marketType: {eq: $marketType}, askingPriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, property: {emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, propertyType: {eq: $propertyType}, archivedAt: {isNull: true}, latitude: {isNull: false, ge: $south, le: $north}, longitude: {isNull: false, ge: $west, le: $east}, mapDisplayMode: {in: [EXACT, APPROXIMATE]}}, title: {pattern: {like: $search, ignoreCase: true}}}) {_count}
  mappedAll: propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, listingStatus: {eq: $listingStatus}, listingPurpose: {eq: $purpose}, marketType: {eq: $marketType}, askingPriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, property: {emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, propertyType: {eq: $propertyType}, archivedAt: {isNull: true}, latitude: {isNull: false}, longitude: {isNull: false}, mapDisplayMode: {in: [EXACT, APPROXIMATE]}}, title: {pattern: {like: $search, ignoreCase: true}}}) {_count}
  total: propertyListings(where: {organizationId: {eq: $organizationId}, archivedAt: {isNull: true}, listingStatus: {eq: $listingStatus}, listingPurpose: {eq: $purpose}, marketType: {eq: $marketType}, askingPriceMinor: {ge: $minimumPriceMinor, le: $maximumPriceMinor}, property: {emirate: {eq: $emirate}, community: {pattern: {like: $community, ignoreCase: true}}, propertyType: {eq: $propertyType}}, title: {pattern: {like: $search, ignoreCase: true}}}) {_count}
}

