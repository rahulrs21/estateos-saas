 ] }, { followUpAt: { isNull: false } }] } }, data: { updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time", followUpAt: null, followUpNote: null }) @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN")
