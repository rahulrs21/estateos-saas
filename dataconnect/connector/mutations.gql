}

# UID, owner privilege, actor and timestamps are derived inside the connector.
# Every multi-table business change and its audit event commit atomically.
mutation UpsertMyProfile($displayName: String!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.displayName.size() >= 1 && vars.displayName.size() <= 120") {
 userProfile_upsert(data: { uid_expr: "auth.uid", email_expr: "auth.token.email.lowerAscii()", displayName: $displayName, updatedAt_expr: "request.time" })
}

mutation CreateOrganization($name: String!, $slug: String!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.name.size() >= 1 && vars.name.size() <= 160 && vars.slug.matches('^[a-z0-9]+(-[a-z0-9]+)*$') && vars.slug.size() <= 63")
 @transaction {
 query @redact { userProfile(key: { uid_expr: "auth.uid" }) @check(expr: "this != null", message: "PROFILE_REQUIRED") { uid } }
 organization: organization_insert(data: { name: $name, slug: $slug, createdByUid_expr: "auth.uid" })
 ownerMembership: membership_insert(data: { organizationId_expr: "response.organization.id", userProfileUid_expr: "auth.uid", email_expr: "auth.token.email.lowerAscii()", role: OWNER, status: ACTIVE, approvedAt_expr: "request.time", approvedByUid_expr: "auth.uid" })
 userProfile_update(key: { uid_expr: "auth.uid" }, data: { activeOrganizationId_expr: "response.organization.id", updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "PROFILE_REQUIRED")
 activity_insert(data: { organizationId_expr: "response.organization.id", actorUid_expr: "auth.uid", kind: ORGANIZATION_CREATED })
}

mutation SwitchOrganization($organizationId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 query @redact {
 actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") { id role }
}
 userProfile_update(key: { uid_expr: "auth.uid" }, data: { activeOrganizationId: $organizationId, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "PROFILE_REQUIRED")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: ORGANIZATION_SWITCHED,  })
}

mutation CreateBranch($organizationId: UUID!, $name: String!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.name.size() >= 1 && vars.name.size() <= 120") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 query @redact {
 actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") { id role }
}
 branch: branch_insert(data: { organizationId: $organizationId, name: $name, createdByUid_expr: "auth.uid" })
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: BRANCH_CREATED, targetId_expr: "response.branch.id" })
}

mutation InviteMembership($organizationId: UUID!, $email: String!, $role: MembershipRole!, $tokenHash: String!, $expiresAt: Timestamp!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.email == vars.email.lowerAscii() && vars.email != auth.token.email.lowerAscii() && vars.email.size() >= 3 && vars.email.size() <= 254 && vars.role in ['ADMIN', 'MANAGER', 'AGENT'] && vars.tokenHash.matches('^[a-f0-9]{64}$') && timestamp(vars.expiresAt) > request.time && timestamp(vars.expiresAt) <= request.time + duration('604800s')") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 query @redact {
  actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } })
   @check(expr: "this != null && (this.role == 'OWNER' || vars.role in ['MANAGER', 'AGENT'])", message: "ROLE_GRANT_FORBIDDEN") { id role }
 }
 membership: membership_insert(data: { organizationId: $organizationId, email: $email, role: $role, status: INVITED, invitedByUid_expr: "auth.uid", invitationTokenHash: $tokenHash, invitationExpiresAt: $expiresAt })
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: MEMBERSHIP_INVITED, targetId_expr: "response.membership.id", metadata_expr: "{'role': vars.role, 'status': 'INVITED'}" })
}

# Acceptance proves possession and verified address, but requires a separate
# administrator approval before the new member can read any organization data.
mutation AcceptInvitation($organizationId: UUID!, $membershipId: UUID!, $tokenHash: String!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.tokenHash.matches('^[a-f0-9]{64}$')") @transaction {
 query @redact { userProfile(key: { uid_expr: "auth.uid" }) @check(expr: "this != null", message: "PROFILE_REQUIRED") { uid } }
 membership: membership_update(first: { where: {
  organizationId: { eq: $organizationId }, id: { eq: $membershipId },
  status: { eq: INVITED }, userProfileUid: { isNull: true },
  email: { eq_expr: "auth.token.email.lowerAscii()" },
  invitationTokenHash: { eq: $tokenHash },
  invitationExpiresAt: { gt_expr: "request.time" },
  role: { in: [ADMIN, MANAGER, AGENT] }
 } }, data: { userProfileUid_expr: "auth.uid", status: PENDING, invitationTokenHash: null, acceptedAt_expr: "request.time", updatedAt_expr: "request.time" })
 @check(expr: "this != null", message: "INVITATION_INVALID_OR_EXPIRED")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: INVITATION_ACCEPTED, targetId: $membershipId, metadata: { status: "PENDING" } })
}

mutation ApproveMembership($organizationId: UUID!, $membershipId: UUID!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 query @redact @check(expr: "this.actor != null && this.target != null && this.target.status == 'PENDING' && this.target.userProfileUid != null && this.target.userProfileUid != auth.uid && this.target.role != 'OWNER' && (this.actor.role == 'OWNER' || this.target.role in ['MANAGER', 'AGENT'])", message: "MEMBERSHIP_APPROVAL_FORBIDDEN") {
 actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") { id role }
  target: membership(key: { organizationId: $organizationId, id: $membershipId })
   { id userProfileUid role status }
 }
 membership: membership_update(first: { where: { organizationId: { eq: $organizationId }, id: { eq: $membershipId }, status: { eq: PENDING }, userProfileUid: { ne_expr: "auth.uid" }, role: { ne: OWNER } } },
  data: { status: ACTIVE, approvedAt_expr: "request.time", approvedByUid_expr: "auth.uid", updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "MEMBERSHIP_APPROVAL_FORBIDDEN")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: MEMBERSHIP_APPROVED, targetId: $membershipId, metadata: { status: "ACTIVE" } })
}

mutation SetMembershipStatus($organizationId: UUID!, $membershipId: UUID!, $status: MembershipStatus!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.status in ['SUSPENDED', 'REVOKED']") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 query @redact @check(expr: "this.actor != null && this.target != null && this.target.userProfileUid != auth.uid && this.target.role != 'OWNER' && this.target.status != 'REVOKED' && (this.actor.role == 'OWNER' || this.target.role in ['MANAGER', 'AGENT'])", message: "MEMBERSHIP_CHANGE_FORBIDDEN") {
 actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") { id role }
  target: membership(key: { organizationId: $organizationId, id: $membershipId })
   { id userProfileUid role status }
 }
 membership: membership_update(first: { where: { organizationId: { eq: $organizationId }, id: { eq: $membershipId }, role: { ne: OWNER }, status: { ne: REVOKED } } },
  data: { status: $status, invitationTokenHash: null, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "MEMBERSHIP_CHANGE_FORBIDDEN")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind_expr: "vars.status == 'SUSPENDED' ? 'MEMBERSHIP_SUSPENDED' : 'MEMBERSHIP_REVOKED'", targetId: $membershipId, metadata_expr: "{'status': vars.status}" })
}





