# Managers see all tenant leads. Agents can only access leads assigned to their
# own ACTIVE membership, including on direct connector calls.
# Authorization updates lock ACTIVE memberships until the transaction commits.
# PostgreSQL data-modifying CTEs must not update the same row twice: the assignee
# lock excludes auth.uid, and its check accepts the already-locked actor key.
mutation CreateLead($organizationId: UUID!, $fullName: String!, $email: String, $phone: String, $source: String, $branchId: UUID, $assignedMembershipId: UUID)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.fullName.size() >= 1 && vars.fullName.size() <= 160 && (!has(vars.email) || vars.email == null || vars.email.size() <= 254) && (!has(vars.phone) || vars.phone == null || vars.phone.size() <= 32) && (!has(vars.source) || vars.source == null || vars.source.size() <= 120)") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 assigneeAuthorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, id: { eq: $assignedMembershipId }, userProfileUid: { ne_expr: "auth.uid", isNull: false }, status: { eq: ACTIVE } } }, data: { status: ACTIVE }) @redact @check(expr: "!has(vars.assignedMembershipId) || vars.assignedMembershipId == null || vars.assignedMembershipId == response.authorization.id || this != null", message: "ASSIGNEE_NOT_ACTIVE_IN_ORGANIZATION")
 query @redact {
 actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } })
 @check(expr: "this != null && (this.role in ['OWNER', 'ADMIN', 'MANAGER'] || (this.role == 'AGENT' && has(vars.assignedMembershipId) && vars.assignedMembershipId == this.id))", message: "LEAD_WRITE_FORBIDDEN") { id role }
 branch: branch(first: { where: { organizationId: { eq: $organizationId }, id: { eq: $branchId } } })
 @check(expr: "!has(vars.branchId) || vars.branchId == null || this != null", message: "BRANCH_NOT_FOUND_IN_ORGANIZATION") { id }
 assignee: membership(first: { where: { organizationId: { eq: $organizationId }, id: { eq: $assignedMembershipId }, status: { eq: ACTIVE }, userProfileUid: { isNull: false } } })
 @check(expr: "!has(vars.assignedMembershipId) || vars.assignedMembershipId == null || this != null", message: "ASSIGNEE_NOT_ACTIVE_IN_ORGANIZATION") { id }
}
 lead: lead_insert(data: { organizationId: $organizationId, fullName: $fullName, email: $email, phone: $phone, source: $source, branchId: $branchId, assignedMembershipId: $assignedMembershipId, updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time", createdByUid_expr: "auth.uid", status: NEW })
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: LEAD_CREATED, leadId_expr: "response.lead.id", targetId_expr: "response.lead.id" })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: LEAD_CREATED, targetId_expr: "response.lead.id", targetType: LEAD })
}

mutation UpdateLead($leadId: UUID!, $status: LeadStatus!, $organizationId: UUID!, $fullName: String!, $email: String, $phone: String, $source: String, $branchId: UUID, $assignedMembershipId: UUID)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.fullName.size() >= 1 && vars.fullName.size() <= 160 && (!has(vars.email) || vars.email == null || vars.email.size() <= 254) && (!has(vars.phone) || vars.phone == null || vars.phone.size() <= 32) && (!has(vars.source) || vars.source == null || vars.source.size() <= 120)") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 assigneeAuthorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, id: { eq: $assignedMembershipId }, userProfileUid: { ne_expr: "auth.uid", isNull: false }, status: { eq: ACTIVE } } }, data: { status: ACTIVE }) @redact @check(expr: "!has(vars.assignedMembershipId) || vars.assignedMembershipId == null || vars.assignedMembershipId == response.authorization.id || this != null", message: "ASSIGNEE_NOT_ACTIVE_IN_ORGANIZATION")
 query @redact {
 actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } })
 @check(expr: "this != null && (this.role in ['OWNER', 'ADMIN', 'MANAGER'] || (this.role == 'AGENT' && has(vars.assignedMembershipId) && vars.assignedMembershipId == this.id))", message: "LEAD_WRITE_FORBIDDEN") { id role }
 branch: branch(first: { where: { organizationId: { eq: $organizationId }, id: { eq: $branchId } } })
 @check(expr: "!has(vars.branchId) || vars.branchId == null || this != null", message: "BRANCH_NOT_FOUND_IN_ORGANIZATION") { id }
 assignee: membership(first: { where: { organizationId: { eq: $organizationId }, id: { eq: $assignedMembershipId }, status: { eq: ACTIVE }, userProfileUid: { isNull: false } } })
 @check(expr: "!has(vars.assignedMembershipId) || vars.assignedMembershipId == null || this != null", message: "ASSIGNEE_NOT_ACTIVE_IN_ORGANIZATION") { id }
}
 lead: lead_update(first: { where: { _and: [
  { organizationId: { eq: $organizationId }, id: { eq: $leadId } },
  { _or: [
  { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } },
  { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER] } } } } }
] }
 ] } }, data: { fullName: $fullName, email: $email, phone: $phone, source: $source, branchId: $branchId, assignedMembershipId: $assignedMembershipId, updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time", status: $status }) @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: LEAD_UPDATED, leadId: $leadId, targetId: $leadId, metadata_expr: "{'status': vars.status}" })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: LEAD_UPDATED, targetId: $leadId, metadata_expr: "{'status': vars.status}", targetType: LEAD })
}

# Lead sub-operations lock and authorize the current actor and selected lead,
# rather than accepting organization-wide timeline or write privileges. The
# lead update obtains a row lock before the append-only event is committed.
mutation AddLeadNote($organizationId: UUID!, $leadId: UUID!, $note: String!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.note.size() >= 1 && vars.note.size() <= 4000") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 lead: lead_update(first: { where: { _and: [{ organizationId: { eq: $organizationId }, id: { eq: $leadId } }, { _or: [
  { assignedMembership: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } },
  { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER] } } } } }
 ] }] } }, data: { updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN")
 activity: activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: LEAD_NOTE_ADDED, leadId: $leadId, targetId: $leadId, note: $note })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: LEAD_NOTE_ADDED, targetId: $leadId, targetType: LEAD })
}

