}

mutation SubmitWebsiteLeadCapture($organizationId: UUID!, $formId: UUID!, $publicId: String!, $idempotencyKeyHash: String!, $fullName: String!, $email: String, $phone: String, $normalizedEmail: String, $normalizedPhone: String, $contactId: UUID, $hasExistingContact: Boolean!, $message: String, $propertyInterest: String, $preferredLocation: String, $propertyType: String, $transactionType: TransactionType, $budgetMin: Float, $budgetMax: Float, $currency: String!, $bedroomPreference: String, $landingPageUrl: String, $utmSource: String, $utmMedium: String, $utmCampaign: String, $utmContent: String, $utmTerm: String!, $consentTextSnapshot: String!, $privacyPolicyUrlSnapshot: String!, $assignedMembershipId: UUID, $distributionRuleId: UUID, $expectedCursorVersion: Int, $hasAutoAssignment: Boolean!, $hasDistributionAttempt: Boolean!) @auth(level: NO_ACCESS) @transaction {
 before: query @redact {
  form: leadCaptureForm(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $formId}, publicId: {eq: $publicId}, status: {eq: ACTIVE}}}) @check(expr: "this != null && this.organizationId == vars.organizationId && vars.idempotencyKeyHash.matches('^[a-f0-9]{64}$') && vars.fullName.size() >= 2 && vars.fullName.size() <= 160 && ((has(vars.email) && vars.email != null) || (has(vars.phone) && vars.phone != null)) && (!has(vars.normalizedPhone) || vars.normalizedPhone == null || vars.normalizedPhone.matches('^[+][1-9][0-9]{6,14}$')) && vars.consentTextSnapshot == this.consentText && vars.privacyPolicyUrlSnapshot == this.privacyPolicyUrl", message: "FORM_UNAVAILABLE_OR_INVALID_SUBMISSION") {id organizationId sourceId branchId projectId fields consentText privacyPolicyUrl createdByUid}
  pipeline: pipeline(first: {where: {organizationId: {eq: $organizationId}, isDefault: {eq: true}, isActive: {eq: true}}}) @check(expr: "this != null", message: "ACTIVE_PIPELINE_UNAVAILABLE") {id}
  priorSubmission: leadCaptureSubmission(first: {where: {organizationId: {eq: $organizationId}, formId: {eq: $formId}, idempotencyKeyHash: {eq: $idempotencyKeyHash}}}) @check(expr: "this == null", message: "SUBMISSION_ALREADY_RECORDED") {id}
 }
 sourceAndStage: query @redact {
  source: leadSource(first: {where: {organizationId: {eq: $organizationId}, id: {eq_expr: "response.before.form.sourceId"}, sourceType: {eq: WEBSITE}}}) @check(expr: "this != null", message: "FORM_SOURCE_UNAVAILABLE") {id}
  stage: pipelineStage(first: {where: {organizationId: {eq: $organizationId}, pipelineId: {eq_expr: "response.before.pipeline.id"}, status: {eq: NEW}, stageType: {eq: OPEN}}}) @check(expr: "this != null", message: "NEW_LEAD_STAGE_UNAVAILABLE") {id}
 }
 contactValidation: query @redact @check(expr: "!vars.hasExistingContact || (this.contact != null && ((has(vars.normalizedEmail) && vars.normalizedEmail != null && this.contact.normalizedEmail == vars.normalizedEmail) || (has(vars.normalizedPhone) && vars.normalizedPhone != null && this.contact.normalizedPhone == vars.normalizedPhone)))", message: "CONTACT_MATCH_CHANGED") {
  contact: contact(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $contactId}}}) {id normalizedEmail normalizedPhone}
 }
 distributionValidation: query @redact @check(expr: "!vars.hasDistributionAttempt || (this.rule != null && (this.rule.branchId == null || (has(response.before.form.branchId) && this.rule.branchId == response.before.form.branchId)) && (this.rule.projectId == null || (has(response.before.form.projectId) && this.rule.projectId == response.before.form.projectId)) && (!vars.hasAutoAssignment || (vars.assignedMembershipId != null && this.cursor != null && this.cursor.version == vars.expectedCursorVersion && this.eligibleAgent != null && (!this.rule.skipUnavailable || this.availability == null || this.availability.status != 'UNAVAILABLE' || (has(this.availability.unavailableUntil) && timestamp(this.availability.unavailableUntil) <= request.time)))))", message: "DISTRIBUTION_RULE_CHANGED") {
  rule: leadDistributionRule(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $distributionRuleId}, enabled: {eq: true}, mode: {eq: ROUND_ROBIN}}}) {id branchId projectId skipUnavailable}
  cursor: distributionCursor(first: {where: {organizationId: {eq: $organizationId}, ruleId: {eq: $distributionRuleId}}}) {version}
  eligibleAgent: membership(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $assignedMembershipId}, role: {eq: AGENT}, status: {eq: ACTIVE}, distributionEligible: {eq: true}, userProfileUid: {isNull: false}}}) {id}
  availability: agentAvailability(first: {where: {organizationId: {eq: $organizationId}, membershipId: {eq: $assignedMembershipId}}}) {status unavailableUntil}
 }
 advanceCursor: distributionCursor_update(first: {where: {organizationId: {eq: $organizationId}, ruleId: {eq: $distributionRuleId}, version: {eq: $expectedCursorVersion}}}, data: {version_update: {inc: 1}, lastMembershipId: $assignedMembershipId, lastAssignedAt_expr: "request.time", updatedAt_expr: "request.time"}) @include(if: $hasAutoAssignment) @check(expr: "this != null", message: "DISTRIBUTION_CURSOR_CHANGED")
 contact: contact_insert(data: {organizationId: $organizationId, fullName: $fullName, email: $email, normalizedEmail: $normalizedEmail, phone: $phone, normalizedPhone: $normalizedPhone, createdByUid_expr: "response.before.form.createdByUid"}) @skip(if: $hasExistingContact)
 lead: lead_insert(data: {organizationId: $organizationId, contactId_expr: "vars.hasExistingContact ? response.contactValidation.contact.id : response.contact.id", fullName: $fullName, email: $email, phone: $phone, source: "Website", sourceId_expr: "response.before.form.sourceId", pipelineId_expr: "response.before.pipeline.id", pipelineStageId_expr: "response.sourceAndStage.stage.id", assignedMembershipId: $assignedMembershipId, branchId_expr: "response.before.form.branchId", projectId_expr: "response.before.form.projectId", createdByUid_expr: "response.before.form.createdByUid", updatedByUid_expr: "response.before.form.createdByUid", status: NEW, propertyInterest: $propertyInterest, preferredLocation: $preferredLocation, propertyType: $propertyType, transactionType: $transactionType, budgetMin: $budgetMin, budgetMax: $budgetMax, currency: $currency, bedroomPreference: $bedroomPreference, priority: NORMAL})
 assignment: leadAssignmentHistory_insert(data: {organizationId: $organizationId, leadId_expr: "response.lead.id", previousAgentId: null, newAgentId_expr: "has(vars.assignedMembershipId) ? vars.assignedMembershipId : dyn(null)", distributionRuleId_expr: "vars.hasAutoAssignment ? vars.distributionRuleId : dyn(null)", assignedByUid_expr: "response.before.form.createdByUid", assignmentType_expr: "vars.hasAutoAssignment ? 'ROUND_ROBIN' : 'INITIAL'", reason: "Website form submission"})
 activity: activity_insert(data: {organizationId: $organizationId, actorUid_expr: "response.before.form.createdByUid", kind: WEBSITE_LEAD_CAPTURED, leadId_expr: "response.lead.id", targetId_expr: "response.lead.id", note: $message, newStageId_expr: "response.sourceAndStage.stage.id", pipelineId_expr: "response.before.pipeline.id"})
 audit: auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "response.before.form.createdByUid", action: WEBSITE_LEAD_CAPTURED, targetType: WEBSITE_SUBMISSION, targetId_expr: "response.lead.id"})
 assignedNotification: inAppNotification_insert(data: {organizationId: $organizationId, audience: MEMBER, recipientMembershipId: $assignedMembershipId, leadId_expr: "response.lead.id", type: LEAD_ASSIGNED, title: "New website lead assigned", body: $fullName, actorUid_expr: "response.before.form.createdByUid"}) @include(if: $hasAutoAssignment)
 unassignedNotification: inAppNotification_insert(data: {organizationId: $organizationId, audience: ADMIN, leadId_expr: "response.lead.id", type: LEAD_UNASSIGNED, title: "New website lead in the unassigned queue", body: $fullName, actorUid_expr: "response.before.form.createdByUid"}) @skip(if: $hasAutoAssignment)
 submission: leadCaptureSubmission_insert(data: {organizationId: $organizationId, formId: $formId, leadId_expr: "response.lead.id", sourceId_expr: "response.before.form.sourceId", idempotencyKeyHash: $idempotencyKeyHash, landingPageUrl: $landingPageUrl, utmSource: $utmSource, utmMedium: $utmMedium, utmCampaign: $utmCampaign, utmContent: $utmContent, utmTerm: $utmTerm, consentGiven: true, consentTextSnapshot: $consentTextSnapshot, privacyPolicyUrlSnapshot: $privacyPolicyUrlSnapshot})
}





