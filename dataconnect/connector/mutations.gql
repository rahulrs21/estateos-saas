  { organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER] } } } } }
 ] }] } }, data: { updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time", followUpAt: $followUpAt, followUpNote_expr: "has(vars.followUpNote) ? vars.followUpNote : null" }) @check(expr: "this != null", message: "LEAD_NOT_FOUND_OR_FORBIDDEN")
 activity: activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: FOLLOW_UP_SCHEDULED, leadId: $leadId, targetId: $leadId, note: $followUpNote, metadata_expr: "{'followUpAt': string(vars.followUpAt)}" })
}

