mutation ConsumeWebsiteLeadCaptureRateWindow($organizationId: UUID!, $formId: UUID!, $windowStart: Timestamp!, $requestLimit: Int!, $windowExists: Boolean!, $observedCount: Int!) @auth(level: NO_ACCESS) @transaction {
