 activity: activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: LEAD_ASSIGNED, leadId: $leadId, targetId: $leadId, metadata_expr: "{'assignedMembershipId': has(vars.assignedMembershipId) ? vars.assignedMembershipId : null}" })
