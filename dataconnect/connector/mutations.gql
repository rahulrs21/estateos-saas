 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: MEMBERSHIP_ROLE_CHANGED, targetId: $membershipId, metadata_expr: "{'role': vars.role}", targetType: MEMBERSHIP })
