mutation InviteMembership($organizationId: UUID!, $email: String!, $role: MembershipRole!, $tokenHash: String!, $expiresAt: Timestamp!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.email == vars.email.lowerAscii() && vars.email != auth.token.email.lowerAscii() && vars.email.size() >= 3 && vars.email.size() <= 254 && vars.role in ['ADMIN', 'MANAGER', 'AGENT'] && vars.tokenHash.matches('^[a-f0-9]{64}$') && timestamp(vars.expiresAt) > request.time && timestamp(vars.expiresAt) <= request.time + duration('604800s')") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 query @redact {
  existing: membership(first: { where: { organizationId: { eq: $organizationId }, email: { eq: $email } } }) @check(expr: "this == null", message: "MEMBERSHIP_ALREADY_EXISTS") { id }
  actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } })
   @check(expr: "this != null && (this.role == 'OWNER' || vars.role in ['MANAGER', 'AGENT'])", message: "ROLE_GRANT_FORBIDDEN") { id role }
 }
 membership: membership_insert(data: { organizationId: $organizationId, email: $email, role: $role, status: INVITED, invitedByUid_expr: "auth.uid", invitationExpiresAt: $expiresAt })
 invitation: invitation_insert(data: { organizationId: $organizationId, membershipId_expr: "response.membership.id", email: $email, role: $role, tokenHash: $tokenHash, expiresAt: $expiresAt, invitedByUid_expr: "auth.uid" })
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: MEMBERSHIP_INVITED, targetId_expr: "response.membership.id", metadata_expr: "{'role': vars.role, 'status': 'INVITED'}" })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: MEMBERSHIP_INVITED, targetId_expr: "response.membership.id", metadata_expr: "{'role': vars.role, 'status': 'INVITED'}", targetType: MEMBERSHIP })
}

# Acceptance also initializes a new recipient's SQL profile. Firebase signup
# does not create one, and invited users must not need company onboarding.
mutation AcceptInvitation($organizationId: UUID!, $membershipId: UUID!, $tokenHash: String!, $displayName: String! = "EstateOS member")
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.tokenHash.matches('^[a-f0-9]{64}$') && vars.displayName.size() >= 1 && vars.displayName.size() <= 120") @transaction {
 query @redact {
  userProfile(key: { uid_expr: "auth.uid" }) { displayName }
  offered: invitation(first: { where: {
   organizationId: { eq: $organizationId }, membershipId: { eq: $membershipId }, tokenHash: { eq: $tokenHash },
   status: { eq: PENDING }, expiresAt: { gt_expr: "request.time" }, email: { eq_expr: "auth.token.email.lowerAscii()" },
   role: { in: [ADMIN, MANAGER, AGENT] },
   membership: { status: { eq: INVITED }, userProfileUid: { isNull: true }, email: { eq_expr: "auth.token.email.lowerAscii()" } }
  } }) @check(expr: "this != null && this.role == this.membership.role && this.invitedBy.memberships_on_userProfile.size() > 0 && (this.role != 'ADMIN' || this.invitedBy.memberships_on_userProfile.exists(m, m.role == 'OWNER'))", message: "INVITATION_INVALID_OR_EXPIRED") {
   id role invitedByUid membership { role }
   invitedBy { memberships_on_userProfile(where: { organizationId: { eq: $organizationId }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } }) { role } }
  }
 }
 issuerAuthorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "response.query.offered.invitedByUid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "INVITATION_INVALID_OR_EXPIRED")
 # Write the profile once, before recipient foreign keys. All writes roll back
 # on invalid consumption or duplicate membership; preserve an existing name.
 profile: userProfile_upsert(data: { uid_expr: "auth.uid", email_expr: "auth.token.email.lowerAscii()", displayName_expr: "response.query.userProfile != null ? response.query.userProfile.displayName : vars.displayName", activeOrganizationId: $organizationId, updatedAt_expr: "request.time" }) @redact
 invitation: invitation_update(first: { where: {
  organizationId: { eq: $organizationId }, membershipId: { eq: $membershipId },
  tokenHash: { eq: $tokenHash }, status: { eq: PENDING }, expiresAt: { gt_expr: "request.time" },
  email: { eq_expr: "auth.token.email.lowerAscii()" }, role: { in: [ADMIN, MANAGER, AGENT] },
  membership: { status: { eq: INVITED }, userProfileUid: { isNull: true }, email: { eq_expr: "auth.token.email.lowerAscii()" } }
 } }, data: { status: ACCEPTED, acceptedAt_expr: "request.time", acceptedByUid_expr: "auth.uid", updatedAt_expr: "request.time" })
 @redact @check(expr: "this != null", message: "INVITATION_INVALID_OR_EXPIRED")
 membership: membership_update(first: { where: {
  organizationId: { eq: $organizationId }, id: { eq: $membershipId },
  status: { eq: INVITED }, userProfileUid: { isNull: true }, email: { eq_expr: "auth.token.email.lowerAscii()" },
  role: { in: [ADMIN, MANAGER, AGENT] }
 } }, data: { userProfileUid_expr: "auth.uid", status: ACTIVE, invitationTokenHash: null, acceptedAt_expr: "request.time", approvedAt_expr: "request.time", approvedByUid_expr: "response.query.offered.invitedByUid", updatedAt_expr: "request.time" })
 @check(expr: "this != null", message: "INVITATION_INVALID_OR_EXPIRED")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: INVITATION_ACCEPTED, targetId: $membershipId, metadata: { status: "ACTIVE" } })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: INVITATION_ACCEPTED, targetId: $membershipId, metadata: { status: "ACTIVE" }, targetType: MEMBERSHIP })
}

mutation ApproveMembership($organizationId: UUID!, $membershipId: UUID!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 query @redact @check(expr: "this.actor != null && this.target != null && this.target.status == 'PENDING' && this.target.userProfileUid != null && this.target.userProfileUid != auth.uid && this.target.role != 'OWNER' && (this.actor.role == 'OWNER' || this.target.role in ['MANAGER', 'AGENT'])", message: "MEMBERSHIP_APPROVAL_FORBIDDEN") {
 actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") { id role }
  target: membership(key: { organizationId: $organizationId, id: $membershipId })
   { id userProfileUid role status }
 }
 membership: membership_update(first: { where: { organizationId: { eq: $organizationId }, id: { eq: $membershipId }, status: { eq: PENDING }, userProfileUid: { ne_expr: "auth.uid" }, role: { ne: OWNER } } },
  data: { status: ACTIVE, approvedAt_expr: "request.time", approvedByUid_expr: "auth.uid", updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "MEMBERSHIP_APPROVAL_FORBIDDEN")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: MEMBERSHIP_APPROVED, targetId: $membershipId, metadata: { status: "ACTIVE" } })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: MEMBERSHIP_APPROVED, targetId: $membershipId, metadata: { status: "ACTIVE" }, targetType: MEMBERSHIP })
}

mutation SetMembershipStatus($organizationId: UUID!, $membershipId: UUID!, $status: MembershipStatus!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.status in ['SUSPENDED', 'REVOKED', 'REMOVED']") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 query @redact @check(expr: "this.actor != null && this.target != null && this.target.userProfileUid != auth.uid && this.target.role != 'OWNER' && !(this.target.status in ['REVOKED', 'REMOVED']) && (this.actor.role == 'OWNER' || this.target.role in ['MANAGER', 'AGENT'])", message: "MEMBERSHIP_CHANGE_FORBIDDEN") {
 actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") { id role }
  target: membership(key: { organizationId: $organizationId, id: $membershipId })
   { id userProfileUid role status }
 }
 membership: membership_update(first: { where: { _and: [
 { organizationId: { eq: $organizationId }, id: { eq: $membershipId }, status: { nin: [REVOKED, REMOVED] } },
 { _or: [{ userProfileUid: { ne_expr: "auth.uid" } }, { userProfileUid: { isNull: true } }] },
 { _or: [
  { role: { in: [MANAGER, AGENT] } },
  { role: { eq: ADMIN }, organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { eq: OWNER } } } } }
 ] }
 ] } },
  data: { status: $status, invitationTokenHash: null, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "MEMBERSHIP_CHANGE_FORBIDDEN")
 invitation_updateMany(where: { organizationId: { eq: $organizationId }, membershipId: { eq: $membershipId }, status: { eq: PENDING } }, data: { status: REVOKED, revokedAt_expr: "request.time", updatedAt_expr: "request.time" }) @redact
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind_expr: "vars.status == 'SUSPENDED' ? 'MEMBERSHIP_SUSPENDED' : vars.status == 'REMOVED' ? 'MEMBERSHIP_REMOVED' : 'MEMBERSHIP_REVOKED'", targetId: $membershipId, metadata_expr: "{'status': vars.status}" })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action_expr: "vars.status == 'SUSPENDED' ? 'MEMBERSHIP_SUSPENDED' : vars.status == 'REMOVED' ? 'MEMBERSHIP_REMOVED' : 'MEMBERSHIP_REVOKED'", targetId: $membershipId, metadata_expr: "{'status': vars.status}", targetType: MEMBERSHIP })
}

# Pending invitation changes preserve target hierarchy and append audit events.
mutation RevokeInvitation($organizationId: UUID!, $membershipId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ADMINISTRATOR_REQUIRED")
 invitation: invitation_update(first: { where: { organizationId: { eq: $organizationId }, membershipId: { eq: $membershipId }, status: { eq: PENDING }, membership: { _and: [{ organizationId: { eq: $organizationId }, id: { eq: $membershipId }, status: { eq: INVITED }, userProfileUid: { isNull: true } }, { _or: [{ role: { in: [MANAGER, AGENT] } }, { role: { eq: ADMIN }, organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { eq: OWNER } } } } }] }] } } }, data: { status: REVOKED, revokedAt_expr: "request.time", updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "INVITATION_CHANGE_FORBIDDEN")
 membership_update(first: { where: { _and: [{ organizationId: { eq: $organizationId }, id: { eq: $membershipId }, status: { eq: INVITED }, userProfileUid: { isNull: true } }, { _or: [{ role: { in: [MANAGER, AGENT] } }, { role: { eq: ADMIN }, organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { eq: OWNER } } } } }] }] } }, data: { status: REMOVED, invitationTokenHash: null, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "INVITATION_CHANGE_FORBIDDEN")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: INVITATION_REVOKED, targetId: $membershipId })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: INVITATION_REVOKED, targetId_expr: "response.invitation.id", targetType: INVITATION })
}

mutation ReissueInvitation($organizationId: UUID!, $membershipId: UUID!, $tokenHash: String!, $expiresAt: Timestamp!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.tokenHash.matches('^[a-f0-9]{64}$') && timestamp(vars.expiresAt) > request.time && timestamp(vars.expiresAt) <= request.time + duration('604800s')") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ADMINISTRATOR_REQUIRED")
 invitation: invitation_update(first: { where: { organizationId: { eq: $organizationId }, membershipId: { eq: $membershipId }, status: { eq: PENDING }, updatedAt: { lt_expr: "request.time - duration('60s')" }, membership: { _and: [{ organizationId: { eq: $organizationId }, id: { eq: $membershipId }, status: { eq: INVITED }, userProfileUid: { isNull: true } }, { _or: [{ role: { in: [MANAGER, AGENT] } }, { role: { eq: ADMIN }, organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { eq: OWNER } } } } }] }] } } }, data: { tokenHash: $tokenHash, expiresAt: $expiresAt, invitedByUid_expr: "auth.uid", deliveryStatus: NOT_SENT, deliveryUpdatedAt: null, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "INVITATION_CHANGE_FORBIDDEN_OR_TOO_SOON")
 membership_update(first: { where: { _and: [{ organizationId: { eq: $organizationId }, id: { eq: $membershipId }, status: { eq: INVITED }, userProfileUid: { isNull: true } }, { _or: [{ role: { in: [MANAGER, AGENT] } }, { role: { eq: ADMIN }, organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { eq: OWNER } } } } }] }] } }, data: { invitedByUid_expr: "auth.uid", invitationExpiresAt: $expiresAt, invitationTokenHash: null, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "INVITATION_CHANGE_FORBIDDEN")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: INVITATION_REISSUED, targetId: $membershipId })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: INVITATION_REISSUED, targetId_expr: "response.invitation.id", targetType: INVITATION })
}

# Re-invite a revoked, never-accepted reservation; this cannot reactivate a
# previously registered member. Keep the original rows and revocation audit.
mutation ReinviteRevokedInvitation($organizationId: UUID!, $membershipId: UUID!, $tokenHash: String!, $expiresAt: Timestamp!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.tokenHash.matches('^[a-f0-9]{64}$') && timestamp(vars.expiresAt) > request.time && timestamp(vars.expiresAt) <= request.time + duration('604800s')") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ADMINISTRATOR_REQUIRED")
 query @redact @check(expr: "this.actor != null && this.offered != null && this.offered.role == this.offered.membership.role && (this.actor.role == 'OWNER' || this.offered.role in ['MANAGER', 'AGENT'])", message: "INVITATION_CHANGE_FORBIDDEN") {
  actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }) { role }
  offered: invitation(first: { where: {
   organizationId: { eq: $organizationId }, membershipId: { eq: $membershipId }, status: { eq: REVOKED },
   acceptedAt: { isNull: true }, acceptedByUid: { isNull: true }, role: { in: [ADMIN, MANAGER, AGENT] },
   membership: { status: { eq: REMOVED }, userProfileUid: { isNull: true }, acceptedAt: { isNull: true }, approvedAt: { isNull: true } }
  } }) { role membership { role } }
 }
 invitation: invitation_update(first: { where: {
  organizationId: { eq: $organizationId }, membershipId: { eq: $membershipId }, status: { eq: REVOKED },
  acceptedAt: { isNull: true }, acceptedByUid: { isNull: true }, role: { in: [ADMIN, MANAGER, AGENT] },
  tokenHash: { ne: $tokenHash }, updatedAt: { lt_expr: "request.time - duration('60s')" },
  membership: { status: { eq: REMOVED }, userProfileUid: { isNull: true }, acceptedAt: { isNull: true }, approvedAt: { isNull: true } }
 } }, data: { status: PENDING, tokenHash: $tokenHash, expiresAt: $expiresAt, invitedByUid_expr: "auth.uid", revokedAt: null, deliveryStatus: NOT_SENT, deliveryUpdatedAt: null, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "INVITATION_CHANGE_FORBIDDEN_OR_TOO_SOON")
 membership: membership_update(first: { where: {
  organizationId: { eq: $organizationId }, id: { eq: $membershipId }, status: { eq: REMOVED }, userProfileUid: { isNull: true },
  acceptedAt: { isNull: true }, approvedAt: { isNull: true }, role: { eq_expr: "response.query.offered.role" }
 } }, data: { status: INVITED, invitedByUid_expr: "auth.uid", invitationExpiresAt: $expiresAt, invitationTokenHash: null, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "INVITATION_CHANGE_FORBIDDEN")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: INVITATION_REISSUED, targetId: $membershipId, metadata: { previousStatus: "REVOKED", status: "PENDING" } })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: INVITATION_REISSUED, targetId_expr: "response.invitation.id", targetType: INVITATION, metadata: { previousStatus: "REVOKED", status: "PENDING" } })
}

# Only trusted server delivery code may write provider receipts. Browser identity
# impersonation is deliberately rejected. The transaction still checks the actor.
mutation RecordInvitationDelivery($organizationId: UUID!, $membershipId: UUID!, $actorUid: String!, $tokenHash: String!, $outcome: InvitationDeliveryStatus!) @auth(level: NO_ACCESS) @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq: $actorUid }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null && vars.outcome in ['PREVIEW', 'ACCEPTED', 'FAILED']", message: "DELIVERY_RECEIPT_FORBIDDEN")
 invitation: invitation_update(first: { where: { organizationId: { eq: $organizationId }, membershipId: { eq: $membershipId }, invitedByUid: { eq: $actorUid }, tokenHash: { eq: $tokenHash } } }, data: { deliveryStatus: $outcome, deliveryUpdatedAt_expr: "request.time" }) @check(expr: "this != null", message: "DELIVERY_RECEIPT_FORBIDDEN")
 auditLog_insert(data: { organizationId: $organizationId, actorUid: $actorUid, action_expr: "vars.outcome == 'ACCEPTED' ? 'INVITATION_DELIVERY_ACCEPTED' : vars.outcome == 'PREVIEW' ? 'INVITATION_DELIVERY_PREVIEW' : 'INVITATION_DELIVERY_FAILED'", targetId_expr: "response.invitation.id", targetType: INVITATION })
}

# No operation grants OWNER, changes an OWNER, or changes the actor themselves.
# This stricter first-phase rule preserves the last active owner without races.
mutation SetMembershipRole($organizationId: UUID!, $membershipId: UUID!, $role: MembershipRole!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.role in ['ADMIN', 'MANAGER', 'AGENT']") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ADMINISTRATOR_REQUIRED")
 query @redact {
  actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } })
   @check(expr: "this != null && (this.role == 'OWNER' || vars.role in ['MANAGER', 'AGENT'])", message: "ROLE_GRANT_FORBIDDEN") { id role }
 }
 membership: membership_update(first: { where: { _and: [
  { organizationId: { eq: $organizationId }, id: { eq: $membershipId }, userProfileUid: { ne_expr: "auth.uid", isNull: false }, status: { eq: ACTIVE } },
  { _or: [
   { role: { in: [MANAGER, AGENT] } },
   { role: { eq: ADMIN }, organization: { memberships_on_organization: { exist: { userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { eq: OWNER } } } } }
  ] }
 ] } }, data: { role: $role, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "MEMBERSHIP_ROLE_CHANGE_FORBIDDEN")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: MEMBERSHIP_ROLE_CHANGED, targetId: $membershipId, metadata_expr: "{'role': vars.role}" })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: MEMBERSHIP_ROLE_CHANGED, targetId: $membershipId, metadata_expr: "{'role': vars.role}", targetType: MEMBERSHIP })
}





