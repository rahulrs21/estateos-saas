# UID, owner privilege, actor and timestamps are derived inside the connector.
# Every multi-table business change and its audit event commit atomically.
mutation UpsertMyProfile($displayName: String!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.displayName.size() >= 1 && vars.displayName.size() <= 120") {
 userProfile_upsert(data: { uid_expr: "auth.uid", email_expr: "auth.token.email.lowerAscii()", displayName: $displayName, updatedAt_expr: "request.time" })
}

mutation CreateOrganization($name: String!, $slug: String!, $emirate: Emirate, $contactPhone: String, $companyEmail: String, $companySize: CompanySize)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.name.size() >= 2 && vars.name.size() <= 120 && vars.slug.matches('^[a-z0-9]+(-[a-z0-9]+)*$') && vars.slug.size() >= 3 && vars.slug.size() <= 63 && (!has(vars.contactPhone) || vars.contactPhone == null || (vars.contactPhone.size() <= 32 && vars.contactPhone.matches('^[+]?[0-9][0-9 ()-]{6,30}$'))) && (!has(vars.companyEmail) || vars.companyEmail == null || (vars.companyEmail.size() <= 254 && vars.companyEmail.matches('^[^ @]+@[^ @]+[.][^ @]+$')))")
 @transaction {
 query @redact {
  userProfile(key: { uid_expr: "auth.uid" }) @check(expr: "this != null", message: "PROFILE_REQUIRED") { uid }
  slugOwner: organization(first: { where: { slug: { eq: $slug } } }) @check(expr: "this == null", message: "ORGANIZATION_SLUG_TAKEN") { id }
 }
 organization: organization_insert(data: { name: $name, slug: $slug, emirate: $emirate, contactPhone: $contactPhone, companyEmail: $companyEmail, companySize: $companySize, createdByUid_expr: "auth.uid" })
 ownerMembership: membership_insert(data: { organizationId_expr: "response.organization.id", userProfileUid_expr: "auth.uid", email_expr: "auth.token.email.lowerAscii()", role: OWNER, status: ACTIVE, approvedAt_expr: "request.time", approvedByUid_expr: "auth.uid" })
 userProfile_update(key: { uid_expr: "auth.uid" }, data: { activeOrganizationId_expr: "response.organization.id", updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "PROFILE_REQUIRED")
 activity_insert(data: { organizationId_expr: "response.organization.id", actorUid_expr: "auth.uid", kind: ORGANIZATION_CREATED, targetId_expr: "response.organization.id" })
 auditLog_insert(data: { organizationId_expr: "response.organization.id", actorUid_expr: "auth.uid", action: ORGANIZATION_CREATED, targetId_expr: "response.organization.id", targetType: ORGANIZATION })
}

mutation UpdateOrganization($organizationId: UUID!, $name: String!, $slug: String!, $emirate: Emirate!, $contactPhone: String!, $companyEmail: String!, $companySize: CompanySize!)
 @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.name.size() >= 2 && vars.name.size() <= 120 && vars.slug.matches('^[a-z0-9]+(-[a-z0-9]+)*$') && vars.slug.size() >= 3 && vars.slug.size() <= 63 && vars.contactPhone.size() <= 32 && vars.contactPhone.matches('^[+]?[0-9][0-9 ()-]{6,30}$') && vars.companyEmail.size() <= 254 && vars.companyEmail.matches('^[^ @]+@[^ @]+[.][^ @]+$')") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ADMINISTRATOR_REQUIRED")
 query @redact {
  slugOwner: organization(first: { where: { slug: { eq: $slug }, id: { ne: $organizationId } } }) @check(expr: "this == null", message: "ORGANIZATION_SLUG_TAKEN") { id }
 }
 organization: organization_update(id: $organizationId, data: { name: $name, slug: $slug, emirate: $emirate, contactPhone: $contactPhone, companyEmail: $companyEmail, companySize: $companySize, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "ORGANIZATION_NOT_FOUND")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: ORGANIZATION_UPDATED, targetId: $organizationId })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: ORGANIZATION_UPDATED, targetId: $organizationId, targetType: ORGANIZATION })
}

mutation SwitchOrganization($organizationId: UUID!) @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") @transaction {
 authorization: membership_update(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE }, role: { in: [OWNER, ADMIN, MANAGER, AGENT] } } }, data: { status: ACTIVE }) @redact @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED")
 query @redact {
 actor: membership(first: { where: { organizationId: { eq: $organizationId }, userProfileUid: { eq_expr: "auth.uid" }, status: { eq: ACTIVE } } }) @check(expr: "this != null", message: "ACTIVE_MEMBERSHIP_REQUIRED") { id role }
}
 userProfile_update(key: { uid_expr: "auth.uid" }, data: { activeOrganizationId: $organizationId, updatedAt_expr: "request.time" }) @check(expr: "this != null", message: "PROFILE_REQUIRED")
 activity_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", kind: ORGANIZATION_SWITCHED, targetId: $organizationId })
 auditLog_insert(data: { organizationId: $organizationId, actorUid_expr: "auth.uid", action: ORGANIZATION_SWITCHED, targetId: $organizationId, targetType: ORGANIZATION })
}

mutation CreateBranch($organizationId: UUID!, $name: String!)
