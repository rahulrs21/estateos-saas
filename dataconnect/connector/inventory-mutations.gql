  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ADMIN_REQUIRED")
  query @redact @check(expr: "this.plan != null && this.plan.isActive == false && this.plan.installmentTotalBps == vars.expectedTotalBps && vars.newTotalBps <= 10000 - this.plan.bookingPercentageBps - this.plan.handoverPercentageBps", message: "PAYMENT_PLAN_TOTAL_EXCEEDED") {plan: paymentPlan(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $paymentPlanId}, archivedAt: {isNull: true}}}) {id isActive bookingPercentageBps handoverPercentageBps installmentTotalBps}}
  paymentPlan_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $paymentPlanId}, isActive: {eq: false}, installmentTotalBps: {eq: $expectedTotalBps}}}, data: {installmentTotalBps: $newTotalBps, updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "PAYMENT_PLAN_CHANGED")
  paymentPlanInstallment_insert(data: {organizationId: $organizationId, paymentPlanId: $paymentPlanId, position: $position, percentageBps: $percentageBps, dueTrigger: $dueTrigger, constructionMilestonePercent: $constructionMilestonePercent, postHandoverMonths: $postHandoverMonths, description: $description})
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: PAYMENT_PLAN_UPDATED, targetId: $paymentPlanId, metadata_expr: "{'event': 'installment_added', 'position': vars.position}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: PAYMENT_PLAN_UPDATED, targetType: PAYMENT_PLAN, targetId: $paymentPlanId, metadata_expr: "{'event': 'installment_added', 'position': vars.position}"})
}

mutation UpdatePaymentPlanInstallment($organizationId: UUID!, $paymentPlanId: UUID!, $id: UUID!, $expectedTotalBps: Int!, $newTotalBps: Int!, $position: Int!, $percentageBps: Int!, $dueTrigger: PaymentDueTrigger!, $constructionMilestonePercent: Int, $postHandoverMonths: Int, $description: String)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.position >= 0 && vars.position <= 23 && vars.percentageBps > 0 && vars.percentageBps <= 10000 && ((vars.dueTrigger == 'CONSTRUCTION_MILESTONE' && has(vars.constructionMilestonePercent) && vars.constructionMilestonePercent != null && vars.constructionMilestonePercent >= 1 && vars.constructionMilestonePercent <= 100 && (!has(vars.postHandoverMonths) || vars.postHandoverMonths == null)) || (vars.dueTrigger == 'HANDOVER' && (!has(vars.constructionMilestonePercent) || vars.constructionMilestonePercent == null) && (!has(vars.postHandoverMonths) || vars.postHandoverMonths == null)) || (vars.dueTrigger == 'POST_HANDOVER' && has(vars.postHandoverMonths) && vars.postHandoverMonths != null && vars.postHandoverMonths >= 1 && (!has(vars.constructionMilestonePercent) || vars.constructionMilestonePercent == null)))") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ADMIN_REQUIRED")
  query @redact @check(expr: "this.plan != null && this.existing != null && this.plan.isActive == false && this.plan.installmentTotalBps == vars.expectedTotalBps && vars.newTotalBps == vars.expectedTotalBps - this.existing.percentageBps + vars.percentageBps && vars.newTotalBps <= 10000 - this.plan.bookingPercentageBps - this.plan.handoverPercentageBps", message: "PAYMENT_PLAN_CHANGED") {
    plan: paymentPlan(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $paymentPlanId}, archivedAt: {isNull: true}}}) {id isActive bookingPercentageBps handoverPercentageBps installmentTotalBps}
    existing: paymentPlanInstallment(first: {where: {organizationId: {eq: $organizationId}, paymentPlanId: {eq: $paymentPlanId}, id: {eq: $id}}}) {id percentageBps}
  }
  paymentPlan_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $paymentPlanId}, isActive: {eq: false}, installmentTotalBps: {eq: $expectedTotalBps}}}, data: {installmentTotalBps: $newTotalBps, updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "PAYMENT_PLAN_CHANGED")
  paymentPlanInstallment_update(first: {where: {organizationId: {eq: $organizationId}, paymentPlanId: {eq: $paymentPlanId}, id: {eq: $id}}}, data: {position: $position, percentageBps: $percentageBps, dueTrigger: $dueTrigger, constructionMilestonePercent: $constructionMilestonePercent, postHandoverMonths: $postHandoverMonths, description: $description, updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "PAYMENT_INSTALLMENT_NOT_FOUND")
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: PAYMENT_PLAN_UPDATED, targetId: $paymentPlanId, metadata_expr: "{'event': 'installment_updated', 'position': vars.position}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: PAYMENT_PLAN_UPDATED, targetType: PAYMENT_PLAN, targetId: $paymentPlanId, metadata_expr: "{'event': 'installment_updated', 'position': vars.position}"})
}

mutation RemovePaymentPlanInstallment($organizationId: UUID!, $paymentPlanId: UUID!, $id: UUID!, $expectedTotalBps: Int!, $newTotalBps: Int!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.newTotalBps >= 0") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ADMIN_REQUIRED")
  query @redact @check(expr: "this.plan != null && this.existing != null && this.plan.isActive == false && this.plan.installmentTotalBps == vars.expectedTotalBps && vars.newTotalBps == vars.expectedTotalBps - this.existing.percentageBps", message: "PAYMENT_PLAN_CHANGED") {
    plan: paymentPlan(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $paymentPlanId}, archivedAt: {isNull: true}}}) {id isActive installmentTotalBps}
    existing: paymentPlanInstallment(first: {where: {organizationId: {eq: $organizationId}, paymentPlanId: {eq: $paymentPlanId}, id: {eq: $id}}}) {id percentageBps}
  }
  paymentPlan_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $paymentPlanId}, isActive: {eq: false}, installmentTotalBps: {eq: $expectedTotalBps}}}, data: {installmentTotalBps: $newTotalBps, updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "PAYMENT_PLAN_CHANGED")
  paymentPlanInstallment_deleteMany(where: {organizationId: {eq: $organizationId}, paymentPlanId: {eq: $paymentPlanId}, id: {eq: $id}}) @check(expr: "this > 0", message: "PAYMENT_INSTALLMENT_NOT_FOUND")
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: PAYMENT_PLAN_UPDATED, targetId: $paymentPlanId, metadata_expr: "{'event': 'installment_removed'}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: PAYMENT_PLAN_UPDATED, targetType: PAYMENT_PLAN, targetId: $paymentPlanId, metadata_expr: "{'event': 'installment_removed'}"})
}

mutation SetPaymentPlanActive($organizationId: UUID!, $id: UUID!, $expectedInstallmentTotalBps: Int!, $isActive: Boolean!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password'") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ADMIN_REQUIRED")
  query @redact @check(expr: "this.plan != null && this.plan.installmentTotalBps == vars.expectedInstallmentTotalBps && (!vars.isActive || this.plan.bookingPercentageBps + this.plan.handoverPercentageBps + this.plan.installmentTotalBps == 10000)", message: "PAYMENT_PLAN_PERCENTAGES_MUST_TOTAL_100") {
    plan: paymentPlan(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, archivedAt: {isNull: true}}}) {id bookingPercentageBps handoverPercentageBps installmentTotalBps}
  }
  paymentPlan_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, archivedAt: {isNull: true}, installmentTotalBps: {eq: $expectedInstallmentTotalBps}}}, data: {isActive: $isActive, updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "PAYMENT_PLAN_CHANGED")
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: PAYMENT_PLAN_UPDATED, targetId: $id, metadata_expr: "{'isActive': vars.isActive}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: PAYMENT_PLAN_UPDATED, targetType: PAYMENT_PLAN, targetId: $id, metadata_expr: "{'isActive': vars.isActive}"})
}

