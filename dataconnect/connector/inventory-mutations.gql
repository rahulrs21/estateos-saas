mutation CreateProperty($organizationId: UUID!, $propertyReference: String!, $projectId: UUID, $buildingId: UUID, $unitNumber: String, $propertyType: PropertyType!, $marketType: MarketType!, $bedrooms: Int, $bathrooms: Float, $floorNumber: Int, $builtUpArea: Float, $plotArea: Float, $areaUnit: AreaUnit!, $furnishedStatus: FurnishedStatus, $parkingSpaces: Int, $view: String, $emirate: Emirate, $community: String, $area: String, $address: String, $latitude: Float, $longitude: Float, $city: String, $googlePlaceId: String, $mapDisplayMode: MapDisplayMode, $referencePriceMinor: Int64, $internalNotes: String, $ownershipReference: String, $mandateReference: String, $assignedMembershipId: UUID, $occupancyStatus: OccupancyStatus!, $inventoryStatus: InventoryStatus!)
