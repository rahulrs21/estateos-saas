mutation CreateInventoryMedia($organizationId: UUID!, $propertyId: UUID, $projectId: UUID, $floorPlanId: UUID, $storagePath: String!, $fileName: String!, $contentType: String!, $byteSize: Int64!, $mediaKind: InventoryMediaKind!, $sortOrder: Int!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.storagePath.size() <= 512 && vars.fileName.size() >= 1 && vars.fileName.size() <= 180 && vars.byteSize > 0 && vars.byteSize <= 20971520 && vars.sortOrder >= 0 && vars.contentType in ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'] && ((vars.contentType == 'application/pdf' && vars.mediaKind in ['DOCUMENT', 'BROCHURE', 'FLOOR_PLAN']) || (vars.contentType != 'application/pdf' && vars.mediaKind in ['PROPERTY_PHOTO', 'BROCHURE', 'FLOOR_PLAN'])) && ((has(vars.propertyId) && vars.propertyId != null && (!has(vars.projectId) || vars.projectId == null) && (!has(vars.floorPlanId) || vars.floorPlanId == null) && vars.mediaKind in ['PROPERTY_PHOTO', 'FLOOR_PLAN', 'BROCHURE', 'DOCUMENT']) || ((!has(vars.propertyId) || vars.propertyId == null) && has(vars.projectId) && vars.projectId != null && (!has(vars.floorPlanId) || vars.floorPlanId == null) && vars.mediaKind in ['BROCHURE', 'FLOOR_PLAN', 'DOCUMENT']) || ((!has(vars.propertyId) || vars.propertyId == null) && (!has(vars.projectId) || vars.projectId == null) && has(vars.floorPlanId) && vars.floorPlanId != null && vars.mediaKind in ['FLOOR_PLAN', 'DOCUMENT']))") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ADMIN_REQUIRED")
  query @redact {
    property: property(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $propertyId}, archivedAt: {isNull: true}}}) @check(expr: "!has(vars.propertyId) || vars.propertyId == null || this != null", message: "PROPERTY_NOT_FOUND") {id}
    project: project(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $projectId}, archivedAt: {isNull: true}}}) @check(expr: "!has(vars.projectId) || vars.projectId == null || this != null", message: "PROJECT_NOT_FOUND") {id}
    floorPlan: floorPlan(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $floorPlanId}, archivedAt: {isNull: true}}}) @check(expr: "!has(vars.floorPlanId) || vars.floorPlanId == null || this != null", message: "FLOOR_PLAN_NOT_FOUND") {id}
  }
  inventoryMedia: inventoryMedia_insert(data: {organizationId: $organizationId, propertyId: $propertyId, projectId: $projectId, floorPlanId: $floorPlanId, storagePath: $storagePath, fileName: $fileName, contentType: $contentType, byteSize: $byteSize, mediaKind: $mediaKind, sortOrder: $sortOrder, isCover: false, status: PENDING, uploadedByUid_expr: "auth.uid"})
}

