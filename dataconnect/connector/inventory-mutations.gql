# UAE bounding box from src/modules/maps/geo.ts.

mutation CreateProject($organizationId: UUID!, $developerId: UUID!, $projectName: String!, $projectCode: String!, $description: String, $projectType: ProjectType!, $ownershipType: OwnershipType, $community: String, $area: String, $emirate: Emirate, $country: String!, $address: String, $latitude: Float, $longitude: Float, $city: String, $googlePlaceId: String, $mapDisplayMode: MapDisplayMode, $launchDate: Date, $expectedHandoverDate: Date, $actualHandoverDate: Date, $constructionStatus: ConstructionStatus!, $projectStatus: ProjectStatus!, $startingPriceMinor: Int64, $currency: String!, $totalUnits: Int, $marketingDescription: String, $brochureReference: String, $permitNumber: String, $permitExpiryDate: Date, $permitReferenceUrl: String)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.projectName.size() >= 2 && vars.projectName.size() <= 180 && vars.projectCode.size() >= 1 && vars.projectCode.size() <= 80 && vars.currency.matches('^[A-Z]{3}$') && (!has(vars.startingPriceMinor) || vars.startingPriceMinor == null || vars.startingPriceMinor >= 0) && (!has(vars.totalUnits) || vars.totalUnits == null || vars.totalUnits >= 0) && (!has(vars.latitude) || vars.latitude == null) == (!has(vars.longitude) || vars.longitude == null) && (!has(vars.latitude) || vars.latitude == null || (vars.latitude >= -90.0 && vars.latitude <= 90.0)) && (!has(vars.longitude) || vars.longitude == null || (vars.longitude >= -180.0 && vars.longitude <= 180.0)) && (vars.country != 'AE' || ((!has(vars.latitude) || vars.latitude == null || (vars.latitude >= 22.4 && vars.latitude <= 26.5)) && (!has(vars.longitude) || vars.longitude == null || (vars.longitude >= 51.0 && vars.longitude <= 56.6)))) && (!has(vars.city) || vars.city == null || vars.city.size() <= 120) && (!has(vars.googlePlaceId) || vars.googlePlaceId == null || vars.googlePlaceId.size() <= 255)") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ADMIN_REQUIRED")
  query @redact {developer: developer(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $developerId}, archivedAt: {isNull: true}, status: {eq: ACTIVE}}}) @check(expr: "this != null", message: "DEVELOPER_NOT_FOUND") {id}}
  project: project_insert(data: {organizationId: $organizationId, developerId: $developerId, projectName: $projectName, projectCode: $projectCode, description: $description, projectType: $projectType, ownershipType: $ownershipType, community: $community, area: $area, emirate: $emirate, country: $country, address: $address, latitude: $latitude, longitude: $longitude, city: $city, googlePlaceId: $googlePlaceId, mapDisplayMode: $mapDisplayMode, launchDate: $launchDate, expectedHandoverDate: $expectedHandoverDate, actualHandoverDate: $actualHandoverDate, constructionStatus: $constructionStatus, projectStatus: $projectStatus, startingPriceMinor: $startingPriceMinor, currency: $currency, totalUnits: $totalUnits, marketingDescription: $marketingDescription, brochureReference: $brochureReference, permitNumber: $permitNumber, permitExpiryDate: $permitExpiryDate, permitReferenceUrl: $permitReferenceUrl, createdByUid_expr: "auth.uid", updatedByUid_expr: "auth.uid"})
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: PROJECT_CREATED, targetId_expr: "response.project.id", metadata_expr: "{'developerId': vars.developerId}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: PROJECT_CREATED, targetType: PROJECT, targetId_expr: "response.project.id", metadata_expr: "{'developerId': vars.developerId}"})
}

