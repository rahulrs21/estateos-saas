# Writes are authenticated with the verified Firebase identity and an active
# database membership. All multi-row business changes and their audit events
# commit atomically. Physical inventory is archived, never hard-deleted.
mutation CreateDeveloper($organizationId: UUID!, $name: String!, $slug: String!, $logoReference: String, $description: String, $website: String, $email: String, $phone: String, $country: String!, $headOfficeAddress: String, $headOfficeLatitude: Float, $headOfficeLongitude: Float, $headOfficeGooglePlaceId: String, $status: DeveloperStatus!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.name.size() >= 2 && vars.name.size() <= 160 && vars.slug.matches('^[a-z0-9]+(?:-[a-z0-9]+)*$') && vars.country.matches('^[A-Z]{2}$') && (!has(vars.headOfficeLatitude) || vars.headOfficeLatitude == null) == (!has(vars.headOfficeLongitude) || vars.headOfficeLongitude == null) && (!has(vars.headOfficeLatitude) || vars.headOfficeLatitude == null || (vars.headOfficeLatitude >= -90.0 && vars.headOfficeLatitude <= 90.0)) && (!has(vars.headOfficeLongitude) || vars.headOfficeLongitude == null || (vars.headOfficeLongitude >= -180.0 && vars.headOfficeLongitude <= 180.0)) && (vars.country != 'AE' || ((!has(vars.headOfficeLatitude) || vars.headOfficeLatitude == null || (vars.headOfficeLatitude >= 22.4 && vars.headOfficeLatitude <= 26.5)) && (!has(vars.headOfficeLongitude) || vars.headOfficeLongitude == null || (vars.headOfficeLongitude >= 51.0 && vars.headOfficeLongitude <= 56.6)))) && (!has(vars.headOfficeGooglePlaceId) || vars.headOfficeGooglePlaceId == null || vars.headOfficeGooglePlaceId.size() <= 255)") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ADMIN_REQUIRED")
  developer: developer_insert(data: {organizationId: $organizationId, name: $name, slug: $slug, logoReference: $logoReference, description: $description, website: $website, email: $email, phone: $phone, country: $country, headOfficeAddress: $headOfficeAddress, headOfficeLatitude: $headOfficeLatitude, headOfficeLongitude: $headOfficeLongitude, headOfficeGooglePlaceId: $headOfficeGooglePlaceId, status: $status, createdByUid_expr: "auth.uid", updatedByUid_expr: "auth.uid"})
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: DEVELOPER_CREATED, targetId_expr: "response.developer.id", metadata_expr: "{'slug': vars.slug}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: DEVELOPER_CREATED, targetType: DEVELOPER, targetId_expr: "response.developer.id", metadata_expr: "{'slug': vars.slug}"})
}

