  inventoryMedia_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, status: {eq: $expectedStatus}, archivedAt: {isNull: true}}}, data: {status: $status, updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "MEDIA_STATE_CHANGED")
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: PROPERTY_UPDATED, targetType: INVENTORY_MEDIA, targetId: $id})
