# One workflow step. Same transition matrix and role rules as UpdatePropertyListing:
# agents may only move their own listings between DRAFT and PENDING_REVIEW;
# approval, activation, pausing, closing and archiving are OWNER/ADMIN only.
# The from/to statuses are recorded in the activity and audit metadata.
mutation SetPropertyListingStatus($organizationId: UUID!, $id: UUID!, $expectedStatus: ListingStatus!, $status: ListingStatus!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.expectedStatus != vars.status") @transaction {
  query @redact @check(expr: "this.actor != null && this.existing != null && this.existing.listingStatus == vars.expectedStatus && (this.actor.role in ['OWNER', 'ADMIN'] || (this.actor.role == 'AGENT' && this.existing.assignedMembershipId == this.actor.id && vars.status in ['DRAFT', 'PENDING_REVIEW'])) && ((this.existing.listingStatus == 'DRAFT' && vars.status in ['PENDING_REVIEW', 'ARCHIVED']) || (this.existing.listingStatus == 'PENDING_REVIEW' && vars.status in ['DRAFT', 'APPROVED', 'PAUSED', 'ARCHIVED']) || (this.existing.listingStatus == 'APPROVED' && vars.status in ['ACTIVE', 'PAUSED', 'ARCHIVED']) || (this.existing.listingStatus == 'ACTIVE' && vars.status in ['PAUSED', 'CLOSED', 'ARCHIVED']) || (this.existing.listingStatus == 'PAUSED' && vars.status in ['ACTIVE', 'CLOSED', 'ARCHIVED']) || (this.existing.listingStatus == 'CLOSED' && vars.status == 'ARCHIVED') || (this.existing.listingStatus in ['UNDER_OFFER', 'SOLD', 'RENTED'] && vars.status in ['CLOSED', 'ARCHIVED']) || (this.existing.listingStatus in ['WITHDRAWN', 'EXPIRED'] && vars.status == 'ARCHIVED'))", message: "INVALID_LISTING_TRANSITION") {
    actor: membership(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN, AGENT]}}}) {id role}
    existing: propertyListing(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, archivedAt: {isNull: true}}}) {id assignedMembershipId listingStatus}
  }
  propertyListing_update(first: {where: {organizationId: {eq: $organizationId}, id: {eq: $id}, listingStatus: {eq: $expectedStatus}, archivedAt: {isNull: true}}}, data: {listingStatus: $status, updatedByUid_expr: "auth.uid", updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "LISTING_STATUS_CHANGED")
  activity_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", kind: PROPERTY_LISTING_UPDATED, targetId: $id, metadata_expr: "{'from': vars.expectedStatus, 'to': vars.status}"})
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: PROPERTY_LISTING_UPDATED, targetType: PROPERTY_LISTING, targetId: $id, metadata_expr: "{'from': vars.expectedStatus, 'to': vars.status}"})
}

