  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.name.size() >= 2 && vars.name.size() <= 160 && vars.slug.matches('^[a-z0-9]+(?:-[a-z0-9]+)*$') && vars.country.matches('^[A-Z]{2}$') && (!has(vars.headOfficeLatitude) || vars.headOfficeLatitude == null) == (!has(vars.headOfficeLongitude) || vars.headOfficeLongitude == null) && (!has(vars.headOfficeLatitude) || vars.headOfficeLatitude == null || (vars.headOfficeLatitude >= -90.0 && vars.headOfficeLatitude <= 90.0)) && (!has(vars.headOfficeLongitude) || vars.headOfficeLongitude == null || (vars.headOfficeLongitude >= -180.0 && vars.headOfficeLongitude <= 180.0)) && (vars.country != 'AE' || ((!has(vars.headOfficeLatitude) || vars.headOfficeLatitude == null || (vars.headOfficeLatitude >= 22.4 && vars.headOfficeLatitude <= 26.5)) && (!has(vars.headOfficeLongitude) || vars.headOfficeLongitude == null || (vars.headOfficeLongitude >= 51.0 && vars.headOfficeLongitude <= 56.6)))) && (!has(vars.headOfficeGooglePlaceId) || vars.headOfficeGooglePlaceId == null || vars.headOfficeGooglePlaceId.size() <= 255)") @transaction {
