# A property cover change is atomic: previous cover flags are reset before the
# selected active property photo is marked as the new cover.
mutation SetPropertyMediaCover($organizationId: UUID!, $propertyId: UUID!, $id: UUID!, $sortOrder: Int!)
  @auth(expr: "auth != null && auth.token.email_verified == true && auth.token.firebase.sign_in_provider == 'password' && vars.sortOrder >= 0 && vars.sortOrder <= 500") @transaction {
  actor: membership_update(first: {where: {organizationId: {eq: $organizationId}, userProfileUid: {eq_expr: "auth.uid"}, status: {eq: ACTIVE}, role: {in: [OWNER, ADMIN]}}}, data: {status: ACTIVE}) @redact @check(expr: "this != null", message: "INVENTORY_ADMIN_REQUIRED")
  query @redact {
    target: inventoryMedia(first: {where: {organizationId: {eq: $organizationId}, propertyId: {eq: $propertyId}, id: {eq: $id}, status: {eq: ACTIVE}, mediaKind: {eq: PROPERTY_PHOTO}, contentType: {in: ["image/jpeg", "image/png", "image/webp"]}, archivedAt: {isNull: true}}}) @check(expr: "this != null", message: "MEDIA_NOT_FOUND") {id}
  }
  clearCovers: inventoryMedia_updateMany(where: {organizationId: {eq: $organizationId}, propertyId: {eq: $propertyId}, status: {eq: ACTIVE}, isCover: {eq: true}, archivedAt: {isNull: true}}, data: {isCover: false, updatedAt_expr: "request.time"})
  inventoryMedia_update(first: {where: {organizationId: {eq: $organizationId}, propertyId: {eq: $propertyId}, id: {eq: $id}, status: {eq: ACTIVE}, mediaKind: {eq: PROPERTY_PHOTO}, contentType: {in: ["image/jpeg", "image/png", "image/webp"]}, archivedAt: {isNull: true}}}, data: {sortOrder: $sortOrder, isCover: true, updatedAt_expr: "request.time"}) @check(expr: "this != null", message: "MEDIA_NOT_FOUND")
  auditLog_insert(data: {organizationId: $organizationId, actorUid_expr: "auth.uid", action: PROPERTY_UPDATED, targetType: INVENTORY_MEDIA, targetId: $id})
}
