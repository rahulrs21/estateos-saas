# Phase 6F: communication hub (docs/COMMUNICATION_HUB.md, docs/CALL_PRIVACY_COMPLIANCE.md).
# Additive tables only. A call record is EstateOS's own record of a call: logged
# manually by the agent, or (later, once a provider is verified and approved)
# created from signed provider events. The connection status of a call and the
# sales outcome the agent records are separate fields; a dial attempt is never
# counted as a conversation.

enum CallDirection { OUTBOUND INBOUND }
enum CallSource { MANUAL PROVIDER }
# SERVICE: a call the customer asked for or that serves an existing request.
# FOLLOW_UP: a follow-up on the customer's own enquiry. MARKETING: an
# unsolicited promotional call (UAE telemarketing rules apply).
enum CallType { SERVICE FOLLOW_UP MARKETING INBOUND_ENQUIRY }
enum CallStatus { INITIATED RINGING IN_PROGRESS COMPLETED FAILED BUSY NO_ANSWER CANCELLED }
enum CallOutcome { INTERESTED NOT_INTERESTED CALLBACK_REQUESTED VIEWING_REQUESTED NO_DECISION WRONG_NUMBER DO_NOT_CALL_REQUESTED OFFER_REJECTED }
enum CommunicationSuppressionScope { ALL MARKETING }
enum CommunicationSuppressionReason { OPT_OUT DNCR_LISTED OFFER_REJECTED WRONG_NUMBER OTHER }
enum CommunicationProviderType { TWILIO RETELL PBX OTHER_APPROVED_PROVIDER }
# NOT_CONFIGURED: details missing. CONFIGURED: details saved, not verified. VERIFIED: EstateOS checked the
# credentials with the provider. Any change to the details returns it to CONFIGURED.
enum CommunicationConnectionStatus { NOT_CONFIGURED CONFIGURED VERIFIED DISABLED ERROR }
enum PhoneLinePurpose { SALES SUPPORT MARKETING VOICE_ASSISTANT }
enum PhoneLineStatus { PENDING ACTIVE DISABLED }
# Consent evidence for recording a call and keeping its transcript (6F.3).
enum CallConsentStatus { NOTICE_GIVEN GIVEN DECLINED WITHDRAWN }
enum CallMediaStatus { STORED DELETED }
enum TranscriptSource { UPLOAD PROVIDER }
# Claude call summaries (6F.4): a draft until the agent reviews it; suggestions wait for a person.
enum CallSummaryStatus { DRAFT REVIEWED DISMISSED }
enum CallSuggestionStatus { PENDING ACCEPTED DISMISSED }

# One row per company; absent means the defaults below. Every switch that
# widens what EstateOS may do (telemarketing, recording, AI analysis, live
# calling) is off by default and changed only by an OWNER or ADMIN.
type CommunicationSettings @table(key: ["organization"]) {
  organizationId: UUID!
  organization: Organization!
  revision: Int! @default(value: 1)
  timeZone: String! @default(value: "Asia/Dubai") @col(dataType: "varchar(64)")
  # Company policy for every call (not a legal limit): local HH:MM.
  callingWindowStart: String! @default(value: "08:00") @col(dataType: "varchar(5)")
  callingWindowEnd: String! @default(value: "21:00") @col(dataType: "varchar(5)")
  maxCallsPerContactPerDay: Int! @default(value: 3)
  # Marketing calls (Cabinet Resolution 56 of 2024): TDRA approval, 09:00-18:00,
  # at most one a day and two a week when unanswered.
  telemarketingEnabled: Boolean! @default(value: false)
  telemarketingApprovalReference: String @col(dataType: "varchar(120)")
  marketingWindowStart: String! @default(value: "09:00") @col(dataType: "varchar(5)")
  marketingWindowEnd: String! @default(value: "18:00") @col(dataType: "varchar(5)")
  marketingMaxCallsPerDay: Int! @default(value: 1)
  marketingMaxUnansweredPerWeek: Int! @default(value: 2)
  # Destinations: calling codes without "+", comma separated (for example "971").
  allowedCallingCodes: String! @default(value: "971") @col(dataType: "varchar(120)")
  # Live calling through a provider: an OWNER or ADMIN confirms the provider
  # and operating arrangements were verified (versioned statement).
  liveCallingAttestedBy: UserProfile
  liveCallingAttestedAt: Timestamp
  liveCallingAttestationVersion: String @col(dataType: "varchar(20)")
  maxConcurrentLiveCalls: Int! @default(value: 5)
  maxLiveCallsPerAgentPerDay: Int! @default(value: 60)
  # Recording: never silent. Needs a notice, a legal basis and a retention period.
  recordingEnabled: Boolean! @default(value: false)
  recordingNoticeText: String @col(dataType: "varchar(1000)")
  recordingLegalBasis: String @col(dataType: "varchar(500)")
  retentionDays: Int! @default(value: 90)
  # Claude analysis of transcripts and notes (separate from recording).
  aiAnalysisEnabled: Boolean! @default(value: false)
  updatedBy: UserProfile
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Numbers EstateOS must not call (or must not call for marketing). Rows are
# never deleted: withdrawing keeps the evidence.
type CommunicationSuppression @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "normalizedNumber", "withdrawnAt"])
  @index(fields: ["organizationId", "createdAt"], order: [ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  normalizedNumber: String! @col(dataType: "varchar(16)")
  scope: CommunicationSuppressionScope!
  reason: CommunicationSuppressionReason!
  # CALL_OUTCOME, ADMINISTRATOR or DNCR_CHECK.
  source: String! @col(dataType: "varchar(20)")
  note: String @col(dataType: "varchar(500)")
  # Plain identifier: the call whose outcome created the suppression.
  callId: UUID
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  withdrawnAt: Timestamp
  withdrawnBy: UserProfile
  withdrawalReason: String @col(dataType: "varchar(500)")
}

type CallRecord @table(key: ["organization", "id"])
  # One record per provider call (manual calls have no provider call ID; NULLs never collide).
  @unique(fields: ["organizationId", "providerConnectionId", "providerCallId"])
  @index(fields: ["organizationId", "leadId", "startedAt"], order: [ASC, ASC, DESC])
  @index(fields: ["organizationId", "contactId", "startedAt"], order: [ASC, ASC, DESC])
  @index(fields: ["organizationId", "agentMembershipId", "startedAt"], order: [ASC, ASC, DESC])
  @index(fields: ["organizationId", "counterpartyNumber", "startedAt"], order: [ASC, ASC, DESC])
  @index(fields: ["organizationId", "callStatus", "startedAt"], order: [ASC, ASC, DESC])
  @index(fields: ["organizationId", "startedAt"], order: [ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  leadId: UUID
  lead: Lead @ref(fields: ["organizationId", "leadId"], references: ["organizationId", "id"])
  contactId: UUID
  contact: Contact @ref(fields: ["organizationId", "contactId"], references: ["organizationId", "id"])
  # The member who made or took the call.
  agentMembershipId: UUID!
  agentMembership: Membership! @ref(fields: ["organizationId", "agentMembershipId"], references: ["organizationId", "id"], constraintName: "call_record_agent_membership_fkey")
  direction: CallDirection!
  source: CallSource!
  callType: CallType!
  callerNumber: String @col(dataType: "varchar(32)")
  recipientNumber: String @col(dataType: "varchar(32)")
  # The customer's number in E.164, taken from the lead or contact on record.
  counterpartyNumber: String @col(dataType: "varchar(16)")
  startedAt: Timestamp!
  answeredAt: Timestamp
  endedAt: Timestamp
  durationSeconds: Int! @default(value: 0)
  callStatus: CallStatus!
  outcome: CallOutcome
  notes: String @col(dataType: "varchar(4000)")
  followUpRequired: Boolean! @default(value: false)
  followUpId: UUID
  followUp: LeadFollowUp @ref(fields: ["organizationId", "followUpId"], references: ["organizationId", "id"])
  viewingId: UUID
  viewing: LeadPropertyViewing @ref(fields: ["organizationId", "viewingId"], references: ["organizationId", "id"])
  # Provider calls (6F.2): the verified connection, the provider's call ID and the company line used.
  providerConnectionId: UUID
  providerConnection: CommunicationProviderConnection @ref(fields: ["organizationId", "providerConnectionId"], references: ["organizationId", "id"], constraintName: "call_record_provider_connection_fkey")
  providerCallId: String @col(dataType: "varchar(80)")
  phoneLineId: UUID
  phoneLine: CommunicationPhoneLine @ref(fields: ["organizationId", "phoneLineId"], references: ["organizationId", "id"])
  # Compare-and-set for edits.
  revision: Int! @default(value: 1)
  createdBy: UserProfile!
  updatedBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# A company's account with an approved communications provider. Credentials are
# never stored here: secretRef names a server-side secret (an environment
# variable locally, Secret Manager when hosted) that only EstateOS's server
# reads. Webhooks are mapped to the company by this row's ID, then checked with
# its secret and its provider account ID.
type CommunicationProviderConnection @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "connectionStatus"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  providerType: CommunicationProviderType!
  displayName: String! @col(dataType: "varchar(80)")
  connectionStatus: CommunicationConnectionStatus! @default(value: NOT_CONFIGURED)
  # The name of the server secret holding the credential (never the credential).
  secretRef: String @col(dataType: "varchar(80)")
  # Non-secret provider account identifier (for example a Twilio Account SID or a Retell agent ID).
  externalAccountId: String @col(dataType: "varchar(80)")
  verificationNote: String @col(dataType: "varchar(300)")
  verifiedBy: UserProfile
  verifiedAt: Timestamp
  lastWebhookAt: Timestamp
  revision: Int! @default(value: 1)
  createdBy: UserProfile!
  updatedBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# A company number on a provider. ACTIVE needs an assigned active member and an
# OWNER or ADMIN's confirmation that the number is registered to the company's
# commercial licence (UAE marketing calls must use such numbers).
type CommunicationPhoneLine @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "phoneNumber"])
  @index(fields: ["organizationId", "assignedMembershipId", "status"])
  @index(fields: ["organizationId", "providerConnectionId", "status"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  providerConnectionId: UUID!
  providerConnection: CommunicationProviderConnection! @ref(fields: ["organizationId", "providerConnectionId"], references: ["organizationId", "id"], constraintName: "phone_line_provider_connection_fkey")
  phoneNumber: String! @col(dataType: "varchar(16)")
  displayName: String @col(dataType: "varchar(80)")
  assignedMembershipId: UUID
  assignedMembership: Membership @ref(fields: ["organizationId", "assignedMembershipId"], references: ["organizationId", "id"], constraintName: "phone_line_assigned_membership_fkey")
  # Click-to-call rings the assigned agent here first, then connects the customer (E.164).
  forwardToNumber: String @col(dataType: "varchar(16)")
  linePurpose: PhoneLinePurpose! @default(value: SALES)
  status: PhoneLineStatus! @default(value: PENDING)
  registrationConfirmedBy: UserProfile
  registrationConfirmedAt: Timestamp
  revision: Int! @default(value: 1)
  createdBy: UserProfile!
  updatedBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Every signed provider event EstateOS accepted, once: the unique key turns a
# retried or replayed delivery into a no-op. No raw payload is stored.
type CallProviderEvent @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "providerConnectionId", "eventKey"])
  @index(fields: ["organizationId", "callId", "receivedAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  providerConnectionId: UUID!
  providerConnection: CommunicationProviderConnection! @ref(fields: ["organizationId", "providerConnectionId"], references: ["organizationId", "id"], constraintName: "call_provider_event_connection_fkey")
  eventKey: String! @col(dataType: "varchar(200)")
  # CALL_STATUS, RECORDING, TRANSCRIPT or ANALYSIS.
  eventType: String! @col(dataType: "varchar(20)")
  providerCallId: String @col(dataType: "varchar(80)")
  callId: UUID
  call: CallRecord @ref(fields: ["organizationId", "callId"], references: ["organizationId", "id"])
  callStatus: CallStatus
  # APPLIED, NO_CHANGE, FINAL, OUT_OF_ORDER, UNMATCHED, NOT_ELIGIBLE or IGNORED.
  result: String! @default(value: "RECEIVED") @col(dataType: "varchar(20)")
  occurredAt: Timestamp
  receivedAt: Timestamp! @default(expr: "request.time")
}
# Evidence that the customer was told about recording (and agreed, where the
# company's legal basis is consent), captured by the agent for one call. Never
# deleted; withdrawing it deletes the call's recordings and transcripts that
# relied on it. The notice text and legal basis are copied from the company
# settings at the time, so later changes do not rewrite the evidence.
type CallConsentEvidence @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "callId", "capturedAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  callId: UUID!
  call: CallRecord! @ref(fields: ["organizationId", "callId"], references: ["organizationId", "id"])
  status: CallConsentStatus!
  # VERBAL_ON_CALL, ANNOUNCEMENT or WRITTEN.
  method: String! @col(dataType: "varchar(20)")
  purpose: String! @col(dataType: "varchar(200)")
  legalBasis: String! @col(dataType: "varchar(500)")
  noticeText: String! @col(dataType: "varchar(1000)")
  note: String @col(dataType: "varchar(500)")
  capturedBy: UserProfile!
  capturedAt: Timestamp! @default(expr: "request.time")
  withdrawnAt: Timestamp
  withdrawnBy: UserProfile
  withdrawalNote: String @col(dataType: "varchar(500)")
}

# A call recording in private storage (organizations/{company}/communications/...),
# served only through an authorized route; never a public URL.
type CallRecording @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "callId", "status"])
  @index(fields: ["status", "retentionUntil"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  callId: UUID!
  call: CallRecord! @ref(fields: ["organizationId", "callId"], references: ["organizationId", "id"])
  consentEvidenceId: UUID!
  consentEvidence: CallConsentEvidence! @ref(fields: ["organizationId", "consentEvidenceId"], references: ["organizationId", "id"], constraintName: "call_recording_consent_fkey")
  # UPLOAD (from the company's approved phone service) or PROVIDER.
  source: String! @col(dataType: "varchar(20)")
  storagePath: String! @col(dataType: "varchar(300)")
  contentType: String! @col(dataType: "varchar(40)")
  byteSize: Int!
  durationSeconds: Int!
  status: CallMediaStatus! @default(value: STORED)
  recordedAt: Timestamp!
  retentionUntil: Timestamp!
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  deletedAt: Timestamp
  deletedBy: UserProfile
  # OWNER_OR_ADMIN, CONSENT_WITHDRAWN or RETENTION.
  deletionReason: String @col(dataType: "varchar(30)")
  fileDeletedAt: Timestamp
}

# A transcript (segments with timestamps, stored privately as JSON). It may contain errors.
type CallTranscript @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "callId", "status"])
  @index(fields: ["status", "retentionUntil"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  callId: UUID!
  call: CallRecord! @ref(fields: ["organizationId", "callId"], references: ["organizationId", "id"])
  consentEvidenceId: UUID!
  consentEvidence: CallConsentEvidence! @ref(fields: ["organizationId", "consentEvidenceId"], references: ["organizationId", "id"], constraintName: "call_transcript_consent_fkey")
  source: TranscriptSource!
  # The service that produced it (for example the phone system's name).
  sourceName: String @col(dataType: "varchar(80)")
  # en, ar, mixed or unknown, detected from the text (an estimate).
  language: String! @col(dataType: "varchar(10)")
  transcriptReference: String! @col(dataType: "varchar(300)")
  segmentCount: Int!
  hasTimestamps: Boolean!
  status: CallMediaStatus! @default(value: STORED)
  generatedAt: Timestamp!
  retentionUntil: Timestamp!
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  deletedAt: Timestamp
  deletedBy: UserProfile
  deletionReason: String @col(dataType: "varchar(30)")
  fileDeletedAt: Timestamp
}
# A Claude summary of one call, from its transcript or the agent's notes, with
# every item's evidence checked by EstateOS (docs/AI_CALL_INTELLIGENCE.md).
# Cleared (deletedAt) when the transcript it came from is withdrawn, deleted or expires.
type CallAiSummary @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "callId", "createdAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  callId: UUID!
  call: CallRecord! @ref(fields: ["organizationId", "callId"], references: ["organizationId", "id"])
  # TRANSCRIPT or NOTES.
  sourceKind: String! @col(dataType: "varchar(12)")
  transcriptId: UUID
  transcript: CallTranscript @ref(fields: ["organizationId", "transcriptId"], references: ["organizationId", "id"], constraintName: "call_ai_summary_transcript_fkey")
  summaryJson: String! @col(dataType: "varchar(40000)")
  overallConfidence: String! @col(dataType: "varchar(6)")
  unverifiedCount: Int! @default(value: 0)
  model: String! @col(dataType: "varchar(80)")
  promptVersion: String! @col(dataType: "varchar(20)")
  status: CallSummaryStatus! @default(value: DRAFT)
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  reviewedBy: UserProfile
  reviewedAt: Timestamp
  deletedAt: Timestamp
}

# A suggested next action from a summary. Accepting one runs the matching
# existing operation as the member (for example a lead follow-up); nothing is
# sent or changed automatically.
type CallAiSuggestion @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "summaryId"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  summaryId: UUID!
  summary: CallAiSummary! @ref(fields: ["organizationId", "summaryId"], references: ["organizationId", "id"])
  callId: UUID!
  call: CallRecord! @ref(fields: ["organizationId", "callId"], references: ["organizationId", "id"], constraintName: "call_ai_suggestion_call_fkey")
  kind: String! @col(dataType: "varchar(30)")
  title: String! @col(dataType: "varchar(120)")
  detail: String! @col(dataType: "varchar(400)")
  basis: String! @col(dataType: "varchar(10)")
  confidence: String! @col(dataType: "varchar(6)")
  verified: Boolean!
  status: CallSuggestionStatus! @default(value: PENDING)
  # What accepting it produced: FOLLOW_UP (with resultId), CONTENT_STUDIO or VIEWING_FORM.
  resultType: String @col(dataType: "varchar(30)")
  resultId: UUID
  decidedBy: UserProfile
  decidedAt: Timestamp
}
# Voice assistant foundation (6F.5, docs/AI_VOICE_ARCHITECTURE.md). Test mode
# only: there is no live status, and nothing here places or answers a call.
# DRAFT: being prepared. TEST_ONLY: an OWNER or ADMIN may run simulated calls.
enum VoiceAssistantStatus { DRAFT TEST_ONLY }
# HANDED_OFF: passed to a person (asked for, outside the approved facts, or Claude unavailable).
# LIMIT_REACHED: the turn or time limit ended it.
enum VoiceTestSessionStatus { ACTIVE HANDED_OFF ENDED LIMIT_REACHED }

# One per company. The assistant may use only facts read from the allowed
# projects and listings (never leads or contacts) and must disclose that it is
# an AI first. Lists are JSON arrays, validated by the server.
type VoiceAssistantConfig @table(key: ["organization"]) {
  organizationId: UUID!
  organization: Organization!
  revision: Int! @default(value: 1)
  status: VoiceAssistantStatus! @default(value: DRAFT)
  assistantName: String! @col(dataType: "varchar(60)")
  disclosureText: String! @col(dataType: "varchar(400)")
  greeting: String! @col(dataType: "varchar(400)")
  questionsJson: String! @col(dataType: "varchar(2000)")
  handoffMessage: String! @col(dataType: "varchar(400)")
  projectIdsJson: String! @col(dataType: "varchar(500)")
  listingIdsJson: String! @col(dataType: "varchar(500)")
  maxTurns: Int! @default(value: 12)
  maxSessionMinutes: Int! @default(value: 10)
  maxReplyTokens: Int! @default(value: 2000)
  updatedBy: UserProfile!
  updatedAt: Timestamp! @default(expr: "request.time")
}

# A simulated conversation typed by an OWNER or ADMIN. Always synthetic and
# labelled TEST. Written only by the server (each assistant turn is checked
# against the facts snapshot first), with a revision for compare-and-set.
type VoiceAssistantTestSession @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "createdAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  configRevision: Int!
  status: VoiceTestSessionStatus! @default(value: ACTIVE)
  revision: Int! @default(value: 1)
  # The approved facts read when the test started (allowlisted fields only).
  factsJson: String! @col(dataType: "varchar(40000)")
  turnsJson: String! @col(dataType: "varchar(40000)")
  callerTurns: Int! @default(value: 0)
  # A reply being prepared; the caller can interrupt it until it is saved.
  pendingTurnId: UUID
  pendingSince: Timestamp
  handoffReason: String @col(dataType: "varchar(30)")
  # A viewing the caller asked for: a request for staff, never a booking.
  viewingRequestJson: String @col(dataType: "varchar(1000)")
  inputTokens: Int! @default(value: 0)
  outputTokens: Int! @default(value: 0)
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  endedAt: Timestamp
}
