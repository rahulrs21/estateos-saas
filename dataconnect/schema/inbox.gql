# Phase 7A: unified inbox (docs/UNIFIED_INBOX.md, docs/INBOX_SECURITY.md).
# Additive tables only. Conversations from WhatsApp, email, website enquiries and
# the developer simulator share one model. Provider secrets are never stored:
# a connection names its secret (credentialReference); the value lives in the
# server environment or Secret Manager. Nothing in Phase 7A sends a message to
# a real customer: only the developer simulator's connection may "send".

enum ChannelProvider { WHATSAPP_CLOUD GMAIL MICROSOFT_365 WEBSITE_FORM INTERNAL DEVELOPMENT_SIMULATOR }
# VERIFIED needs a live check with the provider (Phase 7B/7C); 7A connections stop at CONFIGURED.
enum ChannelConnectionStatus { NOT_CONFIGURED CONFIGURED VERIFIED DISABLED ERROR }
enum InboxChannel { WHATSAPP EMAIL WEBSITE INTERNAL }
enum InboxConversationStatus { OPEN PENDING RESOLVED CLOSED }
enum InboxPriority { LOW NORMAL HIGH URGENT }
enum InboxDirection { INBOUND OUTBOUND }
# UNKNOWN keeps a provider message type EstateOS does not handle yet, shown safely as text.
enum InboxMessageType { TEXT IMAGE DOCUMENT AUDIO VIDEO TEMPLATE SYSTEM UNKNOWN LOCATION CONTACTS }
# SENT, DELIVERED and READ come only from provider acknowledgements and receipts, never from queueing.
enum InboxDeliveryStatus { DRAFT QUEUED SENT DELIVERED READ FAILED RECEIVED UNKNOWN }
enum InboxEventStatus { RECEIVED PROCESSED DUPLICATE FAILED DEAD }
enum OutboundStage { DRAFT VALIDATED PENDING_APPROVAL APPROVED QUEUED SENT FAILED CANCELLED }
enum InboxAttachmentScan { PENDING CLEAN BLOCKED NOT_SCANNED }

# A company's account with a channel provider. The company comes from this row
# (by its ID in the webhook URL), never from a payload; the external account
# reference (for example a WhatsApp phone number ID) belongs to one company only.
type ChannelConnection @table(key: ["organization", "id"])
  @unique(fields: ["provider", "externalAccountReference"])
  @index(fields: ["organizationId", "provider"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  provider: ChannelProvider!
  displayName: String! @col(dataType: "varchar(80)")
  externalAccountReference: String @col(dataType: "varchar(200)")
  connectionStatus: ChannelConnectionStatus! @default(value: NOT_CONFIGURED)
  # The name of the secret (INBOX_…), never its value.
  credentialReference: String @col(dataType: "varchar(64)")
  # Phase 7B: the name of the secret holding the provider access token (WhatsApp Cloud API), never its value.
  accessTokenReference: String @col(dataType: "varchar(64)")
  # Phase 7B.2: the WhatsApp Business Account the phone number belongs to (digits; its templates are listed from it).
  businessAccountReference: String @col(dataType: "varchar(40)")
  # Set by a live connection check (Phase 7B): the provider confirmed the account with the token.
  verifiedAt: Timestamp
  verifiedName: String @col(dataType: "varchar(160)")
  verifiedDisplayNumber: String @col(dataType: "varchar(32)")
  sendingEnabled: Boolean! @default(value: false)
  # Phase 7B.2: sends to any customer, not only the server's test numbers. Turned on by an OWNER only (and only
  # where the server allows it); editing, disabling, a failed check or sending off turn it off again.
  liveSending: Boolean! @default(value: false)
  # When and by whom the switch was last changed.
  liveSendingAt: Timestamp
  liveSendingBy: UserProfile
  # The last verified webhook event (shown to administrators; never proof of a working connection).
  lastEventAt: Timestamp
  # When an owner or administrator saved the WhatsApp access token in EstateOS (stored encrypted in
  # ChannelCredential); null when the token is a server secret named by accessTokenReference.
  accessTokenStoredAt: Timestamp
  # Phase 7C: a personal mailbox belongs to this member; null for company mailboxes and other channels.
  ownerMembershipId: UUID
  ownerMembership: Membership @ref(fields: ["organizationId", "ownerMembershipId"], references: ["organizationId", "id"], constraintName: "channel_connection_owner_fkey")
  revision: Int! @default(value: 1)
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# A provider access token an owner or administrator pasted for a company channel (WhatsApp), so they never
# handle server secret names. Server-only: every read is NO_ACCESS, so no member query can see it, and the
# token is stored only encrypted (AES-256-GCM, bound to the company and the connection; the key lives in
# the server environment), never in plaintext.
type ChannelCredential @table(key: ["organization", "channelConnectionId"]) {
  organizationId: UUID!
  organization: Organization!
  channelConnectionId: UUID!
  channelConnection: ChannelConnection! @ref(fields: ["organizationId", "channelConnectionId"], references: ["organizationId", "id"], constraintName: "channel_credential_connection_fkey")
  tokenCiphertext: String! @col(dataType: "varchar(4000)")
  tokenKeyId: String! @col(dataType: "varchar(16)")
  savedBy: UserProfile!
  savedAt: Timestamp! @default(expr: "request.time")
}

# Phase 7C (docs/EMAIL_INTEGRATION_PLAN.md): a mailbox connected through OAuth.
enum InboxMailboxSyncState { ACTIVE RESYNC NEEDS_RECONNECT DISCONNECTED }

# The OAuth grant and sync cursor of a mailbox connection (Gmail). Server-only:
# every operation on this table is NO_ACCESS, so no member query can read it.
# The refresh token is stored only encrypted (AES-256-GCM, bound to the company
# and the connection; the key lives in the server environment), never in plaintext.
type InboxMailboxAccount @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "channelConnectionId"])
  @index(fields: ["syncState", "nextSyncAt"]) {
  organizationId: UUID!
  organization: Organization!
  # The connection's own ID.
  id: UUID!
  channelConnectionId: UUID!
  channelConnection: ChannelConnection! @ref(fields: ["organizationId", "channelConnectionId"], references: ["organizationId", "id"], constraintName: "inbox_mailbox_account_connection_fkey")
  tokenCiphertext: String @col(dataType: "varchar(4000)")
  tokenKeyId: String @col(dataType: "varchar(16)")
  scopes: String @col(dataType: "varchar(400)")
  # Gmail's history cursor: changes after this point are read on the next sync.
  historyId: String @col(dataType: "varchar(40)")
  syncState: InboxMailboxSyncState! @default(value: ACTIVE)
  # The bounded first import (recent days) is done.
  backfilled: Boolean! @default(value: false)
  nextSyncAt: Timestamp
  # A sync in progress holds the lease until this time (parallel worker ticks never share a mailbox).
  leaseId: UUID
  leaseUntil: Timestamp
  lastSyncedAt: Timestamp
  failures: Int! @default(value: 0)
  lastErrorCode: String @col(dataType: "varchar(64)")
  connectedAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Company inbox rules; absent means the defaults.
type InboxSettings @table(key: ["organization"]) {
  organizationId: UUID!
  organization: Organization!
  revision: Int! @default(value: 1)
  # Outbound messages wait for an OWNER, ADMIN or MANAGER (not their author, unless an OWNER).
  approvalRequired: Boolean! @default(value: true)
  retentionDays: Int! @default(value: 730)
  unansweredMinutes: Int! @default(value: 120)
  # Claude reads conversations only when an OWNER or ADMIN turns this on (Phase 7A.5).
  aiEnabled: Boolean! @default(value: false)
  updatedBy: UserProfile
  updatedAt: Timestamp! @default(expr: "request.time")
}

# One conversation with one customer identity on one channel thread.
type InboxConversation @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "channelConnectionId", "externalThreadId"])
  @index(fields: ["organizationId", "lastMessageAt"], order: [ASC, DESC])
  @index(fields: ["organizationId", "assignedMembershipId", "lastMessageAt"], order: [ASC, ASC, DESC])
  @index(fields: ["organizationId", "status", "lastMessageAt"], order: [ASC, ASC, DESC])
  @index(fields: ["organizationId", "leadId"])
  @index(fields: ["organizationId", "contactId"])
  @index(fields: ["organizationId", "customerIdentity"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  channelConnectionId: UUID
  channelConnection: ChannelConnection @ref(fields: ["organizationId", "channelConnectionId"], references: ["organizationId", "id"], constraintName: "inbox_conversation_connection_fkey")
  channel: InboxChannel!
  externalThreadId: String! @col(dataType: "varchar(200)")
  # The normalized phone (E.164) or email the customer writes from.
  customerIdentity: String! @col(dataType: "varchar(254)")
  # The name the channel reported (untrusted, shown as text).
  customerName: String @col(dataType: "varchar(160)")
  subject: String @col(dataType: "varchar(300)")
  contactId: UUID
  contact: Contact @ref(fields: ["organizationId", "contactId"], references: ["organizationId", "id"], constraintName: "inbox_conversation_contact_fkey")
  leadId: UUID
  lead: Lead @ref(fields: ["organizationId", "leadId"], references: ["organizationId", "id"], constraintName: "inbox_conversation_lead_fkey")
  assignedMembershipId: UUID
  assignedMembership: Membership @ref(fields: ["organizationId", "assignedMembershipId"], references: ["organizationId", "id"], constraintName: "inbox_conversation_assignee_fkey")
  status: InboxConversationStatus! @default(value: OPEN)
  priority: InboxPriority! @default(value: NORMAL)
  lastMessageAt: Timestamp!
  lastInboundAt: Timestamp
  lastOutboundAt: Timestamp
  lastMessagePreview: String @col(dataType: "varchar(200)")
  unreadCount: Int! @default(value: 0)
  # The customer asked not to be contacted on this channel.
  optedOut: Boolean! @default(value: false)
  simulated: Boolean! @default(value: false)
  revision: Int! @default(value: 1)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  # Phase 7E.2: the click-to-WhatsApp ad the customer came from (Meta's message `referral`; untrusted text,
  # bounded, shown as text). Kept from the first ad message; a newer ad replaces it after 30 days.
  # A lead created from the conversation takes it as its source (LinkInboxConversation).
  adSourceId: String @col(dataType: "varchar(40)")
  adSourceType: String @col(dataType: "varchar(10)")
  adHeadline: String @col(dataType: "varchar(300)")
  adBody: String @col(dataType: "varchar(500)")
  adSourceHost: String @col(dataType: "varchar(253)")
  adSourcePath: String @col(dataType: "varchar(500)")
  adCtwaClid: String @col(dataType: "varchar(256)")
  adCampaignKey: String @col(dataType: "varchar(200)")
  adReferredAt: Timestamp
}

type InboxMessage @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "channelConnectionId", "externalMessageId"])
  @index(fields: ["organizationId", "conversationId", "createdAt"], order: [ASC, ASC, DESC])
  # The retention worker finds content past the company's retention period (7A.6).
  @index(fields: ["organizationId", "contentRedactedAt", "createdAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  conversationId: UUID!
  conversation: InboxConversation! @ref(fields: ["organizationId", "conversationId"], references: ["organizationId", "id"], constraintName: "inbox_message_conversation_fkey")
  # Copied from the conversation, so a provider message is stored once per connection.
  channelConnectionId: UUID
  externalMessageId: String! @col(dataType: "varchar(200)")
  direction: InboxDirection!
  senderIdentity: String @col(dataType: "varchar(254)")
  recipientIdentity: String @col(dataType: "varchar(254)")
  messageType: InboxMessageType! @default(value: TEXT)
  # Plain text only (email HTML is converted on the server). Cleared by retention.
  content: String @col(dataType: "varchar(8000)")
  contentRedactedAt: Timestamp
  deliveryStatus: InboxDeliveryStatus!
  # A provider status EstateOS does not recognise, kept for diagnosis (bounded).
  providerStatusRaw: String @col(dataType: "varchar(40)")
  providerTimestamp: Timestamp
  # Phase 7C: the email's RFC 5322 Message-ID, for In-Reply-To and References when replying.
  internetMessageId: String @col(dataType: "varchar(300)")
  # Phase 7C: the email's HTML, cleaned on the server and only ever shown inside a sandboxed frame
  # (no scripts, remote images on request). Null: not looked up yet; size 0: the email has no usable HTML.
  # Cleared by retention with the text.
  contentHtml: String @col(dataType: "varchar(400000)")
  contentHtmlBytes: Int
  # Phase 7G.1 (docs/WHATSAPP_MEDIA_PLAN.md): a shared location or contacts, as bounded JSON validated on the server
  # ({kind: "location" | "contacts", ...}); untrusted values, shown as text. Cleared by retention with the text.
  detailsJson: String @col(dataType: "varchar(4000)")
  author: UserProfile
  simulated: Boolean! @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type InboxAttachment @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "messageId"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  messageId: UUID!
  message: InboxMessage! @ref(fields: ["organizationId", "messageId"], references: ["organizationId", "id"], constraintName: "inbox_attachment_message_fkey")
  conversationId: UUID!
  fileName: String! @col(dataType: "varchar(200)")
  mimeType: String! @col(dataType: "varchar(100)")
  sizeBytes: Int!
  # organizations/{org}/inbox/… in the private bucket; never a public URL. Null while a provider
  # file has not been fetched (provider downloads need a live connector, Phase 7B).
  storagePath: String @col(dataType: "varchar(300)")
  providerMediaId: String @col(dataType: "varchar(200)")
  # Phase 7B.2: downloading a provider file (WhatsApp media). Attempts are compare-and-set, so two workers never fetch
  # the same file; the next try, when it was stored, and why it was not (for example expired at the provider).
  mediaFetchAttempts: Int! @default(value: 0)
  mediaNextAttemptAt: Timestamp
  mediaFetchedAt: Timestamp
  mediaError: String @col(dataType: "varchar(64)")
  scanStatus: InboxAttachmentScan! @default(value: PENDING)
  createdAt: Timestamp! @default(expr: "request.time")
  deletedAt: Timestamp
}

type InboxAssignmentHistory @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "conversationId", "createdAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  conversationId: UUID!
  conversation: InboxConversation! @ref(fields: ["organizationId", "conversationId"], references: ["organizationId", "id"], constraintName: "inbox_assignment_conversation_fkey")
  fromMembershipId: UUID
  toMembershipId: UUID
  reason: String @col(dataType: "varchar(300)")
  changedBy: UserProfile
  createdAt: Timestamp! @default(expr: "request.time")
}

# Private notes for the team; never sent.
type InboxNote @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "conversationId", "createdAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  conversationId: UUID!
  conversation: InboxConversation! @ref(fields: ["organizationId", "conversationId"], references: ["organizationId", "id"], constraintName: "inbox_note_conversation_fkey")
  body: String! @col(dataType: "varchar(4000)")
  author: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A verified incoming provider event, recorded once (dedupKey) before it is applied.
# No raw payload is kept (it holds personal data); payloadDigest identifies it.
type InboxEvent @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "dedupKey"])
  @index(fields: ["organizationId", "status", "nextAttemptAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  channelConnectionId: UUID
  kind: String! @col(dataType: "varchar(40)")
  dedupKey: String! @col(dataType: "varchar(200)")
  payloadDigest: String @col(dataType: "varchar(64)")
  # The normalized event (never the raw payload), kept only until it is applied so the worker can retry it.
  normalizedJson: String @col(dataType: "varchar(12000)")
  status: InboxEventStatus! @default(value: RECEIVED)
  attempts: Int! @default(value: 0)
  nextAttemptAt: Timestamp
  errorCode: String @col(dataType: "varchar(64)")
  conversationId: UUID
  messageId: UUID
  simulated: Boolean! @default(value: false)
  receivedAt: Timestamp! @default(expr: "request.time")
  processedAt: Timestamp
}

# An outbound message from draft to delivery. Every stage change is compare-and-set.
type OutboundMessageJob @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "conversationId", "createdAt"])
  @index(fields: ["organizationId", "stage", "updatedAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  conversationId: UUID!
  conversation: InboxConversation! @ref(fields: ["organizationId", "conversationId"], references: ["organizationId", "id"], constraintName: "outbound_job_conversation_fkey")
  stage: OutboundStage! @default(value: DRAFT)
  # AGENT, CLAUDE or WORKFLOW.
  source: String! @col(dataType: "varchar(12)")
  content: String! @col(dataType: "varchar(4000)")
  # Earlier versions of the draft (JSON array, bounded).
  versionsJson: String! @default(value: "[]") @col(dataType: "varchar(20000)")
  validationJson: String @col(dataType: "varchar(2000)")
  templateName: String @col(dataType: "varchar(120)")
  # Phase 7B.2: the template's filled blanks (JSON object, bounded); the content is the rendered text.
  templateParamsJson: String @col(dataType: "varchar(4000)")
  createdBy: UserProfile!
  # Who last wrote the content (the author until someone edits it); neither may approve it unless an OWNER.
  lastEditedBy: UserProfile
  # A person changed the text after it was created (a Claude draft is then the person's own words).
  edited: Boolean! @default(value: false)
  approvalRequestedAt: Timestamp
  approvedBy: UserProfile
  approvedAt: Timestamp
  approvalNote: String @col(dataType: "varchar(300)")
  selfApproved: Boolean! @default(value: false)
  attempts: Int! @default(value: 0)
  messageId: UUID
  providerMessageId: String @col(dataType: "varchar(200)")
  failureReason: String @col(dataType: "varchar(300)")
  revision: Int! @default(value: 1)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Email opt-outs (phone opt-outs use the Phase 6F CommunicationSuppression list).
type InboxEmailOptOut @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "normalizedEmail", "withdrawnAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  normalizedEmail: String! @col(dataType: "varchar(254)")
  source: String! @col(dataType: "varchar(30)")
  conversationId: UUID
  createdBy: UserProfile
  createdAt: Timestamp! @default(expr: "request.time")
  withdrawnAt: Timestamp
}

# A Claude analysis of a conversation (Phase 7A.5, docs/UNIFIED_INBOX.md#assistant): summary,
# unanswered questions, stated requirements and next steps, each quoting a message that
# EstateOS checked. Advice for the team only; it never changes the lead or sends anything.
type InboxAiInsight @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "conversationId", "createdAt"], order: [ASC, ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  conversationId: UUID!
  conversation: InboxConversation! @ref(fields: ["organizationId", "conversationId"], references: ["organizationId", "id"], constraintName: "inbox_ai_insight_conversation_fkey")
  insightJson: String! @col(dataType: "varchar(24000)")
  unverifiedCount: Int! @default(value: 0)
  # The newest message the analysis read.
  coveredUntil: Timestamp
  draftJobId: UUID
  model: String! @col(dataType: "varchar(80)")
  promptVersion: String! @col(dataType: "varchar(40)")
  # CLAUDE (a member asked) or WORKFLOW (the inbox.draft_reply step).
  source: String! @col(dataType: "varchar(12)")
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
}
