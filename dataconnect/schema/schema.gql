# Phase 5E property portal foundation. The provider catalog is code-defined
# (src/modules/portals/adapters): each provider needs an adapter, so a seeded
# provider table would only duplicate the enum. Every table is tenant-keyed and
# references listings through tenant-composite foreign keys.
enum PortalProvider { PROPERTY_FINDER BAYUT DUBIZZLE }
# CONNECTED and ERROR are reserved for a future server-side verification job;
# administrators can set only NOT_CONFIGURED, PENDING_APPROVAL or DISABLED.
enum PortalConnectionStatus { NOT_CONFIGURED PENDING_APPROVAL CONNECTED ERROR DISABLED }
# Per-provider publication state. Only READY and VALIDATION_FAILED are written in
# this phase; the remaining values are reserved for approved live publishing.
enum ListingPublicationState { NOT_PUBLISHED VALIDATION_FAILED READY QUEUED PUBLISHED FAILED REMOVAL_REQUESTED REMOVED }
enum PublicationAction { VALIDATE PUBLISH UPDATE REMOVE }
enum PublicationOutcome { SUCCEEDED FAILED SKIPPED }
enum FeedFormat { JSON XML }
enum FeedGenerationStatus { QUEUED RUNNING SUCCEEDED FAILED CANCELLED }

# No credentials are stored here. Future API secrets belong in a server-side
# secret manager; accountReference is a non-secret portal account identifier.
type OrganizationPortalConnection @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "provider"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  provider: PortalProvider!
  status: PortalConnectionStatus! @default(value: NOT_CONFIGURED)
  accountReference: String @col(dataType: "varchar(120)")
  notes: String @col(dataType: "varchar(1000)")
  lastVerifiedAt: Timestamp
  lastErrorCode: String @col(dataType: "varchar(80)")
  createdBy: UserProfile!
  updatedBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Company overrides of an adapter's default value mapping, for example a
# property type code or a membership-to-portal-agent identifier.
type PortalFieldMapping @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "provider", "fieldKey", "sourceValue"])
  @index(fields: ["organizationId", "provider"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  provider: PortalProvider!
  fieldKey: String! @col(dataType: "varchar(40)")
  sourceValue: String! @col(dataType: "varchar(120)")
  targetValue: String! @col(dataType: "varchar(120)")
  createdBy: UserProfile!
  updatedBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# One row per listing and provider. PropertyListing.publicationStatus remains
# the company-wide summary; this row tracks each portal independently.
type ListingPublication @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "listingId", "provider"])
  @index(fields: ["organizationId", "provider", "status"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  listingId: UUID!
  listing: PropertyListing! @ref(fields: ["organizationId", "listingId"], references: ["organizationId", "id"])
  provider: PortalProvider!
  status: ListingPublicationState! @default(value: NOT_PUBLISHED)
  errorCount: Int! @default(value: 0)
  warningCount: Int! @default(value: 0)
  payloadHash: String @col(dataType: "varchar(64)")
  externalReference: String @col(dataType: "varchar(160)")
  lastValidatedAt: Timestamp
  lastPublishedAt: Timestamp
  attemptCount: Int! @default(value: 0)
  nextRetryAt: Timestamp
  createdBy: UserProfile!
  updatedBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type PublicationAttempt @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "publicationId", "createdAt"], order: [ASC, ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  publicationId: UUID!
  publication: ListingPublication! @ref(fields: ["organizationId", "publicationId"], references: ["organizationId", "id"])
  action: PublicationAction!
  outcome: PublicationOutcome!
  errorCount: Int! @default(value: 0)
  warningCount: Int! @default(value: 0)
  # Validation codes only (for example "PERMIT_REQUIRED"); never payload content.
  errorSummary: String @col(dataType: "varchar(2000)")
  payloadHash: String @col(dataType: "varchar(64)")
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Feed generation is an in-memory dry run in this phase: counts and error codes
# are recorded, the feed itself is not stored and no public URL exists.
type FeedGenerationJob @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "provider", "createdAt"], order: [ASC, ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  provider: PortalProvider!
  format: FeedFormat!
  status: FeedGenerationStatus!
  dryRun: Boolean! @default(value: true)
  listingCount: Int! @default(value: 0)
  validCount: Int! @default(value: 0)
  invalidCount: Int! @default(value: 0)
  byteSize: Int! @default(value: 0)
  errorSummary: String @col(dataType: "varchar(2000)")
  startedAt: Timestamp!
  finishedAt: Timestamp
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Phase 6A AI Copilot (docs/AI_COPILOT.md). Additive tables only.
enum AiMessageRole { USER ASSISTANT }
enum AiRequestStatus { SUCCEEDED FAILED CANCELLED }
enum AiToolExecutionStatus { SUCCEEDED FAILED REJECTED }

# A conversation is private to the member who started it in this organization.
type AiConversation @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "ownerUid", "lastMessageAt"], order: [ASC, ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  owner: UserProfile!
  title: String! @col(dataType: "varchar(120)")
  # Compare-and-set guard: each saved exchange advances this by two.
  messageCount: Int! @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  lastMessageAt: Timestamp! @default(expr: "request.time")
}

# Only completed user/assistant text is stored. Tool inputs and CRM tool
# results are never persisted; the server re-queries data on later turns.
type AiMessage @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "conversationId", "sequence"])
  @index(fields: ["organizationId", "ownerUid", "createdAt"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  conversationId: UUID!
  conversation: AiConversation! @ref(fields: ["organizationId", "conversationId"], references: ["organizationId", "id"])
  owner: UserProfile!
  sequence: Int!
  role: AiMessageRole!
  content: String! @col(dataType: "varchar(40000)")
  createdAt: Timestamp! @default(expr: "request.time")
}

# One row per Copilot request (successful or not) with provider-reported
# token usage. No prompt or response text.
type AiUsageRecord @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "createdAt"], order: [ASC, DESC])
  @index(fields: ["organizationId", "userUid", "createdAt"], order: [ASC, ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  user: UserProfile!
  # Plain identifier (no foreign key) so usage survives conversation deletion.
  conversationId: UUID
  model: String! @col(dataType: "varchar(80)")
  promptVersion: String! @col(dataType: "varchar(20)")
  status: AiRequestStatus!
  errorCode: String @col(dataType: "varchar(40)")
  inputTokens: Int! @default(value: 0)
  outputTokens: Int! @default(value: 0)
  cacheReadInputTokens: Int! @default(value: 0)
  cacheCreationInputTokens: Int! @default(value: 0)
  estimatedCostUsd: Float @col(dataType: "numeric(12,6)")
  # Phase 6B: COPILOT or CONTENT, and the content type for Content Studio
  # generations. Nullable so rows written before 6B stay valid.
  feature: String @col(dataType: "varchar(20)")
  contentType: String @col(dataType: "varchar(40)")
  modelRequests: Int! @default(value: 0)
  toolCalls: Int! @default(value: 0)
  durationMs: Int! @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
}

# Tool names, outcomes and timings only; arguments and results are not stored.
type AiToolExecution @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "usageRecordId"])
  @index(fields: ["organizationId", "toolName", "createdAt"], order: [ASC, ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  usageRecordId: UUID!
  usageRecord: AiUsageRecord! @ref(fields: ["organizationId", "usageRecordId"], references: ["organizationId", "id"])
  toolName: String! @col(dataType: "varchar(64)")
  status: AiToolExecutionStatus!
  errorCode: String @col(dataType: "varchar(40)")
  resultCount: Int
  durationMs: Int! @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
}

# Monthly request allowance counters, written only by the server-only
# ReserveAiRequest/ReleaseAiRequest statements (atomic across instances).
# subjectKey is "organization" or "user:<uid>"; periodKey is the UTC month.
type AiUsageCounter @table(key: ["organization", "periodKey", "subjectKey"]) {
  organizationId: UUID!
  organization: Organization!
  periodKey: String! @col(dataType: "varchar(7)")
  subjectKey: String! @col(dataType: "varchar(160)")
  requestCount: Int! @default(value: 0)
  updatedAt: Timestamp! @default(expr: "request.time")
}

# --- Phase 6B: AI Content Studio (docs/AI_CONTENT_STUDIO.md) ----------------

enum AiContentType { PROPERTY_DESCRIPTION PROJECT_MARKETING WHATSAPP_MESSAGE EMAIL SOCIAL_MEDIA ADVERTISING CLIENT_PROPOSAL }
enum AiContentLanguage { EN AR EN_AR }
# Internal editorial states only; they say nothing about approval by an
# advertising platform, a portal or WhatsApp.
enum AiContentDraftStatus { DRAFT IN_REVIEW APPROVED ARCHIVED }
enum AiContentVersionKind { GENERATED REGENERATED ALTERNATIVE EDITED RESTORED }

# Company-approved marketing details. Company name, phone and email stay on
# Organization; the profile only records whether they are approved for
# generated content, plus details Organization does not have.
type AiBrandProfile @table(key: ["organization"]) {
  organizationId: UUID!
  organization: Organization!
  displayName: String @col(dataType: "varchar(160)")
  logoReference: String @col(dataType: "varchar(2048)")
  brandTone: String @col(dataType: "varchar(400)")
  preferredLanguage: AiContentLanguage! @default(value: EN)
  useCompanyPhone: Boolean! @default(value: false)
  useCompanyEmail: Boolean! @default(value: false)
  website: String @col(dataType: "varchar(2048)")
  whatsappNumber: String @col(dataType: "varchar(32)")
  defaultCallToAction: String @col(dataType: "varchar(200)")
  tagline: String @col(dataType: "varchar(160)")
  marketingDisclaimer: String @col(dataType: "varchar(1000)")
  # Compare-and-set guard for concurrent edits.
  revision: Int! @default(value: 1)
  updatedBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Organization-specific style templates. They guide tone and structure only;
# they can never add facts. Private to their organization.
type AiContentTemplate @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "contentType", "isActive"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  name: String! @col(dataType: "varchar(120)")
  contentType: AiContentType!
  purpose: String @col(dataType: "varchar(40)")
  instructions: String! @col(dataType: "varchar(2000)")
  tone: String @col(dataType: "varchar(30)")
  language: AiContentLanguage
  isActive: Boolean! @default(value: true)
  revision: Int! @default(value: 1)
  createdBy: UserProfile!
  updatedBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# A generated, editable draft. Source record IDs are plain identifiers (no
# foreign keys) so drafts never block archiving or deleting CRM records; the
# server verifies access to every source before generating. contentData and
# validation hold JSON validated by the application on every read and write.
type AiContentDraft @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "createdByUid", "updatedAt"], order: [ASC, ASC, DESC])
  @index(fields: ["organizationId", "status", "updatedAt"], order: [ASC, ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  createdBy: UserProfile!
  updatedBy: UserProfile!
  contentType: AiContentType!
  purpose: String! @col(dataType: "varchar(40)")
  title: String! @col(dataType: "varchar(200)")
  language: AiContentLanguage!
  tone: String! @col(dataType: "varchar(30)")
  audience: String! @col(dataType: "varchar(30)")
  status: AiContentDraftStatus! @default(value: DRAFT)
  sourceProjectId: UUID
  sourcePropertyId: UUID
  sourceListingId: UUID
  sourceLeadId: UUID
  # JSON: every source record with its updatedAt at generation time.
  sourceRefs: String! @col(dataType: "varchar(4000)")
  templateId: UUID
  contentData: String! @col(dataType: "varchar(100000)")
  validation: String! @col(dataType: "varchar(20000)")
  model: String @col(dataType: "varchar(80)")
  generatedAt: Timestamp!
  # Compare-and-set guard: every change advances revision; versionCount is
  # the number of the newest saved version.
  revision: Int! @default(value: 1)
  versionCount: Int! @default(value: 1)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type AiContentVersion @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "draftId", "versionNumber"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  draftId: UUID!
  draft: AiContentDraft! @ref(fields: ["organizationId", "draftId"], references: ["organizationId", "id"])
  versionNumber: Int!
  kind: AiContentVersionKind!
  title: String! @col(dataType: "varchar(200)")
  contentData: String! @col(dataType: "varchar(100000)")
  validation: String! @col(dataType: "varchar(20000)")
  model: String @col(dataType: "varchar(80)")
  generatedAt: Timestamp
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Local development demo data (npm run seed:demo). One row per fictional fixture
# the seed created in a company: the (organization, fixtureKey) key is the
# database-level guarantee that re-running the seed never creates duplicates,
# and the rows identify demo records. Written only by the guarded local seed;
# no connector operation reads or writes it.
type DemoFixtureRecord @table(key: ["organization", "fixtureKey"])
  @index(fields: ["organizationId", "recordType"]) {
  organizationId: UUID!
  organization: Organization!
  fixtureKey: String! @col(dataType: "varchar(120)")
  fixtureSet: String! @col(dataType: "varchar(40)")
  recordType: String! @col(dataType: "varchar(40)")
  # Null while claimed: set in the same run once the record exists.
  recordId: UUID
  createdAt: Timestamp! @default(expr: "request.time")
  completedAt: Timestamp
}

# --- Phase 6C: AI sales intelligence (docs/AI_SALES_INTELLIGENCE.md) ----------
# Customer-stated qualification facts are recorded by staff in their own table;
# AI assessments, reviews and Claude output are separate from CRM records and
# never change the lead.

enum LeadTimeline { IMMEDIATE WITHIN_3_MONTHS WITHIN_6_MONTHS WITHIN_12_MONTHS LATER UNDECIDED }
enum LeadReadiness { READY_TO_PROCEED EXPLORING NOT_READY }
enum AiLeadPriority { HIGH MEDIUM LOW INSUFFICIENT_DATA }
enum AiSalesInsightKind { LEAD_ANALYSIS VIEWING_BRIEF PIPELINE_SUMMARY }

# What the customer told the agency about timing and readiness. One row per
# lead; every change is a compare-and-set on revision, with activity and audit.
type LeadQualificationDetails @table(key: ["organization", "id"])
  @unique(fields: ["organizationId", "leadId"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  leadId: UUID!
  lead: Lead! @ref(fields: ["organizationId", "leadId"], references: ["organizationId", "id"])
  timeline: LeadTimeline
  readiness: LeadReadiness
  revision: Int! @default(value: 1)
  updatedBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Append-only history of rule-based lead qualification. `result` holds the
# evaluated inputs, factors, missing information and suggested actions as JSON,
# so every score can be recomputed and audited against its rule version.
type LeadQualificationAssessment @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "leadId", "evaluatedAt"], order: [ASC, ASC, DESC])
  @index(fields: ["organizationId", "evaluatedAt"], order: [ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  leadId: UUID!
  lead: Lead! @ref(fields: ["organizationId", "leadId"], references: ["organizationId", "id"])
  ruleVersion: String! @col(dataType: "varchar(40)")
  configHash: String! @col(dataType: "varchar(16)")
  score: Int
  priority: AiLeadPriority!
  sufficientData: Boolean!
  result: String! @col(dataType: "varchar(20000)")
  evaluatedBy: UserProfile!
  evaluatedAt: Timestamp! @default(expr: "request.time")
}

# A person's review of a suggested priority: kept or overridden, always with a reason.
type LeadPriorityReview @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "leadId", "createdAt"], order: [ASC, ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  leadId: UUID!
  lead: Lead! @ref(fields: ["organizationId", "leadId"], references: ["organizationId", "id"])
  assessmentId: UUID!
  assessment: LeadQualificationAssessment! @ref(fields: ["organizationId", "assessmentId"], references: ["organizationId", "id"])
  suggestedPriority: AiLeadPriority!
  reviewedPriority: AiLeadPriority!
  reason: String! @col(dataType: "varchar(500)")
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Validated Claude output (lead analyses, viewing briefs, pipeline summaries).
# Lead-linked insights follow the lead's visibility; pipeline summaries are
# private to the member who generated them.
type AiSalesInsight @table(key: ["organization", "id"])
  @index(fields: ["organizationId", "leadId", "kind", "createdAt"], order: [ASC, ASC, ASC, DESC])
  @index(fields: ["organizationId", "createdByUid", "kind", "createdAt"], order: [ASC, ASC, ASC, DESC]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  kind: AiSalesInsightKind!
  leadId: UUID
  lead: Lead @ref(fields: ["organizationId", "leadId"], references: ["organizationId", "id"])
  propertyId: UUID
  viewingId: UUID
  assessmentId: UUID
  content: String! @col(dataType: "varchar(60000)")
  model: String! @col(dataType: "varchar(80)")
  promptVersion: String! @col(dataType: "varchar(20)")
  createdBy: UserProfile!
  createdAt: Timestamp! @default(expr: "request.time")
}
